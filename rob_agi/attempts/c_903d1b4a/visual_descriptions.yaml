example_0:
  input: |
    16x16 grid with perfect 180-degree rotational symmetry, except for green (3) areas. Border: alternating magenta (6), sky (8), blue (1) pattern. Center: large green (3) cross. Surrounding the cross: intricate patterns of orange (7), gray (5), yellow (4). Red (2) squares in cross corners. Key observation: green disrupts symmetry and doesn't follow border pattern.
  output: |
    16x16 grid, identical border to input. Green cross removed entirely. Interior filled with extended patterns of orange (7), gray (5), yellow (4), maintaining perfect 180-degree rotational symmetry. Red (2) squares in former cross corners preserved. Note how patterns seamlessly replace green while maintaining overall structure and symmetry.

example_1:
  input: |
    16x16 grid, nearly symmetrical. Border: yellow (4), brown (9), orange (7), magenta (6) pattern. Center: white (1) cross. Surrounding: complex orange (7), brown (9) patterns. Corners: sky (8) squares. Bottom-right quadrant: large green (3) area breaking symmetry. Key focus: how green disrupts otherwise symmetrical design.
  output: |
    16x16 grid, identical border. Green area in bottom-right replaced to mirror top-left, restoring perfect 180-degree rotational symmetry. Central white (1) cross and surrounding orange (7), brown (9), sky (8) patterns preserved and extended where necessary. Observe how symmetry is achieved by appropriate color choices in formerly green areas.

example_2:
  input: |
    16x16 grid, border of orange (7) and red (2). Center: cross of brown (9) and magenta (6). Surrounding: white (1) and sky (8) patterns. Green (3) squares scattered, notably a small cross at bottom center. Nearly symmetrical except for green areas. Focus on how green disrupts patterns and symmetry.
  output: |
    16x16 grid, identical border. All green (3) removed, replaced to maintain and extend existing patterns. Perfect 180-degree rotational symmetry achieved. Central brown (9) and magenta (6) cross unchanged. Former green areas now match symmetrical counterparts with white (1), sky (8), or brown (9). Note how color choices in ex-green areas complete patterns and ensure symmetry.

example_3:
  input: |
    16x16 grid, complex symmetrical border: blue (1), magenta (6), yellow (4), orange (7). Center: flower/star pattern of sky (8) and gray (5). Surrounding: yellow (4) patterns. Left side: significant green (3) area breaking symmetry. Some brown (9) present. Key observation: green disrupts otherwise intricate, symmetrical design.
  output: |
    16x16 grid, identical border. All green (3) removed from left side, replaced to extend and complete existing patterns. Perfect 180-degree rotational symmetry restored. Central flower/star largely unchanged, some gray (5) replacing green for symmetry. Yellow (4) patterns extended into ex-green areas. Note how color choices in former green areas maintain overall design while ensuring symmetry.
