    4. Some complex formations appear where multiple L-shapes share yellow corner squares.
    5. Isolated yellow squares mostly remain unchanged, unless they could form part of a larger L-shape.
    6. No red squares exist without a direct connection to a yellow square.

example_2:
  input: |
    A 15x14 grid with a balanced mix of gray (5) and black (0) squares. Yellow (4) squares are distributed across the grid, with notable clusters in the upper-left and central areas. Some yellow squares form diagonal patterns, while others are more randomly placed.
  output: |
    The grid's fundamental structure is preserved, with these notable transformations:
    1. Many yellow (4) squares have been converted to red (2), especially in clustered areas.
    2. Red squares exclusively form L-shaped patterns, each connected to at least one yellow square.
    3. L-shapes demonstrate various sizes and orientations, optimizing coverage around yellow squares.
    4. Some yellow squares act as junction points for multiple L-shaped red patterns.
    5. Isolated yellow squares either remain unchanged or become part of extended L-shapes.
    6. The upper-left cluster shows a complex interaction of multiple L-shapes and yellow squares.
    7. No red squares appear disconnected from yellow squares.

example_3:
