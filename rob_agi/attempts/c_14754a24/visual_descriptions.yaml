example_0:
  input: |
    A 19x18 grid with a complex pattern of gray (5) and black (0) squares forming the background. Yellow (4) squares are scattered throughout, with notable concentrations in the middle-right and bottom-left areas. Some yellow squares are isolated, while others form small clusters of 2-3 squares.
  output: |
    The grid's overall structure remains intact, with these key transformations:
    1. Most isolated yellow (4) squares remain unchanged.
    2. In areas with yellow square clusters, some have been converted to red (2) squares.
    3. Red squares consistently form L-shaped patterns, always connected to at least one yellow square.
    4. L-shapes vary in size, ranging from 2 to 5 squares in length.
    5. Some yellow squares serve as corner points for multiple L-shaped red patterns.
    6. No red squares appear without a direct connection to a yellow square.

example_1:
