example_0:
  input: |
    A 15x15 grid predominantly black (0) with three non-black squares:
    - Magenta (6) at (2, 10)
    - Red (2) at (4, 4)
    - Sky blue (8) at (11, 7)
    The colored squares are isolated and appear in descending vertical order.
  output: |
    A 15x15 grid divided into three horizontal sections, top to bottom:
    1. Magenta (6) section:
       - Full magenta rows at top (rows 0-1)
       - Magenta left and right columns extending down to row 3
       - Black interior (rows 2-3, columns 1-13)
    2. Red (2) section:
       - Full red row (row 4)
       - Red left and right columns extending from row 4 to 10
       - Black interior (rows 5-10, columns 1-13)
    3. Sky blue (8) section:
       - Full sky blue rows at bottom (rows 12-14)
       - Sky blue left and right columns extending from row 11 to 14
       - Black interior (row 11, columns 1-13)
    Note: Row 11 serves as a black separator between red and sky blue sections.

example_1:
  input: |
    A 15x15 grid predominantly black (0) with four non-black squares:
    - Sky blue (8) at (1, 6)
    - Blue (1) at (3, 10)
    - Red (2) at (7, 3)
    - Green (3) at (9, 5)
    The colored squares are isolated and appear in descending vertical order.
  output: |
    A 15x15 grid divided into four horizontal sections, top to bottom:
    1. Sky blue (8) section:
       - Full sky blue rows at top (rows 0-1)
       - Sky blue left and right columns extending down to row 2
    2. Blue (1) section:
       - Full blue row (row 3)
       - Blue left and right columns extending from row 3 to 6
    3. Red (2) section:
       - Full red row (row 7)
       - Red left and right columns extending from row 7 to 8
    4. Green (3) section:
       - Full green rows at bottom (rows 12-14)
       - Green left and right columns extending from row 9 to 14
    Note: Black rows separate each colored section (rows 2, 6, 8-11).

example_2:
