    - Orange (7) at (7, 8)
    - Sky blue (8) at (12, 3)
    The colored squares are isolated and appear in descending vertical order.
  output: |
    A 15x15 grid divided into three horizontal sections, top to bottom:
    1. Red (2) section:
       - Full red rows at top (rows 0-1)
       - Red left and right columns extending down to row 6
    2. Orange (7) section:
       - Full orange row (row 7)
       - Orange left and right columns extending from row 7 to 10
    3. Sky blue (8) section:
       - Full sky blue rows at bottom (rows 12-14)
       - Sky blue left and right columns extending from row 11 to 14
    Note: Black rows separate each colored section (row 6 between red and orange, row 11 between orange and sky blue).

