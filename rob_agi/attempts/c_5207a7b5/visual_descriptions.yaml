example_0:
  input: |
    A 14x7 grid with a vertical gray line in the middle (column 3). The line extends from the top of the grid to row 4. The rest of the grid is filled with black (empty space).
  output: |
    A 14x7 grid with several distinct features:
    1. The original gray vertical line remains in column 3, but now only extends to row 4.
    2. A large sky blue triangular shape on the left side, starting from the full width of the first 3 columns and tapering down to a point at row 11, column 0.
    3. A small magenta right-angled shape in the top-right corner, occupying 2x2 squares.
    4. The rest of the grid remains black (empty space).

example_1:
  input: |
    An 11x8 grid with a vertical gray line in column 2. The line extends from the top of the grid to row 3. The rest of the grid is filled with black (empty space).
  output: |
    An 11x8 grid with several distinct features:
    1. The original gray vertical line remains in column 2, but now only extends to row 3.
    2. A sky blue rectangular shape on the left side, occupying the first 2 columns and extending from the top to row 7.
    3. A small magenta right-angled shape to the right of the gray line, occupying 2x1 squares in the top-right corner of the shape.
    4. The rest of the grid remains black (empty space).

example_2:
  input: |
    A 14x8 grid with a vertical gray line in column 4. The line extends from the top of the grid to row 6. The rest of the grid is filled with black (empty space).
  output: |
    A 14x8 grid with several distinct features:
    1. The original gray vertical line remains in column 4, but now only extends to row 6.
    2. A large sky blue rectangular shape on the left side, occupying the first 4 columns and extending from the top to row 13.
    3. A magenta right-angled shape to the right of the gray line, occupying 3x2 squares in the top-right corner of the shape.
    4. The rest of the grid remains black (empty space).