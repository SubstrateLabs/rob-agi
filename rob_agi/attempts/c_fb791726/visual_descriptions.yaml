example_0:
  input: |
    A 6x6 grid with mostly black (empty) squares. There are four yellow squares (4) positioned as follows:
    - Top left corner (0,1)
    - Third row, second column (2,1)
    - Fourth row, fifth column (3,4)
    - Bottom right corner (5,4)
    The yellow squares form a rough diagonal pattern from top-left to bottom-right, but not perfectly aligned.
  output: |
    A 12x12 grid that appears to be an expanded version of the input. Key observations:
    - The original yellow squares are preserved in their relative positions, now spaced further apart.
    - New rows of green (3) have been inserted, creating three horizontal green lines that span the entire width of the grid.
    - These green lines are positioned immediately after each pair of yellow squares (when counting from top to bottom).
    - The grid has been expanded both horizontally and vertically, doubling in both dimensions.
    - All other squares remain black (empty).

example_1:
  input: |
    A 3x3 grid with mostly black (empty) squares. There are two sky blue squares (8) positioned as follows:
    - Top center (0,1)
    - Bottom center (2,1)
    The sky blue squares form a vertical line in the center column.
  output: |
    A 6x6 grid that is an expanded version of the input. Key observations:
    - The original sky blue squares are preserved in their relative positions, now spaced further apart.
    - A new row of green (3) has been inserted, creating a horizontal green line that spans the entire width of the grid.
    - This green line is positioned in the middle of the grid, between the two sky blue squares.
    - The grid has been expanded both horizontally and vertically, doubling in both dimensions.
    - Two new sky blue squares have been added in the rightmost column, mirroring the positions of the original sky blue squares.
    - All other squares remain black (empty).

example_2:
  input: |
    A 7x7 grid with mostly black (empty) squares. There are two orange squares (7) positioned as follows:
    - Third row, third column (2,2)
    - Third row from bottom, third column (4,2)
    The orange squares form a vertical line in the third column, with some space between them.
  output: |
    A 14x14 grid that is an expanded version of the input. Key observations:
    - The original orange squares are preserved in their relative positions, now spaced further apart.
    - Three new rows of green (3) have been inserted, creating three horizontal green lines that span the entire width of the grid.
    - These green lines are positioned: one immediately below the top orange square, one in the middle of the grid, and one immediately above the bottom orange square.
    - The grid has been expanded both horizontally and vertically, doubling in both dimensions.
    - Two new orange squares have been added in the rightmost column, mirroring the positions of the original orange squares but shifted slightly downward.
    - All other squares remain black (empty).

