example_0:
  input: |
    A 6x6 grid with black (0) background. Four yellow (4) squares are positioned at:
    - (0,0): Top-left corner
    - (2,1): Third row, second column
    - (3,4): Fourth row, fifth column
    - (5,5): Bottom-right corner
    The yellow squares form a loose diagonal pattern from top-left to bottom-right.
  output: |
    A 12x12 grid, double the size of the input. The yellow (4) squares are now at:
    - (0,0): Top-left corner
    - (4,2): Fifth row, third column
    - (6,8): Seventh row, ninth column
    - (10,10): Eleventh row, eleventh column (bottom-right quadrant)
    Green (3) lines have been inserted:
    - Horizontally: Every odd-numbered row (1, 3, 5, 7, 9, 11)
    - Vertically: Every odd-numbered column (1, 3, 5, 7, 9, 11)
    This creates a grid-like structure of green lines, with the original content in the resulting cells.

example_1:
  input: |
    A 3x3 grid with black (0) background. Two sky blue (8) squares are at:
    - (0,1): Top row, middle column
    - (2,1): Bottom row, middle column
    They form a vertical line in the center column.
  output: |
    A 6x6 grid, double the size of the input. The sky blue (8) squares are now at:
    - (0,2): Top row, third column
    - (4,2): Fifth row, third column
    Green (3) lines have been inserted:
    - Horizontally: Every odd-numbered row (1, 3, 5)
    - Vertically: Every odd-numbered column (1, 3, 5)
    This creates a grid-like structure of green lines, with the original content in the resulting cells.

example_2:
  input: |
    A 7x7 grid with black (0) background. Two orange (7) squares are at:
    - (2,2): Third row, third column
    - (4,4): Fifth row, fifth column
    They form a diagonal line from top-left to bottom-right, near the center of the grid.
  output: |
    A 14x14 grid, double the size of the input. The orange (7) squares are now at:
    - (4,4): Fifth row, fifth column
    - (8,8): Ninth row, ninth column
    Green (3) lines have been inserted:
    - Horizontally: Every odd-numbered row (1, 3, 5, 7, 9, 11, 13)
    - Vertically: Every odd-numbered column (1, 3, 5, 7, 9, 11, 13)
    This creates a grid-like structure of green lines, with the original content in the resulting cells.

