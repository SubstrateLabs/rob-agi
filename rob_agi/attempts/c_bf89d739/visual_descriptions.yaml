example_0:
  input: |
    A 19x13 grid with black (0) background. Five red (2) dots are scattered:
    - (3,8), (6,4), (6,12), (9,10), (11,7)
    Key observations:
    - Leftmost red dot is at column 4
    - Rightmost red dot is at column 12
    - Topmost red dot is at row 3
    - Bottommost red dot is at row 11
    - Two red dots share the same row (row 6)
  output: |
    The 19x13 grid now includes green (3) lines connecting all red (2) dots:
    - A vertical green "spine" from (3,8) to (11,8)
    - Horizontal green lines connect off-spine red dots to the spine:
      (6,4) to (6,8), (6,12) to (6,8), (9,10) to (9,8), (11,7) to (11,8)
    Key features:
    - The spine is in column 8, which is the leftmost column with a red dot after the first
    - All red dots are connected to the spine directly or indirectly
    - The structure forms a tree with the spine as the main trunk

