example_0:
  input: |
    A 19x13 grid mostly filled with black (0). There are five red (2) dots scattered across the grid:
    - One at row 3, column 8
    - One at row 6, column 4
    - One at row 6, column 12
    - One at row 9, column 10
    - One at row 11, column 7
    These red dots appear to be isolated with no clear pattern or connection between them.
  output: |
    The same 19x13 grid, but now with green (3) lines connecting the red (2) dots. The red dots remain in their original positions. The green lines form a shape resembling an irregular pentagon:
    - A vertical line from (3,8) to (6,8)
    - A horizontal line from (6,4) to (6,12)
    - A diagonal line from (6,12) to (9,10)
    - A vertical line from (9,10) to (11,10)
    - A diagonal line from (11,7) to (6,4)
    The green lines appear to be the shortest path connecting all red dots.

