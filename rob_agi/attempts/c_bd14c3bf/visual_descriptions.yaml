example_0:
  input: |
    The 15x15 grid contains several distinct shapes. In the top-left corner, there's a solid red (2) L-shaped pattern (3x3). The grid features multiple blue (1) shapes:
    1. A thin U-shape (3x5) in the top-right, with single-cell thickness.
    2. An inverted T-shape (5x5) in the middle-right, with a two-cell thick vertical line and single-cell thick horizontal line.
    3. A thin cross shape (5x5) in the center, with single-cell thickness.
    4. A square (5x5) with a single-cell hole in the bottom-left.
    5. Two solid rectangles (4x4 and 3x3) in the bottom-right.
    The rest of the grid is filled with black (0), representing empty space.
  output: |
    The output grid maintains the original structure with specific transformations:
    1. The red (2) L-shape in the top-left remains unchanged.
    2. The thin blue U-shape in the top-right has been changed to red (2).
    3. The inverted T-shape in the middle-right remains blue (1).
    4. The thin cross shape in the center has been transformed to red (2).
    5. The square with a hole in the bottom-left remains blue (1).
    6. Of the two rectangles in the bottom-right, the larger one (4x4) has changed to red (2), while the smaller one (3x3) remains blue (1).
    All black (0) spaces remain unchanged. This transformation suggests that thin or vulnerable blue shapes are changed to red, while more robust blue shapes are preserved.

