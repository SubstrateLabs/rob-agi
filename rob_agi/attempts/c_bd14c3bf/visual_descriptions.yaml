example_0:
  input: |
    The grid contains several distinct shapes and patterns. In the top-left corner, there's a red (2) L-shaped pattern. Throughout the grid, there are multiple blue (1) shapes: a U-shape in the top-right, an inverted T-shape in the middle-right, a cross shape in the center, a square with a hole in the bottom-left, and two rectangles in the bottom-right. The rest of the grid is filled with black (0), which can be considered as empty space.
  output: |
