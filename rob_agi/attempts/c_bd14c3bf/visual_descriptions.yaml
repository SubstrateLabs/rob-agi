example_1:
  input: |
    The grid features several distinct shapes and patterns. In the top-left, there's a red (2) U-shape. Throughout the grid, there are multiple blue (1) shapes: a small U-shape in the top-right, a large rectangle spanning the middle of the grid, a C-shape in the center-right, and an irregular shape in the bottom-right corner. There's also a blue (1) line connecting two shapes in the left side of the grid. The rest is filled with black (0), representing empty space.
  output: |
    The output grid maintains the overall structure but with significant color changes. The red (2) U-shape in the top-left remains unchanged. The blue (1) U-shape in the top-right has been changed to red (2). The large blue rectangle in the middle has been transformed to red (2). The blue C-shape in the center-right remains blue. The connecting line on the left side has changed from blue to red. The irregular shape in the bottom-right corner remains blue. All black (0) spaces remain unchanged.

