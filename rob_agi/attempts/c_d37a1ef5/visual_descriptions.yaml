example_0:
  input: |
    An 8x11 grid with a red (2) rectangular frame surrounding a mostly empty black (0) interior. The frame is one cell thick on all sides. Inside the frame, there are three gray (5) cells forming a diagonal line from top-left to bottom-right. The top-left gray cell is at (3,3), the middle at (4,5), and the bottom-right at (3,6).
  output: |
    An 8x11 grid with a thicker red (2) rectangular frame. The frame is now two cells thick on all sides except the top and bottom edges. The interior black (0) area is smaller. The three gray (5) cells remain in their original positions, but are now surrounded by the thicker red frame.

