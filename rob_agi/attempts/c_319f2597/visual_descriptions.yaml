example_0:
  input: |
    A 20x20 grid with a diverse mix of colors. The most notable feature is a small 2x2 black square (color 0) in the center, spanning rows 7-8 and columns 9-10. The rest of the grid is filled with various colors (1-9) in no immediately apparent pattern.
  output: |
    The grid maintains its 20x20 size, but significant changes have occurred. The central 2x2 black square has expanded vertically, forming a black column that spans the entire height of the grid in columns 9-10. Additionally, row 7 has been entirely filled with black (0), creating a horizontal black line across the grid. The rest of the grid remains largely unchanged, preserving the original colors except where intersected by the new black areas.

example_1:
  input: |
    Another 20x20 grid with varied colors. A notable feature is a 2x2 black square (color 0) slightly off-center, located in rows 12-13 and columns 7-8. The rest of the grid is filled with a mix of colors (1-9) without an obvious pattern.
  output: |
    The 20x20 grid structure is maintained, but with significant alterations. The original 2x2 black square has expanded both vertically and horizontally. It now forms a black cross shape, with a vertical black line spanning the full height of the grid in columns 7-8, and a horizontal black line across the entire width in rows 12-13. The areas where this cross intersects the original colored grid are now black (0), while the rest of the grid retains its original colors.

example_2:
