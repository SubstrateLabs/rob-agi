example_0:
  input: |
    A 3x3 grid entirely filled with green (3) squares. This forms a solid green square.
  output: |
    A 15x15 grid with a pattern of green (3) lines forming a grid structure. The grid has three horizontal and three vertical green lines, evenly spaced. The spaces between the lines are filled with black (0) squares. This creates a 3x3 grid of larger black squares, each surrounded by green lines.

example_1:
  input: |
    A 2x2 grid entirely filled with sky blue (8) squares. This forms a small solid sky blue square.
  output: |
    A 15x15 grid with a pattern of sky blue (8) lines forming a grid structure. The grid has five horizontal and five vertical sky blue lines, evenly spaced. The spaces between the lines are filled with black (0) squares. This creates a 5x5 grid of larger black squares, each surrounded by sky blue lines.

example_2:
  input: |
    A 4x4 grid entirely filled with red (2) squares. This forms a solid red square.
  output: |
    A 15x15 grid with a pattern of red (2) lines forming a grid structure. The grid has three horizontal and three vertical red lines, evenly spaced. The spaces between the lines are filled with black (0) squares. This creates a 3x3 grid of larger black squares, each surrounded by red lines.