example_0:
  input: |
    A 13x13 grid predominantly filled with blue (1) squares. There are scattered black (0) squares throughout, creating a sparse pattern. The black squares are more concentrated in the center and lower-right areas of the grid. The top-left and bottom-left corners are mostly blue with a few black squares.
  output: |
    The grid maintains its 13x13 size and overall blue (1) background. However, a meandering path of sky blue (8) squares has been introduced. This path starts from the center-right edge, moves towards the center, then branches out. It forms a loose, organic shape that connects some of the areas where black squares were previously present. Some black squares remain unchanged, particularly in the corners and edges.

