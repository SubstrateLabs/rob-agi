example_0:
  input: |
    The 15x15 grid contains four distinct non-zero shapes:
    1. Top-left (rows 1-3, columns 1-3): A 3x3 square alternating sky blue (8) and green (3).
    2. Middle-left (rows 5-7, columns 3-5): A 3x3 square alternating red (2) and blue (1).
    3. Bottom-left (rows 9-11, columns 1-3): A 3x3 square alternating orange (7) and magenta (6).
    4. Middle-right (rows 7-9, columns 8-10): A 3x3 L-shape alternating blue (1) and yellow (4).
    The shapes are separated by at least one column/row of zeros (black, empty space).
    The rightmost 5 columns are entirely zeros.
  output: |
    The four shapes are moved to the right side of the grid, maintaining their vertical order:
    1. Sky blue/green square: Top-right corner (rows 1-3, columns 13-15).
    2. Red/blue square: Upper-middle right (rows 5-7, columns 13-15).
    3. Orange/magenta square: Lower-middle right (rows 9-11, columns 13-15).
    4. Blue/yellow L-shape: Bottom-right (rows 12-14, columns 13-15).
    Each shape retains its original size, pattern, and orientation.
    The shapes are tightly packed vertically with no gaps between them.
    The leftmost 12 columns are now entirely zeros.

example_1:
  input: |
    The 15x15 grid contains five distinct 2x2 non-zero shapes scattered across the grid:
    1. Top-left (rows 2-3, columns 2-3): Alternating blue (1) and red (2).
    2. Upper-middle (rows 3-4, columns 7-8): Alternating gray (5) and sky blue (8).
    3. Middle-left (rows 7-8, columns 5-6): Alternating magenta (6) and yellow (4).
    4. Bottom-left (rows 8-9, columns 1-2): Alternating sky blue (8) and brown (9).
    5. Bottom-right (rows 10-11, columns 9-10): Alternating red (2) and blue (1).
    The shapes are separated by at least one column/row of zeros.
    The rightmost 5 columns are entirely zeros.
  output: |
    The five shapes are moved to the right side of the grid, maintaining their vertical order:
    1. Blue/red square: Top-right area (rows 2-3, columns 12-13).
    2. Gray/sky blue square: Upper-right corner (rows 3-4, columns 14-15).
    3. Sky blue/brown square: Middle-right area (rows 8-9, columns 12-13).
    4. Magenta/yellow square: Lower-right area (rows 10-11, columns 14-15).
    5. Red/blue square: Bottom-right corner (rows 12-13, columns 14-15).
    Each shape retains its original size, pattern, and orientation.
    The shapes are packed towards the top and right, with minimal vertical gaps.
    The leftmost 11 columns are now entirely zeros.

example_2:
  input: |
    The 15x15 grid contains five distinct non-zero shapes of varying sizes:
    1. Top-left (rows 1-2, columns 2-3): A 2x2 square alternating brown (9) and red (2).
    2. Upper-middle (rows 2-4, columns 9-11): A 3x3 square alternating green (3) and orange (7).
    3. Middle (rows 7-9, columns 5-7): A 3x3 square alternating magenta (6) and sky blue (8).
    4. Bottom-right (rows 9-10, columns 11-12): A 2x2 square alternating sky blue (8) and gray (5).
    5. Bottom-left (rows 12-13, columns 2-3): A 2x2 square alternating red (2) and gray (5).
    The shapes are separated by at least one column/row of zeros.
    The rightmost 3 columns are entirely zeros.
  output: |
    The five shapes are moved to the right side of the grid, maintaining their vertical order:
    1. Brown/red square: Upper-right area (rows 1-2, columns 10-11).
    2. Green/orange square: Top-right corner (rows 2-4, columns 13-15).
    3. Magenta/sky blue square: Middle-right area (rows 7-9, columns 10-12).
    4. Sky blue/gray square: Lower-right corner (rows 9-10, columns 14-15).
    5. Red/gray square: Bottom-right area (rows 13-14, columns 14-15).
    Each shape retains its original size, pattern, and orientation.
    The shapes are packed towards the top and right, with minimal vertical gaps.
    The leftmost 9 columns are now entirely zeros.
