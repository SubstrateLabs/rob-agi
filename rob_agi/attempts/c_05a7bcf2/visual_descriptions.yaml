example_0:
  input: |
    A 30x30 grid with mostly black (empty) space. There's a horizontal sky blue (8) line across the middle, dividing the grid into two halves. In the top half, there are scattered yellow (4) regions, mostly in the upper left quadrant. In the bottom half, there's a thick red (2) line at the bottom with some red dots above it.
  output: |
    The grid maintains its 30x30 size and the sky blue (8) horizontal line in the middle. The yellow (4) regions in the top half have expanded downwards and rightwards, stopping at the sky blue line. The red (2) regions in the bottom half have expanded upwards and leftwards, also stopping at the sky blue line. The top left quadrant above the sky blue line is now filled with green (3) where it wasn't yellow. All remaining empty spaces are filled with sky blue (8).

