example_0:
  input: |
    Grid size: 18x17
    Border: Black (0) surrounding the entire grid
    Main regions:
    1. Top-left pattern (5x5):
       - Left half: Red (2) with Sky (8) elements
       - Right half: Blue (1) with Sky (8) elements
       - Separated by a black column
    2. Background: Large blue (1) rectangle (16x8)
    Key observations:
    - Sky (8) forms an L-shape in both halves of the pattern
    - The pattern is asymmetrical due to different background colors
    - The sky elements touch the edges of their respective 4x4 squares
  output: |
    Grid size: 16x8
    Background: Blue (1)
    Pattern color: Sky (8)
    Structure:
    - Four symmetrical patterns in the corners
    - Each pattern is a 4x4 square with an L-shaped sky element
    - Central area has additional sky elements connecting the corner patterns
    - Perfect horizontal and vertical symmetry
    - Sky elements touch all edges and corners of the grid

