example_0:
  input: |
    The input grid is 18x17. It has a black (0) border around the entire grid. Inside this border, there are two distinct regions:
    1. The top-left quadrant (5x5) contains a pattern of red (2), sky (8), and blue (1) squares.
    2. The rest of the non-border area is filled with blue (1) squares, forming a large blue rectangle (16x8).
    The top-left pattern appears to be two 4x4 squares side by side, separated by a black column. The left square has red and sky colors, while the right square has blue and sky colors.
  output: |
    The output grid is 16x8. It appears to be a transformed version of the input, focusing on the pattern from the top-left quadrant.
    The pattern is repeated and mirrored both horizontally and vertically.
    The background color is blue (1), and the pattern elements are sky (8).
    There are four instances of the pattern, one in each corner of the grid.
    The pattern in each corner is a 4x4 square with sky-colored elements forming an L-shape or its mirror.

