example_0:
  input: |
    A 12x12 grid with a red (2) border. Inside the border, there's a small 4x4 pattern in the top-left corner. This pattern consists of blue (1) and green (3) squares forming a simple design. The rest of the grid inside the border is filled with red (2), except for a 4x4 black (0) square in the bottom-right corner.
  output: |
    The grid maintains its 12x12 size and red (2) border. The small 4x4 pattern from the top-left corner of the input is now replicated in the bottom-right corner, replacing the black square. The original pattern in the top-left remains unchanged. The rest of the grid inside the border is still filled with red (2).

example_1:
