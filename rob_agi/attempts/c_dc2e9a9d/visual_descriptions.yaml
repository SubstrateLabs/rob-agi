example_1:
  input: |
    A 23x19 grid with three distinct green (3) shapes.

    In the upper left quadrant, there's a large shape resembling a square with a bite taken out of the bottom right corner. It's 5x5 in size.

    In the upper right quadrant, there's a smaller 3x3 square shape.

    In the bottom right quadrant, there's another 5x5 square shape, but this one has a protrusion on the right side, making it look like a sideways 'P'.

    The rest of the grid is black (0).
  output: |
    The original green shapes remain unchanged.

    A blue (1) shape, mirroring the large green shape from the upper left, appears in the upper right quadrant, overlapping with the small green square.

    A sky blue (8) shape appears in the center of the grid. It's a 5x5 square with a single square extending upward from the top edge.

    Another blue (1) shape appears in the bottom left quadrant, mirroring the green 'P' shape from the bottom right.

