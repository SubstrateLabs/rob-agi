example_0:
  input: |
    The input grid is 25x25. There are two distinct yellow (4) regions. The first is in the top-left quadrant, roughly 6x6 in size. It contains two red (2) squares within it. The second yellow region is in the bottom-right quadrant, roughly 8x6 in size. It contains three blue (1) squares within it. The rest of the grid is black (0).
  output: |
    The output grid maintains the two yellow regions from the input, but with significant changes:
    1. The top-left yellow region is now surrounded by a 2-cell thick border of red (2).
    2. The bottom-right yellow region is surrounded by a 3-cell thick border of blue (1).
    3. All remaining black space has been filled with sky blue (8).

