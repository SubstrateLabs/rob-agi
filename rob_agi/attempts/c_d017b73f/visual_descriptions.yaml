example_0:
  input: |
    A 3x9 grid with three distinct color groups. Top row: red (2) pair at column 2. Middle row: red (2) pair at left, blue (1) pair at center (separated by black), red (2) trio at right. Bottom row: all black (0). Key observation: Vertical alignment of color groups and horizontal spacing between them.
  output: |
    A 3x7 compressed grid. Top row: red (2) pair followed by blue (1) pair. Middle row: red (2) pair, blue (1) pair, red (2) trio. Bottom row: all black (0). Note: Vertical alignment preserved, horizontal compression applied, unnecessary black space removed.

example_1:
  input: |
    A 3x11 grid with four color groups. Top row: green (3) pair at center, red (2) pair at right. Middle row: red (2) pair at left, blue (1) pair right of center. Bottom row: single red (2) at column 2. Rest: black (0). Key observation: Vertical distribution of color groups.
  output: |
    A 3x8 compressed grid. Top row: all black (0). Middle row: red (2) pair at left and right edges. Bottom row: red (2), green (3), blue (1), red (2) pairs from left to right. Note: Color groups moved down and left, maintaining relative vertical order and left-to-right sequence.

example_2:
  input: |
    A 3x11 grid with three color groups. Top row: single sky blue (8) near right. Middle row: red (2) trio at left, sky blue (8) trio at center. Bottom row: single red (2) at column 3, magenta (6) trio at right. Rest: black (0). Key observation: Varying sizes of color groups and their vertical distribution.
  output: |
    A 3x9 compressed grid. Top row: all black (0). Middle row: red (2) trio, sky blue (8) trio, magenta (6) trio from left to right. Bottom row: single red (2) under left red, remaining sky blue (8) cells. Note: Color groups consolidated vertically while maintaining relative positions.

example_3:
  input: |
    A 3x11 grid with blue (1) and red (2) groups. Top row: blue (1) pair at left, red (2) pair at right. Middle row: blue (1) pair at far left, two separate red (2) pairs - center and right. Bottom row: single red (2) at center. Rest: black (0). Key observation: Multiple instances of same color and their distribution.
  output: |
    A 3x8 compressed grid. Top row: blue (1) pair, followed by two red (2) pairs. Middle row: blue (1) pair, followed by two red (2) pairs. Bottom row: all black (0). Note: Similar colors grouped horizontally while maintaining vertical alignment of distinct groups.

test_case_0:
  input: |
    A 3x11 grid with five color groups. Top row: yellow (4) pair left of center, red (2) pair at right edge. Middle row: blue (1) pair at left edge, single green (3) at center, red (2) pair at right edge. Bottom row: single blue (1) at column 2. Rest: black (0). Key observation: Mix of pairs and single cells, vertical and horizontal distribution.
  output: |
    Not provided. Expected compression and rearrangement while maintaining color group integrity and relative positioning.
