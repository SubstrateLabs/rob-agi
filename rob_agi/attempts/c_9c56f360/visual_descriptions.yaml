example_0:
  input: |
    A 7x6 grid with mostly black (0) and sky blue (8) squares. There's a distinct pattern of sky blue squares scattered throughout the grid. In the bottom right corner, there's a 2x2 square of green (3) squares. The sky blue squares form a loose, irregular pattern across the grid, with some clustering but no clear shape.
  output: |
    The grid maintains its 7x6 size and most of the sky blue (8) and black (0) pattern. The key difference is the 2x2 green (3) square has moved from the bottom right corner to the middle of the grid, now occupying rows 4-5 and columns 0-1. The surrounding pattern of sky blue squares remains largely unchanged.

example_1:
