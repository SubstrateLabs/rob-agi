example_0:
  input: |
    The input grid is 17x11. The dominant feature is three horizontal sky blue (8) lines spanning almost the full width of the grid. These lines are located at rows 3, 5, and 8. The top and bottom lines have a single square gap at column 6. The middle line has two single square gaps at columns 3 and 13. There is a single red (2) square at the top of the grid in column 8. The rest of the grid is filled with black (0) squares, which can be interpreted as empty space.
  output: |
    The output grid maintains the same sky blue (8) lines from the input. The key difference is the addition of a red (2) structure. This structure consists of:
    1. A vertical "backbone" in column 6 that runs from the top to the bottom of the grid.
    2. Horizontal "bridges" that connect this backbone to each of the sky blue lines.
    3. A connection to the original red square at the top of the grid.
    The red structure forms a kind of "comb" shape, with the vertical backbone and horizontal teeth connecting to each blue line. The structure is minimal, using only the necessary red squares to connect all blue elements.

example_1:
  input: |
    The input grid is 12x11. It features several vertical sky blue (8) lines of varying lengths. From left to right:
    1. A full-height line in column 3.
    2. A line spanning the top 6 rows in column 6.
    3. A full-height line in column 10, with a two-square gap in rows 7 and 9.
    There is also a single red (2) square in the top-left corner at position (3, 0). The rest of the grid is filled with black (0) squares (empty space).
  output: |
    The output grid maintains the sky blue (8) lines from the input. The key change is the addition of a red (2) structure that connects all the blue lines. This structure consists of:
    1. A vertical "backbone" in column 4 that runs from the top to the bottom of the grid.
    2. Horizontal "bridges" that connect this backbone to each of the blue lines at various points.
    3. A connection to the original red square in the top-left corner.
    The red structure forms an irregular shape, adapting to connect all blue elements efficiently. It creates a minimal path that ensures all blue lines are connected.

example_2:
  input: |
    The input grid is 13x10. It features several vertical sky blue (8) lines of varying lengths and positions. From left to right:
    1. A line in column 2, with gaps in rows 2 and 9.
    2. A full-height line in column 5.
    3. A line in column 9, with a gap in row 3.
    There is also a single red (2) square in the bottom-right corner at position (4, 12). The rest of the grid is filled with black (0) squares (empty space).
  output: |
    The output grid maintains the sky blue (8) lines from the input. The key change is the addition of a red (2) structure that connects all the blue lines. This structure consists of:
    1. A vertical "backbone" in column 6 that runs from the top to row 8 of the grid.
    2. Horizontal "bridges" that connect this backbone to each of the blue lines at various points.
    3. A connection from the backbone to the original red square in the bottom-right corner.
    The red structure forms an irregular shape, adapting to connect all blue elements efficiently. It creates a minimal path that ensures all blue lines are connected, including a long horizontal bridge at row 3 to connect to the leftmost blue line.

