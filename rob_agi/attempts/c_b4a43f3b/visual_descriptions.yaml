example_0:
  input: |
    A 13x6 grid with distinct regions:
    1. Upper 6x6 section:
       - Top-left: 2x2 green (3)
       - Top-right: 2x2 black (0)
       - Middle-left: 2x2 red (2)
       - Middle-right: 2x2 magenta (6)
    2. Full-width line: Gray (5) in row 7
    3. Lower section (rows 9-13):
       - Red (2) shape resembling an upside-down 'T'
       - Surrounded by black (0)

  output: |
    An 18x18 grid with a centered, scaled, and repeated pattern:
    1. Core pattern: 3x3 block derived from input's upper-left quadrant
       - Top-left: Green (3)
       - Top-right: Red (2)
       - Bottom-left: Black (0)
       - Bottom-right: Magenta (6)
    2. Arrangement: Four 3x3 blocks in a 2x2 formation
    3. Scaling: Each color in the core pattern is represented by a 3x3 square
    4. Full-width line: Preserved, positioned below the main pattern
    5. Bottom shape: Scaled version of the input's red 'T' shape, centered at the bottom

example_1:
  input: |
    A 13x6 grid with distinct regions:
    1. Upper 6x6 section:
       - Top-left: 2x2 blue (1)
       - Top-right: 2x2 magenta (6)
       - Middle-left: 2x2 black (0)
       - Middle-right: 2x2 blue (1)
       - Bottom-left: 2x2 red (2)
       - Bottom-right: 2x2 black (0)
    2. Full-width line: Gray (5) in row 7
    3. Lower section (rows 9-13):
       - Red (2) shape resembling a rotated 'L'
       - Surrounded by black (0)

  output: |
    An 18x18 grid with a centered, scaled, and repeated pattern:
    1. Core pattern: 3x3 block derived from input's upper 6x6 section
       - Top: Blue (1), Magenta (6), Blue (1)
