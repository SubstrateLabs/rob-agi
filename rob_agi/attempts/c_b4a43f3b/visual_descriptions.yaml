    2. Arrangement: Six 3x3 blocks in a staggered formation
       - Top row: 2 blocks
       - Middle row: 3 blocks
       - Bottom row: 2 blocks
    3. Scaling: Each color in the core pattern is represented by a 2x2 square
    4. Full-width line: Preserved, positioned below the main pattern
    5. Bottom shape: Scaled version of the input's red 'L' shape, centered at the bottom

example_2:
  input: |
    A 13x6 grid with distinct regions:
    1. Upper 6x6 section:
       - Top-left and top-right: 2x2 blue (1) squares
       - Middle: 2x2 red (2) square
       - Bottom-left: 2x2 green (3) square
       - Other areas: Black (0)
    2. Full-width line: Gray (5) in row 7
    3. Lower section (rows 9-13):
       - Red (2) shape resembling a plus sign or cross
       - Surrounded by black (0)

  output: |
    An 18x18 grid with a centered, scaled, and repeated pattern:
    1. Core pattern: 3x3 block derived from input's upper 6x6 section
       - Top: Blue (1), Black (0), Blue (1)
       - Middle: Black (0), Red (2), Black (0)
       - Bottom: Green (3), Red (2), Black (0)
    2. Arrangement: Six 3x3 blocks in a symmetric formation
       - Top row: 1 centered block
       - Middle row: 4 blocks side by side
       - Bottom row: 1 centered block
    3. Scaling: Each color in the core pattern is represented by a 3x3 square
    4. Full-width line: Preserved, positioned below the main pattern
    5. Bottom shape: Scaled version of the input's red cross shape, centered at the bottom

example_3:
  input: |
    A 13x6 grid with distinct regions:
    1. Upper 6x6 section:
       - Top-left, top-right, and middle: 2x2 blue (1) squares
       - Bottom two rows: Full-width green (3) lines
       - Other areas: Black (0)
    2. Full-width line: Gray (5) in row 7
    3. Lower section (rows 9-13):
       - Red (2) shape resembling an upside-down 'T' with an extra right arm
       - Surrounded by black (0)

  output: |
    An 18x18 grid with a centered, scaled, and repeated pattern:
    1. Core pattern: 3x3 block derived from input's upper 6x6 section
       - Top: Blue (1), Black (0), Blue (1)
       - Middle: Black (0), Blue (1), Black (0)
       - Bottom: Green (3), Green (3), Green (3)
    2. Arrangement: Five 3x3 blocks in a vertical formation
       - Top row: 1 centered block
       - Middle row: 1 centered block
       - Bottom row: 3 blocks side by side
    3. Scaling: Each color in the core pattern is represented by a 3x3 square
    4. Full-width lines: Two green lines preserved, positioned within the main pattern
    5. Bottom shape: Scaled version of the input's red 'T' shape with extra arm, centered at the bottom
