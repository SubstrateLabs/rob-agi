example_0:
  input: |
    A 22x22 grid with a black (0) background. In the center, there's a sky-colored (8) cross or plus sign. The cross spans 7 cells vertically and horizontally, with the central cell being black. This creates a distinctive 'hole' in the middle of the cross.
  output: |
    A 22x22 grid with a complex, asymmetrical maze-like pattern. Key features:
    1. A continuous sky-colored (8) border frames the entire grid, except for the top-left corner which remains black.
    2. The central cross from the input is preserved and integrated into a larger structure.
    3. Maze-like paths of varying widths extend from the center, creating a balance between open areas and intricate passages.
    4. The pattern is asymmetrical but maintains a sense of balance across the four quadrants.
    5. Small structural elements (2x2 squares) are scattered in larger empty areas, adding visual interest.
    6. All sky-colored cells are connected, forming a single continuous structure.

example_1:
  input: |
    A 12x12 grid with a black (0) background. In the center, there's a small sky-colored (8) shape resembling an upside-down 'T' or a small cross. This shape is 3 cells wide and 3 cells tall, with the bottom-center cell extending one cell lower.
  output: |
    A 12x12 grid transformed into an asymmetrical, maze-like pattern. Key features:
    1. A continuous sky-colored (8) border surrounds the grid on three sides (top, right, bottom), with the left side more open.
    2. The original 'T' shape is incorporated into a larger, more complex structure.
    3. Maze-like paths of varying widths create a balance between open spaces and narrow passages.
    4. The pattern is asymmetrical, with more complexity on the right side and more open space on the left.
    5. Small structural elements are added to break up larger empty areas.
    6. All sky-colored cells are interconnected, forming a single continuous structure.

example_2:
  input: |
    A 16x16 grid with a black (0) background. In the center, there's a sky-colored (8) plus sign or cross. The vertical part spans 5 cells, and the horizontal part also spans 5 cells, creating a symmetrical cross shape.
  output: |
    A 16x16 grid transformed into an intricate, asymmetrical maze-like pattern. Key features:
    1. A continuous sky-colored (8) border frames three sides (left, bottom, right), with the top more open and the pattern extending downward.
    2. The original cross shape is still visible in the center but is now part of a larger, more complex structure.
    3. Maze-like paths of varying widths create a dynamic balance between open areas and narrow passages.
    4. The pattern is asymmetrical but maintains a sense of balance across the four quadrants.
    5. Small structural elements (2x2 squares) are added to larger empty areas for visual interest.
    6. All sky-colored cells are connected, forming a single continuous structure that extends from the center to the edges.

