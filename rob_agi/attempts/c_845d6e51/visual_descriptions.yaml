    4. Multiple green (3) shapes in the bottom half of the grid:
       - A 3x4 rectangular shape with a square missing in the middle-bottom.
       - A 3x3 square shape in the bottom-left.
       - A small L-shape in the bottom-right.
    The rest of the grid is filled with black (0), which can be considered empty space.
