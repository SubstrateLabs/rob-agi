example_0:
  input: |
    A 17x13 grid with distinct shapes in each quadrant:
    Top-left: Red (2) L-shaped pattern (3x3).
    Top-right: Yellow (4) diamond/cross shape (3x3).
    Bottom-left: Large blue (1) rectangle (7x7) with two embedded squares:
      - Gray (5) square (2x2) in its top-left corner
      - Red (2) square (2x2) in its bottom-right corner
    Bottom-right: Green (3) diagonal line (3 cells) and sky blue (8) cross (3x3).
    Background: Black (0), covering about 50% of the grid.
  output: |
    A 7x7 grid with condensed versions of the input shapes:
    Top-left: Yellow (4) diamond/cross (3x3).
    Top-right: Red (2) L-shape (3x3).
    Bottom-left: Empty (black, 0).
    Bottom-right: Green (3) diagonal line (3 cells) and sky blue (8) cross (2x2).
    Central cross: Black (0), separating the quadrants.

example_1:
  input: |
    A 17x17 grid with distinct shapes in each quadrant:
    Top-left: Red (2) backwards 'L' or hook shape (4x4).
    Top-right: Large blue (1) rectangle (7x17) with three embedded squares:
      - Red (2) square (2x2) near the top
      - Magenta (6) square (2x2) in the middle
      - Green (3) square (2x2) near the bottom
    Bottom-left: Magenta (6) plus sign or cross (3x3).
    Bottom-right: Complex area with multiple shapes:
      - Green (3) diagonal line (3 cells)
      - Yellow (4) upside-down 'T' shape (3x3)
      - Sky blue (8) right-pointing triangle/arrow (3x3)
    Background: Black (0), covering about 40% of the grid.
  output: |
    A 7x7 grid with condensed versions of the input shapes:
    Top-left: Red (2) hook shape (3x3).
    Top-right: Yellow (4) upside-down 'T' (3x3).
    Bottom-left: Magenta (6) plus sign (3x3).
    Bottom-right: Green (3) diagonal line (3 cells).
    Central cross: Black (0), separating the quadrants.

example_2:
  input: |
    An 18x17 grid with distinct shapes in each quadrant:
    Top-left: Large blue (1) rectangle (7x7) with three embedded squares:
      - Gray (5) square (2x2) in the top-left corner
      - Red (2) square (2x2) in the middle-left
      - Green (3) square (2x2) in the bottom-right corner
    Top-right: Yellow (4) left-pointing arrow shape (5x3).
    Bottom-left: Complex area with multiple shapes:
      - Green (3) backwards 'L' shape (3x3)
      - Gray (5) zigzag/stairs shape (3x3)
    Bottom-right: Multiple shapes:
      - Magenta (6) upside-down 'T' shape (3x3)
      - Red (2) sideways 'T' shape (3x3)
      - Sky blue (8) square/diamond (3x3)
    Background: Black (0), covering about 45% of the grid.
  output: |
    A 7x7 grid with condensed versions of the input shapes:
    Top-left: Gray (5) zigzag shape (3x3).
    Top-right: Yellow (4) left-pointing arrow (3x3).
    Bottom-left: Red (2) sideways 'T' (3x3).
    Bottom-right: Green (3) backwards 'L' (3x3).
    Central cross: Black (0), separating the quadrants.

