example_0:
  input: |
    The grid contains several distinct shapes:
    1. A blue 'U' shape in the top-left corner (rows 2-4, columns 1-3)
    2. A red 'T' shape in the top-right corner (rows 1-3, columns 9-11)
    3. A sky-colored square with a hollow center in the middle-left (rows 5-8, columns 5-7)
    4. A blue 'L' shape in the bottom-right corner (rows 4-7, columns 13-15)
    The shapes are scattered across the grid with black (empty) space between them.
  output: |
    The shapes from the input have been rearranged:
    1. The blue 'U' shape is now in the top-left corner (rows 0-2, columns 1-3)
    2. The sky-colored square is now directly to the right of the blue 'U' (rows 0-3, columns 5-7)
    3. The red 'T' shape is now in the bottom-right corner (rows 10-12, columns 9-11)
    4. The blue 'L' shape is now in the bottom-right corner, below the red 'T' (rows 10-12, columns 13-15)
    All shapes have been moved to the edges of the grid, leaving a large empty black space in the center.

