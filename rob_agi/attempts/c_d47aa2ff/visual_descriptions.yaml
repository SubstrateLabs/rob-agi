example_0:
  input: |
    The input grid is 10x21. A vertical gray (5) line divides it into two equal halves:
    Left half (columns 0-9):
    - Magenta (6) squares at (1,8) and (4,3)
    - Green (3) squares at (2,2), (2,5), (8,1), and (8,8)
    Right half (columns 11-20): Mirror image of the left half
    Central column (10): Entirely gray (5)
    All other cells are black (0)
    Note: The right half is not used in the solution but provides context for the pattern.
  output: |
    The output grid is 10x10, derived from the left half of the input:
    - All colored squares from the left half remain unchanged
    - New blue (1) square added at (6,6)
    - New red (2) square added at (5,6)
    - The central gray line is removed
    - All other cells remain black (0)
    Key observation: The new colored squares are placed in the right half of this grid, avoiding existing colored squares.

example_1:
  input: |
    10x21 grid with a central gray (5) line. Symmetrical pattern on both sides:
    Left half (columns 0-9):
    - Yellow (4) squares at (0,3) and (4,7)
    - Sky blue (8) squares at (1,6) and (7,3)
    - Brown (9) squares at (3,1) and (5,1)
    Right half (columns 11-20): Mirror image of the left half
    Central column (10): Entirely gray (5)
    All other cells are black (0)
  output: |
    10x10 grid based on the left half of the input:
    - Existing colored squares unchanged
    - New blue (1) squares added at (3,5) and (6,7)
    - New red (2) squares added at (3,6) and (8,7)
    - Central gray line removed
    - All other cells remain black (0)
    Note: The new colored squares are placed in balanced positions, avoiding clusters.

example_2:
  input: |
    10x21 grid with central gray (5) line. Symmetrical layout:
    Left half (columns 0-9):
    - Sky blue (8) squares at (1,7), (2,3), and (8,3)
    - Green (3) squares at (3,1), (3,9), (4,5)
    - Magenta (6) squares at (5,3), (6,7), and (8,7)
    Right half (columns 11-20): Mirror image of the left half
    Central column (10): Entirely gray (5)
    All other cells are black (0)
  output: |
    10x10 grid derived from the left half:
    - Existing colored squares unchanged
    - New blue (1) squares added at (3,7) and (6,8)
    - New red (2) squares added at (4,6) and (8,7)
    - Central gray line removed
    - All other cells remain black (0)
    Observation: New squares are placed to balance the existing pattern, with red squares adjacent to blue ones.

