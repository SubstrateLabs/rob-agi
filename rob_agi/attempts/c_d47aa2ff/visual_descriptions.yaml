example_0:
  input: |
    The input grid is 10x21 in size. The most prominent feature is a vertical gray (5) line running down the center of the grid, dividing it into two halves. On either side of this line, there are several colored squares scattered symmetrically:
    - Two magenta (6) squares in the 2nd and 5th rows
    - Four green (3) squares in the 3rd row and 9th row
    - One magenta (6) square in the 9th row
    The rest of the grid is filled with black (0), which can be considered empty space.
  output: |
    The output grid is 10x10, exactly half the width of the input. It appears to be the left half of the input grid with two key changes:
    - A blue (1) square has been placed in the 7th row, 7th column
    - A red (2) square has been placed in the 6th row, 7th column
    All other colored squares from the left half of the input remain in their original positions. The central gray line is no longer present.

