example_0:
  input: |
    A 15x15 grid with a gray (5) T-shaped object in the top-left corner. The T is 4 cells wide at the top and 4 cells tall. The rest of the grid is mostly black (0) with scattered colored cells:
    - Red (2) in the top-left and bottom-right
    - Green (3) near the top-right
    - Blue (1) in the middle-left and middle-right
    - Yellow (4) in the bottom-left and middle
    - Orange (7) in the middle-right and bottom
    - Sky (8) in the middle
    - Brown (9) in the bottom-left
    - Magenta (6) in the bottom-left
  output: |
    The 15x15 grid maintains the gray (5) T-shaped object in the top-left corner. Many of the scattered colored cells have been removed, leaving only:
    - Red (2) in the top-left
    - Green (3) near the top-right
    - Blue (1) in the middle-left and middle-right
    - Yellow (4) in the middle
    - Orange (7) in the middle-right
    - Sky (8) in the middle
    - Brown (9) in the bottom-left
    - Magenta (6) in the bottom-left

