example_0:
  input: |
    A 15x15 grid with a prominent gray (5) T-shaped object in the top-left corner. The T is 4 cells wide at the top and 4 cells tall, forming a clear boundary. The rest of the grid is predominantly black (0) with isolated colored cells:
    - Red (2): Two isolated cells, one in the top-left quadrant and one in the bottom-right
    - Green (3): A single isolated cell near the top-right corner
    - Blue (1): Two isolated cells, one in the middle-left and one in the middle-right
    - Yellow (4): Two isolated cells, one in the bottom-left quadrant and one in the middle
    - Orange (7): Two isolated cells, one in the middle-right and one near the bottom
    - Sky blue (8): A single isolated cell in the middle of the grid
    - Brown (9): A single isolated cell in the bottom-left quadrant
    - Magenta (6): A single isolated cell in the bottom-left quadrant
    Note: No clear patterns or clusters of non-gray colors are present.

  output: |
    The 15x15 grid retains the gray (5) T-shaped object in the top-left corner, unchanged. The transformation has removed several isolated colored cells, resulting in:
    - Preservation of one cell for each color present in the input
    - Retention of cells that were more isolated in the input
    - A maximum of 3-4 cells per color
    - Maintained spatial distribution, avoiding clustering
    Specific changes:
    - Red (2): Kept in the top-left, removed from bottom-right
    - All other colors: Kept one instance of each in their original positions
    - Several black (0) cells have been added where colored cells were removed

example_1:
  input: |
    A 15x15 grid with the identical gray (5) T-shaped object in the top-left corner. The rest of the grid has a higher density of colored cells compared to example_0:
    - Yellow (4): Forms a small cluster (3-4 cells) in the middle-right, with additional isolated cells in the top-left and middle
    - Blue (1): Three isolated cells spread across the grid (top-right, middle-left, bottom-right)
    - Brown (9): Two isolated cells (top-middle and bottom-left)
    - Red (2): Forms a notable cluster (4-5 cells) in the bottom-right, with additional cells in the top-middle and middle-right
    - Green (3): Forms a small cluster (2-3 cells) in the bottom, with an additional cell in the middle-left
    - Magenta (6): A single isolated cell in the middle-left
    - Orange (7): A single isolated cell in the bottom-middle
    - Sky blue (8): Two isolated cells (top-left and bottom-right)
    Note: Presence of small clusters and a more even distribution of colors across the grid.

  output: |
    The 15x15 grid maintains the gray (5) T-shaped object in the top-left corner. The transformation has balanced color distribution and reduced clustering:
    - Yellow (4): Kept in the top-left and middle, cluster in middle-right reduced to a single cell
    - Blue (1): Maintained in the top-right and middle-left, removed from bottom-right
    - Brown (9): Both instances preserved due to their isolation
    - Red (2): Cluster in bottom-right significantly reduced (1-2 cells), kept in top-middle and middle-right
    - Green (3): Small cluster in bottom reduced to one cell, kept in middle-left
    - Magenta (6), Orange (7), Sky blue (8): All instances preserved due to initial isolation and low count
    Note: The output demonstrates a balance between preserving larger structures, maintaining color variety, and reducing overall color density.

