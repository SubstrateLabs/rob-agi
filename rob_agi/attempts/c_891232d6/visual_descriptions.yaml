example_2:
  input: |
    A 20x23 grid with mostly black (0) background. There are several orange (7) shapes:
    - A horizontal line of 6 squares in the 5th row, right side
    - A horizontal line of 5 squares in the 10th row, left side
    - A horizontal line of 6 squares in the 13th row, right side
    - A horizontal line of 7 squares in the 16th row, left side
    - A horizontal line of 4 squares in the 18th row, center
    - A horizontal line of 3 squares in the 21st row, left side
    There are also two magenta (6) squares in the bottom row: one on the far left and one 4 squares to its right
  output: |
    The grid maintains the same size and mostly black background. The orange shapes are transformed:
    - Each horizontal line is now "capped" on the left end with a sky blue (8) square
    - Red (2) squares extend downward from the right end of each orange line, forming reverse-L shapes
    - These red lines connect to form a tree-like structure, with all lines eventually connecting to the bottom of the grid
    - The magenta squares remain unchanged
    This creates a pattern of interconnected orange shapes with a red "skeleton" extending downward, all anchored to the bottom of the grid

example_3:
  input: |
    A 10x17 grid with mostly black (0) background. There are several orange (7) shapes:
    - A horizontal line of 3 squares in the 6th row, center
    - An L-shape (3 horizontal, 1 vertical) in the 6th and 7th rows, slightly left of center
    - A horizontal line of 4 squares in the 12th row, left side
    There is also one magenta (6) square in the bottom-left corner
  output: |
    The grid maintains the same size and mostly black background. The orange shapes are transformed:
    - The horizontal line in the 6th row is now "capped" on the left end with a sky blue (8) square
    - The L-shape is modified: the vertical part is replaced with a magenta (6) square
    - Red (2) squares extend downward from the right end of each orange line, forming reverse-L shapes
    - These red lines connect to form a simple tree-like structure, with all lines eventually connecting to the bottom of the grid
    - The original magenta square remains unchanged
    This creates a pattern of interconnected orange shapes with a red "skeleton" extending downward, all anchored to the bottom of the grid

