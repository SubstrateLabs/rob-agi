example_0:
  input: |
    A 28x19 grid with mostly black (0) background. There are several orange (7) shapes and patterns:
    - A small L-shape in the top-right corner
    - A horizontal line of 3 squares in the 2nd row from the top, slightly right of center
    - Two disconnected squares in the 3rd row
    - A single square in the 4th row
    - A horizontal line of 6 squares in the 5th row, right of center
    - A single square in the 7th row
    - A horizontal line of 5 squares in the 8th row, right of center
    - Three disconnected squares forming a diagonal line in rows 9-11
    - A horizontal line of 7 squares in the 12th row, left of center
    - Two squares next to each other in the 15th row
    - A horizontal line of 5 squares in the 17th row, center-right
    - A horizontal line of 5 squares in the 19th row, left of center
    - A horizontal line of 7 squares in the 24th row, far left
    - A horizontal line of 4 squares in the 18th row from the bottom, center-right
    - Three disconnected squares forming a diagonal line in the bottom 3 rows
    There are also two magenta (6) squares: one in the bottom-left corner and one 3 squares to its right
  output: |
    The grid maintains the same size and mostly black background. The orange shapes are transformed:
    - The L-shape in the top-right is unchanged
    - The horizontal lines are now "capped" on the left end with a sky blue (8) square and have red (2) squares extending downward from their right ends, forming reverse-L shapes
    - Isolated squares or short segments are connected by red lines to the nearest larger shape or to the bottom of the grid
    - The magenta squares remain unchanged
    This creates a pattern of interconnected orange shapes with red "tails" extending downward, all anchored to the bottom of the grid

