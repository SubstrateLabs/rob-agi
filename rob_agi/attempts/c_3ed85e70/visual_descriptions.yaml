example_2:
  input: |
    Grid size: 30x30
    Key features:
    1. Green area (color 3):
       - 6x6 square in top-left corner
       - Contains: 3x3 area with red, blue, yellow pattern (top-left), 4x4 sky blue square (bottom-right)
    2. Black area (color 0):
       - Majority of grid below green area
    3. Colored patterns in black area:
       - Two 2x2 yellow squares (upper middle)
       - Two 2x2 magenta squares, each containing 2x2 sky blue square (one pair on each side)
       - Multiple 2x2 sky blue, red, and yellow squares (scattered)
       - 3x3 blue square (bottom left corner)
       - 2x2 red square (near center bottom)
    Note: Focus on the complex pattern within the green area and the nested magenta-sky blue squares.

  output: |
    Grid size: Unchanged (30x30)
    Key transformations:
    1. Green area (color 3):
       - Unchanged 6x6 square in top-left corner
       - 3x3 pattern expands to 5x5, maintaining internal structure
       - 4x4 sky blue square remains unchanged
    2. Expansion of small squares:
       - All isolated 2x2 squares -> 4x4 squares with same-color border
    3. Growth of 3x3 squares:
       - 3x3 blue square -> 5x5 square
    4. Special case for nested squares:
       - 2x2 magenta squares with 2x2 sky blue centers -> 6x6 magenta squares with 4x4 sky blue centers
    5. New connections:
       - Yellow squares in upper middle connected
       - Sky blue squares form large connected structure
       - Red squares in bottom half connected
    6. Overall effect:
       - Most colored elements enlarged
       - Many previously isolated elements now interconnected
    Note: Pay attention to how nested structures grow and how the solution handles complex patterns within the green area.

