example_0:
  input: |
    Grid size: 30x30
    Key features:
    1. Green area (color 3):
       - 7x7 square in top-left corner
       - Contains a 4x4 blue (1) square with a 2x2 sky blue (8) center
    2. Black strip (color 0):
       - Horizontal, full width, below green area
    3. Colored patterns in black area:
       - 3x3 blue square (upper left)
       - 3x3 red square with yellow center (right of blue square)
       - Multiple 2x2 sky blue squares (scattered)
       - 3x3 red square (bottom right)
       - Multiple 2x2 yellow squares (scattered)
       - 3x3 blue square (bottom right corner)
    Note: Focus on sizes, colors, and relative positions of patterns.

  output: |
    Grid size: Unchanged (30x30)
    Key transformations:
    1. Green area (color 3):
       - Unchanged 7x7 square in top-left corner
    2. Expansion of small squares:
       - All 2x2 squares (sky blue, yellow) -> 4x4 squares with same-color border
    3. Growth of 3x3 squares:
       - All 3x3 squares -> 5x5 squares, preserving original centers
    4. Special case:
       - 3x3 red square with yellow center -> 5x5 red square with 3x3 yellow center
    5. New connections:
       - Blue squares connected by blue border
       - Red squares connected by red border
       - Yellow squares connected by yellow border
    6. Overall effect:
       - All colored elements enlarged
       - Previously isolated elements now interconnected
    Note: Observe how different sized elements grow and how same-color regions connect.

