example_0:
  input: |
    The grid is 30x30. The top-left 7x7 area is filled with green (3), with a 4x4 blue (1) square in its center. This blue square has a 2x2 sky blue (8) square in its center. Below this, there's a horizontal strip of black (0) spanning the entire width. The rest of the grid contains various patterns:
    - A 3x3 blue square in the upper left of the black area
    - A 3x3 red square with a yellow center, slightly to the right of the blue square
    - Several 2x2 sky blue squares scattered around
    - A 3x3 red square in the bottom right
    - Various 2x2 yellow squares
    - A 3x3 blue square in the bottom right corner
  output: |
    The grid maintains its 30x30 size and the green 7x7 area in the top-left corner. The main changes are:
    - All previously isolated 2x2 squares (sky blue, yellow) are now surrounded by a border, forming 4x4 squares
    - The 3x3 squares (blue, red) are expanded to 5x5 squares, maintaining their original centers
    - The 3x3 red square with yellow center is now a 5x5 red square with a 3x3 yellow center
    - New connections are formed:
      - A blue border connects the large blue square in the top-left to the blue square below
      - A red border connects the central red square to the bottom-right red square
      - A yellow border connects the central yellow square to the bottom-right yellow square
    - The overall effect is that all colored elements are now larger and interconnected

