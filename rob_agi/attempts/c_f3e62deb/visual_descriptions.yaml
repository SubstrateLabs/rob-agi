example_0:
  input: |
    A 10x10 grid with mostly black (empty) squares. In the center-left area, there's a 3x3 hollow square shape made of sky blue (8) squares. The hollow square is positioned at rows 2-4 and columns 2-4.
  output: |
    A 10x10 grid with mostly black (empty) squares. The 3x3 hollow square shape made of sky blue (8) squares has moved to the right edge of the grid. It now occupies rows 2-4 and columns 7-9.

