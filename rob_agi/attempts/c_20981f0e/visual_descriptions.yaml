example_0:
  input: |
    The grid is 19x13. There are four red dots (2) in rows 3, 8, and 13, evenly spaced horizontally. Between these red dots are blue (1) shapes that resemble incomplete rectangles or 'U' shapes. These blue shapes are not aligned vertically and appear at different heights in each section between the red dots. The rest of the grid is filled with black (0).
  output: |
    The grid maintains its 19x13 size and the four red dots (2) remain in their original positions. The blue (1) shapes have been rearranged. They now form more complete rectangles and are aligned vertically in each section between the red dots. The shapes in each section are now at the same height, creating a more organized appearance. Empty rows (all black) have been introduced above and below the blue shapes to accommodate this alignment.

