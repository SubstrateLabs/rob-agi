example_0:
  input: |
    A 15x15 grid with three distinct shapes above a horizontal gray line in the middle:
    1. A blue 3x3 square with a hollow center in the top-left quadrant
    2. A red L-shape in the top-middle area
    3. A green T-shape in the top-right quadrant
    Below the gray line, there's a single blue 3x3 square with a hollow center, centered horizontally and near the bottom of the grid.
  output: |
    A 9x15 grid with two shapes:
    1. The green T-shape from the input, now centered in the top half
    2. The blue 3x3 square with a hollow center, now centered in the bottom half
    The red L-shape is not present in the output.

