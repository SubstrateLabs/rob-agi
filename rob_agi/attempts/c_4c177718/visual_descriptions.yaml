example_0:
  input: |
    A 15x15 grid with a horizontal gray line (color 5) in row 5.
    Above the line:
    1. Blue shape (color 1): 3x3 square with hollow center at (1,2)
    2. Red shape (color 2): L-shape at (1,7)
    3. Green shape (color 3): T-shape at (1,11)
    Below the line:
    4. Blue shape (color 1): 3x3 square with hollow center, centered horizontally at (11,6)
    All other cells are black (color 0).
  output: |
    A 9x15 grid with two shapes:
    1. Green T-shape (color 3) from input, centered in top half (rows 0-4)
    2. Blue 3x3 square (color 1) with hollow center from below the line in input, centered in bottom half (rows 5-8)
    All other cells are black (color 0).
    Note: The red shape is absent, and the blue shape from above the line in the input is not used.

