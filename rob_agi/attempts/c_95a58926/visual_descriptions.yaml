  output: |
    Grid size: 21x17 (unchanged)
    Colors: Gray (5), Black (0), Green (3)
    Structure:
    - Gray lines: Same positions as input (3 horizontal, 2 vertical)
    - Green squares: Only at intersections of gray lines
    - All other squares: Black (0)
    Key changes: Green squares now form a regular pattern at gray line intersections, rest of grid is black

