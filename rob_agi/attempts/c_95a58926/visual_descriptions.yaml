example_0:
  input: |
    Grid size: 19x13
    Primary colors: Gray (5), Black (0), Red (2)
    Structure:
    - 3 horizontal gray lines: Rows 5, 10, 15
    - 2 vertical gray lines: Columns 5, 10
    - Red squares: Scattered randomly, higher concentration near gray line intersections and grid edges
    - Grid divided into 16 rectangular sections by gray lines
    Key observation: Red is the only color besides gray and black, appearing in a scattered pattern
  output: |
    Grid size: 19x13 (unchanged)
    Colors: Gray (5), Black (0), Red (2)
    Structure:
    - Gray lines: Same positions as input (3 horizontal, 2 vertical)
    - Red squares: Only at intersections of gray lines
    - All other squares: Black (0)
    Key changes: Red squares now form a regular pattern at gray line intersections, rest of grid is black

