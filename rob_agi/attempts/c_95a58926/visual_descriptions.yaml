example_0:
  input: |
    The grid is 19x13 in size. It consists primarily of gray (5) and black (0) squares, with some red (2) squares scattered throughout. There are three distinct horizontal gray lines spanning the entire width of the grid at rows 5, 10, and 15. Two vertical gray lines run from top to bottom at columns 5 and 10. The red squares appear randomly placed, mostly near the intersections of the gray lines and along the edges of the grid. The overall effect is a grid divided into 16 rectangular sections by the gray lines, with red dots appearing sporadically.
  output: |
    The output grid maintains the same 19x13 size and overall structure as the input. The three horizontal gray lines and two vertical gray lines remain in the same positions. However, all red squares have been removed, and new red squares have been added at specific intersections of the gray lines. These new red squares appear at the points where the horizontal and vertical gray lines meet, creating a regular pattern. The rest of the grid is filled with black (0) squares, giving a cleaner and more organized appearance compared to the input.

