example_0:
  input: |
    A 10x10 grid with gray (5) and black (0) squares. The gray squares form an irregular pattern across the grid. There are clusters of gray squares in the corners and along the edges, with some scattered in the center. The black squares create gaps and spaces between the gray areas.
  output: |
    The same 10x10 grid structure, but with blue (1) squares added. The blue squares form three distinct regions:
    1. A 3x3 square in the top-center (rows 0-2, columns 4-6)
    2. A 2x2 square in the middle-right (rows 5-6, columns 6-7)
    3. A 3x3 square in the bottom-left (rows 7-9, columns 2-4)
    These blue regions are placed in areas that were previously black. The gray and black squares remain unchanged in their positions.

example_1:
  input: |
    Another 10x10 grid with gray (5) and black (0) squares. The gray squares are more evenly distributed across the grid compared to the previous example. There are several small clusters of gray squares and some isolated gray squares. The pattern appears more random and less concentrated in specific areas.
  output: |
    The same 10x10 grid structure, with blue (1) squares added in four distinct regions:
    1. A 2x2 square in the top-left corner (rows 0-1, columns 2-3)
    2. A 2x2 square in the top-right (rows 2-3, columns 6-7)
    3. A 2x2 square in the middle-left (rows 6-7, columns 0-1)
    4. A 3x3 square in the center (rows 3-5, columns 3-5)
    As in the previous example, the blue squares are placed in areas that were previously black. The gray and black squares maintain their original positions.

example_2:
  input: |
    A 10x10 grid with gray (5) and black (0) squares. The gray squares form a more structured pattern compared to the previous examples. There's a concentration of gray squares in the bottom-right quadrant, forming almost a solid block. The rest of the grid has scattered gray squares, with more in the left and top edges than in the center.
  output: |
    The same 10x10 grid structure, with blue (1) squares added in three main regions:
    1. A 2x4 rectangle in the top-center (rows 0-1, columns 3-6)
    2. A 3x3 square in the middle-left (rows 2-4, columns 0-2)
    3. A 3x3 square in the bottom-left corner (rows 7-9, columns 0-2)
    Additionally, there's a single blue square at position (5,8).
    As in previous examples, the blue squares are placed in areas that were previously black, and the gray and black squares remain in their original positions.

