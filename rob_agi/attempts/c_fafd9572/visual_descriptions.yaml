example_0:
  input: |
    The grid contains several distinct shapes and patterns:
    1. In the top-left corner, there's a 3x3 blue (1) cross or plus sign shape.
    2. Directly below it, there's another 3x3 blue cross, slightly offset to the right.
    3. In the middle-left, there's a third 3x3 blue cross.
    4. In the bottom-left quadrant, there's a fourth 3x3 blue cross.
    5. Near the top-right corner, there's a small red-green-yellow (2-3-2) L-shaped pattern.
    6. The rest of the grid is filled with black (0), which can be considered empty space.
  output: |
    The output grid maintains the same overall structure but with color changes:
    1. The top-left cross is now red (2).
    2. The cross below it is now green (3).
    3. The middle-left cross is now green (3).
    4. The bottom-left cross is now red (2).
    5. The small L-shaped pattern in the top-right remains unchanged.
    6. All black (0) spaces remain black.

example_1:
  input: |
    The grid contains several distinct elements:
    1. In the top-right quadrant, there are two separate 2x2 blue (1) L-shapes, mirror images of each other.
    2. In the middle-left, there's a 2x2 blue L-shape.
    3. Near the left edge, in the middle, there's a vertical line of three squares: red (2), yellow (4), green (3) from top to bottom.
    4. The rest of the grid is filled with black (0), which can be considered empty space.
  output: |
    The output grid shows the following changes:
    1. The top-right L-shapes have changed colors. The left one is now red (2), and the right one is now yellow (4).
    2. The middle-left L-shape is now green (3).
    3. The vertical line of three squares remains unchanged: red (2), yellow (4), green (3).
    4. All black (0) spaces remain black.

