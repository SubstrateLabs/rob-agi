example_0:
  input: |
    A 30x30 grid with mostly black (0) background. There's a small blue (1) shape in the top-right quadrant, resembling an inverted 'L' or a small chair. In the bottom-left quadrant, there's a larger red (2) rectangular block spanning about 1/3 of the grid width and 1/4 of the grid height. This red block has a few black pixels scattered within it, creating small 'holes'. Below the red block, there's a single row with a few scattered red pixels. In the bottom-right quadrant, there's a small yellow (4) shape resembling a sideways 'T'. In the bottom-center, there's a small green (3) shape that looks like a small tree or arrow pointing upwards.
  output: |
    A 30x30 grid with mostly black (0) background. The shapes from the input have been rearranged and stacked vertically in the center of the grid, with black space above and below. From top to bottom: The blue (1) shape, now a solid rectangle. The green (3) shape, still resembling a small tree or upward arrow. The yellow (4) shape, now a solid rectangle. The red (2) shape, now a solid rectangle without the 'holes'. These shapes are touching each other vertically, forming a continuous column in the center of the grid.

example_1:
  input: |
    A 30x30 grid with a black (0) background. In the top-left quadrant, there's a yellow (4) shape resembling a cross or plus sign. In the top-right quadrant, there's a small green (3) shape that looks like a small 'L'. In the center-right, there's a magenta (6) shape that looks like a horizontal rectangle with a small extension on the right side. The bottom half of the grid is dominated by a large sky blue (8) shape that covers most of the width and about 1/3 of the height. This sky blue shape has some black pixels scattered within it, creating 'holes'. There are also some isolated sky blue pixels below this main shape.
  output: |
    A 30x30 grid with a black (0) background. The shapes from the input have been rearranged and stacked vertically in the center of the grid, with black space above and below. From top to bottom: The magenta (6) shape, now a solid rectangle. The yellow (4) shape, now a solid rectangle. The green (3) shape, now a solid rectangle. The sky blue (8) shape, now a solid rectangle without the 'holes'. These shapes are touching each other vertically, forming a continuous column in the center of the grid. The sky blue shape is significantly larger than the others, reflecting its larger size in the input.

test_case_0:
