example_0:
  input: |
    A 27x27 grid with a repeating pattern. The grid is divided into 3x3 cell blocks by blue (1) vertical and horizontal lines. These lines form a grid of 9x9 larger cells. Most of the space within these cells is black (0). In the top-left 3x3 block of the larger grid (rows 5-7, columns 5-7), there is a small green (3) shape. This shape looks like an upside-down "L" or a small corner piece.
  output: |
    The 27x27 grid maintains its overall structure with blue (1) lines dividing it into a 9x9 grid of larger cells. The key difference is that the small green (3) "L" shape that was in the top-left 3x3 block is now repeated in every third 3x3 block both horizontally and vertically. This creates a pattern where the green shape appears in a 3x3 grid within the larger 9x9 grid structure.

example_1:
  input: |
    A 23x23 grid with a similar structure to the previous example. It's divided into a 7x7 grid of larger cells by red (2) vertical and horizontal lines. Most of the space within these cells is black (0). In the top-right 3x3 block of the larger grid (rows 1-3, columns 21-23), there is a small yellow (4) shape. This shape looks like a sideways "T" or a small cross.
  output: |
    The 23x23 grid maintains its overall structure with red (2) lines dividing it into a 7x7 grid of larger cells. The key difference is that the small yellow (4) "T" shape that was in the top-right 3x3 block is now repeated in every other 3x3 block both horizontally and vertically. This creates a pattern where the yellow shape appears in a 4x4 grid within the larger 7x7 grid structure.

example_2:
  input: |
    A 25x25 grid with a similar structure to the previous examples. It's divided into an 8x8 grid of larger cells by sky blue (8) vertical and horizontal lines. Most of the space within these cells is black (0). In the top-right 3x3 block of the larger grid (rows 1-3, columns 21-23), there is a small red (2) shape. This shape looks like an "L" or a small corner piece.
  output: |
    The 25x25 grid maintains its overall structure with sky blue (8) lines dividing it into an 8x8 grid of larger cells. The key difference is that the small red (2) "L" shape that was in the top-right 3x3 block is now repeated in every third 3x3 block both horizontally and vertically, starting from the top-right corner. This creates a pattern where the red shape appears in a 3x3 grid within the larger 8x8 grid structure, but only in the top-right quadrant of the overall grid.