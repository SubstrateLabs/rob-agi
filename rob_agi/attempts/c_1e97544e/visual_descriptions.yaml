example_0:
  input: |
    The grid shows a diagonal pattern of repeating color sequences. The main sequence appears to be 5, 6, 1, 2, 3, 4, which repeats across the rows. This sequence is shifted one position to the right in each subsequent row, creating a diagonal effect. There are several areas of black (0) squares, forming irregular shapes that interrupt the pattern. These black areas are mostly concentrated in the upper right, middle left, and lower middle portions of the grid. Some rows have repeated colors at the beginning, particularly visible in the first few rows with repeated 6's.
  output: |
    The output grid maintains the same diagonal pattern of repeating color sequences as the input, but all black (0) squares have been filled in with the appropriate colors to continue the pattern. The sequence 5, 6, 1, 2, 3, 4 now repeats consistently across all rows, with the diagonal shift preserved. The areas that were previously black in the input have been seamlessly integrated into the pattern, making the entire grid uniform in its diagonal color sequence.

