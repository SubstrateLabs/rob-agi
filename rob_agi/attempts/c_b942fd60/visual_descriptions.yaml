    10x12 grid. Non-black squares: sky blue (0,3), orange (0,8), green (0,11), magenta (2,2), magenta (2,7), red (3,0), magenta (3,6), sky blue (3,11), orange (4,4), sky blue (4,7), green (5,3), orange (5,7), orange (7,1), sky blue (7,7), magenta (8,2), orange (8,9). Rest is black.
  output: |
