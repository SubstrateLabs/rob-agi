example_0:
  input: |
    A 10x10 grid with scattered colored squares. The top-left corner is empty (black). There's a sky blue square in the top-right quadrant, a green square below it, and a red square in the top-left quadrant. The middle row has an orange square on the left, a yellow square in the center, and a sky blue and magenta square on the right. The bottom half has an orange square on the left, a magenta square next to it, a sky blue square in the center, and an orange square on the bottom-right.
  output: |
    The same 10x10 grid, but with red lines connecting the colored squares. A vertical red line runs from the top sky blue square down to the bottom orange square, passing through the yellow square in the center. Horizontal red lines connect the colored squares in rows 2, 3, 5, and 7. The original colored squares remain in their positions, and the black (empty) spaces that aren't part of the connecting lines are unchanged.

example_1:
  input: |
    A 12x12 grid with scattered colored squares. The top row has a green and orange square. The second row has a sky blue square on the left and an orange square on the right, with a green square at the far right. There are magenta squares in the middle rows, and the bottom half has several orange, sky blue, and green squares scattered around.
  output: |
    The same 12x12 grid, but with red lines connecting the colored squares. A vertical red line runs from the top green square down to the bottom orange square, branching horizontally to connect other colored squares. The original colored squares remain in their positions. The red lines form a tree-like structure, connecting all non-black squares without creating any loops.

example_2:
  input: |
    A 6x6 grid with a few colored squares. There's a green square in the top-left corner, an orange square in the top-right corner, a red square in the middle-left, another green square in the middle-right, and a sky blue square in the bottom-right corner. The rest is black (empty).
  output: |
    The same 6x6 grid, but with a red line connecting the colored squares. The line starts from the top-left green square, goes down to the red square, then across and up to the top-right orange square. It then goes down to the middle-right green square and finally to the bottom-right sky blue square. The original colored squares remain in their positions.

