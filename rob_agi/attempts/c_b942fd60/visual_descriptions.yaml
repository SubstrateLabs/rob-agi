example_0:
  input: |
    A 10x10 grid with scattered colored squares. The top-left corner is empty (black). There's a sky blue square in the top-right quadrant, a green square in the second row, an orange square in the second-to-last column of the second row, and a red square at the start of the third row. The middle row contains a orange square, a sky blue square, and a magenta square at the end. The second-to-last row has a magenta square and a sky blue square. The bottom row has a single orange square.
  output: |
    The same 10x10 grid with the original colored squares preserved, but now connected by red lines. Two vertical red lines are added: one in the 6th column and another spanning the full height in the 3rd column. Horizontal red lines connect the colored squares to these vertical lines, forming a network. The lines don't extend beyond the last colored square in any direction.

example_1:
  input: |
    A 12x12 grid with various colored squares scattered throughout. The top row has a green and orange square. The second row has a sky blue and orange square on opposite sides, with a green square at the end. There's a magenta square in the third row, two sky blue squares in the fourth row, and a red square at the start of the fifth row followed by a sky blue square. The middle rows have orange and magenta squares, while the bottom rows contain more orange, sky blue, and green squares.
  output: |
    The original colored squares are preserved, but now connected by a network of red lines. Two vertical red lines are added: one in the 8th column spanning almost the full height, and another in the 4th column spanning about half the grid. Horizontal red lines connect the colored squares to these vertical lines. The network forms a T-shape, with the horizontal part of the T in the third row from the top.

example_2:
  input: |
