example_0:
  input: |
    A 10x10 grid with scattered colored squares on a black background:
    - Sky blue (8): top-right corner (0,9), fifth row fifth column (4,4)
    - Green (3): second row third column (1,2)
    - Red (2): third row first column (2,0)
    - Orange (7): fifth row fifth column (4,4), seventh row second column (6,1)
    - Magenta (6): fifth row tenth column (4,9), eighth row third column (7,2)
    - Additional sky blue (8): ninth row fifth column (8,4)
  output: |
    The 10x10 grid with added red (2) lines connecting non-black squares:
    1. Horizontal line: from (2,0) to (2,9)
    2. Vertical line: from (0,4) to (9,4)
    3. Short horizontal segment: from (4,4) to (4,9)
    All original colored squares maintain their positions. The red lines form a T-shape, efficiently connecting all non-black squares.

example_1:
  input: |
    A 12x12 grid with colored squares on a black background:
    - Row 0: Green (3) at (0,4), Orange (7) at (0,5)
    - Row 1: Sky blue (8) at (1,2), Orange (7) at (1,8), Green (3) at (1,11)
    - Row 2: Magenta (6) at (2,6)
    - Row 3: Sky blue (8) at (3,3) and (3,9)
    - Row 4: Red (2) at (4,0), Sky blue (8) at (4,4)
    - Row 5: Orange (7) at (5,5)
    - Row 6: Magenta (6) at (6,9)
    - Row 7: Orange (7) at (7,2)
    - Row 8: Orange (7) at (8,4) and (8,9)
    - Row 9: Magenta (6) at (9,3)
    - Row 10: Green (3) at (10,1), Sky blue (8) at (10,7)
    - Row 11: Orange (7) at (11,4)
  output: |
    The 12x12 grid with added red (2) lines connecting non-black squares:
    1. Horizontal lines:
       - Row 1: from (1,1) to (1,11)
       - Row 5: from (5,0) to (5,11)
    2. Vertical lines:
       - Column 2: from (0,2) to (11,2)
       - Column 5: from (0,5) to (11,5)
       - Column 9: from (0,9) to (11,9)
    The red lines form a grid-like pattern, efficiently connecting all non-black squares. All original colored squares maintain their positions.

example_2:
  input: |
    A 6x6 grid with colored squares on a black background:
    - Green (3): (0,2), (2,4), (5,2)
    - Orange (7): (0,5)
    - Red (2): (2,0)
    - Sky blue (8): (5,5)
  output: |
    The 6x6 grid with added red (2) lines connecting non-black squares:
    1. Vertical line: from (0,2) to (5,2)
    2. Horizontal line: from (2,0) to (2,5)
    3. Short vertical segment: from (2,4) to (5,4)
    The red lines form a T-shape with an additional vertical segment, efficiently connecting all non-black squares. All original colored squares maintain their positions.

example_3:
  input: |
    An 8x8 grid with colored squares on a black background:
    - Orange (7): (0,0), (6,4)
    - Green (3): (0,7)
    - Red (2): (3,0)
    - Sky blue (8): (3,3)
  output: |
    The 8x8 grid with added red (2) lines connecting non-black squares:
    1. Horizontal line: from (1,0) to (1,7)
    2. Vertical line: from (0,6) to (7,6)
    3. Short horizontal segment: from (3,0) to (3,3)
    4. Short vertical segment: from (3,3) to (6,3)
    The red lines form an inverted L-shape with additional segments, efficiently connecting all non-black squares. All original colored squares maintain their positions.

example_4:
  input: |
    A 4x6 grid with colored squares on a black background:
    - Red (2): (1,0)
    - Sky blue (8): (1,4)
  output: |
    The 4x6 grid with added red (2) lines connecting non-black squares:
    1. Horizontal line: from (1,0) to (1,4)
    2. Vertical line: from (0,3) to (3,3)
    The red lines form an L-shape, efficiently connecting the two non-black squares. All original colored squares maintain their positions.

example_5:
  input: |
    An 8x6 grid with colored squares on a black background:
    - Orange (7): (0,3), (7,0)
    - Magenta (6): (1,0)
    - Red (2): (3,0)
    - Sky blue (8): (3,4), (5,5)
  output: |
    The 8x6 grid with added red (2) lines connecting non-black squares:
    1. Vertical line: from (0,1) to (7,1)
    2. Horizontal lines: from (1,0) to (1,5), from (3,0) to (3,5)
    The red lines form a double-T shape, efficiently connecting all non-black squares. All original colored squares maintain their positions.

