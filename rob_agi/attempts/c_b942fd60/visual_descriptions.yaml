example_4:
  input: |
    A 4x6 grid with mostly black (empty) spaces. There are two colored squares:
    - A red (2) square in the second row, first column
    - A sky blue (8) square in the second row, fifth column
  output: |
    The grid maintains its original colored squares, but adds a red (2) partial frame:
    1. A vertical red line is added in the fourth column, spanning the entire height of the grid.
    2. A horizontal red line is added in the second row, spanning from the left edge to the vertical line.
    These red lines connect the two colored squares:
    - The horizontal line starts at the red (2) square and extends rightward
    - The vertical line is adjacent to the sky blue (8) square
    The rest of the grid remains black (empty).

