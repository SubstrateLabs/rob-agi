example_0:
  input: |
    10x10 grid, predominantly black (0). Colored squares:
    - Top row: sky blue (8) at (0,4)
    - 2nd row: green (3) at (1,2), orange (7) at (1,8)
    - 3rd row: red (2) at (2,0)
    - 5th row: orange (7) at (4,4), sky blue (8) at (4,6), magenta (6) at (4,9)
    - 7th row: orange (7) at (6,1), magenta (6) at (6,8)
    - 8th row: sky blue (8) at (7,4)
    - 9th row: sky blue (8) at (8,4)
  output: |
    Original structure preserved with two key additions:
    1. Horizontal red (2) line across row 5, spanning full width.
    2. Vertical red (2) line in column 5, from top to horizontal line.
    Red lines connect:
    - Vertical: sky blue (8) at (0,4) to green (3) at (1,2)
    - Horizontal: orange (7) at (4,4) to sky blue (8) at (4,6)
    All other colored squares unchanged. Black spaces fill the rest.

example_1:
  input: |
    12x12 grid, predominantly black (0). Colored squares:
    - Row 0: green (3) at (0,4), orange (7) at (0,5)
    - Row 1: sky blue (8) at (1,2), orange (7) at (1,8), green (3) at (1,11)
    - Row 2: magenta (6) at (2,6)
    - Row 3: sky blue (8) at (3,3) and (3,9)
    - Row 4: red (2) at (4,0), sky blue (8) at (4,3)
    - Row 5: orange (7) at (5,5)
    - Row 6: magenta (6) at (6,9)
    - Row 7: orange (7) at (7,2)
    - Row 9: orange (7) at (9,6)
    - Row 10: sky blue (8) at (10,7), green (3) at (10,8)
    - Row 11: orange (7) at (11,4)
  output: |
    Original colored squares preserved. Red (2) lines added:
    1. Horizontal: full width of row 1
    2. Vertical: column 1 from top to row 6
    3. Horizontal: row 6 from left edge to column 1
    4. Vertical: column 7 from top to row 1
    Red lines connect:
    - Horizontal (row 1): sky blue (8) at (1,2) to orange (7) at (1,8)
    - Vertical (column 1): green (3) at (0,4) to red (2) at (4,0)
    - Vertical (column 7): ends at orange (7) at (1,8)
    - Horizontal (row 6): ends at magenta (6) at (6,9)
    Other colored squares unchanged, some now within red frame.

example_2:
  input: |
    6x6 grid, predominantly black (0). Colored squares:
    - Row 0: green (3) at (0,2), orange (7) at (0,5)
    - Row 2: red (2) at (2,0), green (3) at (2,4)
    - Row 5: green (3) at (5,2), sky blue (8) at (5,5)
  output: |
    Original colored squares preserved. Added:
    1. Vertical red (2) line in column 3, full height.
    Red line adjacent to:
    - Green (3) squares at (0,2), (2,4), and (5,2)
    Other colored squares unchanged.

example_3:
  input: |
    8x8 grid, predominantly black (0). Colored squares:
    - Row 0: orange (7) at (0,1), green (3) at (0,7)
    - Row 3: red (2) at (3,0), sky blue (8) at (3,2)
    - Row 6: orange (7) at (6,4)
  output: |
    Original colored squares preserved. Red (2) lines added:
    1. Vertical: full height in column 1
    2. Horizontal: full width in row 1
    3. Vertical: full height in column 6
    Red lines interact:
    - Column 1 line passes through orange (7) at (0,1)
    - Row 1 line adjacent to green (3) at (0,7)
    - Column 1 line adjacent to red (2) at (3,0)
    - Column 6 line near orange (7) at (6,4)
    Other colored squares unchanged, now within partial red frame.

example_4:
  input: |
    4x6 grid, predominantly black (0). Colored squares:
    - Row 1: red (2) at (1,0), sky blue (8) at (1,4)
  output: |
    Original colored squares preserved. Red (2) lines added:
    1. Vertical: full height in column 3
    2. Horizontal: row 1 from left edge to column 3
    Red lines connect:
    - Horizontal line starts at red (2) at (1,0)
    - Vertical line adjacent to sky blue (8) at (1,4)
    Rest of grid remains black (0).

example_5:
  input: |
    8x6 grid, predominantly black (0). Colored squares:
    - Row 0: orange (7) at (0,3)
    - Row 1: magenta (6) at (1,0)
    - Row 3: red (2) at (3,0), sky blue (8) at (3,4)
    - Row 5: sky blue (8) at (5,5)
    - Row 7: orange (7) at (7,0)
  output: |
    Original colored squares preserved. Red (2) lines added:
    1. Vertical: full height in column 1
    2. Horizontal: full width in row 1
    3. Vertical: full height in column 3
    Red lines interact:
    - Column 3 line passes through orange (7) at (0,3)
    - Row 1 line adjacent to magenta (6) at (1,0)
    - Column 1 line adjacent to red (2) at (3,0) and orange (7) at (7,0)
    - Column 3 line adjacent to sky blue (8) at (3,4)
    Sky blue (8) at (5,5) unchanged, within partial red frame.

test_case_0:
  input: |
    10x12 grid, predominantly black (0). Colored squares:
    - Row 0: sky blue (8) at (0,3), orange (7) at (0,8), green (3) at (0,11)
    - Row 2: magenta (6) at (2,2) and (2,7)
    - Row 3: red (2) at (3,0), magenta (6) at (3,6), orange (7) at (3,10)
    - Row 4: magenta (6) at (4,11)
    - Row 5: green (3) at (5,3), sky blue (8) at (5,7)
    - Row 6: magenta (6) at (6,9)
    - Row 7: orange (7) at (7,2), green (3) at (7,11)
    - Row 8: sky blue (8) at (8,2), magenta (6) at (8,9)
    - Row 9: green (3) at (9,5)
  output: |
    Original colored squares preserved. Red (2) lines added:
    1. Horizontal: full width in row 1
    2. Vertical: column 1 from top to row 6
    3. Vertical: column 5 from top to bottom
    4. Horizontal: row 6 from left edge to column 5
    5. Short horizontals: row 3 and row 8, connecting vertical lines
    Red lines interact:
    - Row 1 line adjacent to sky blue (8) at (0,3) and orange (7) at (0,8)
    - Column 1 line passes through red (2) at (3,0)
    - Column 5 line adjacent to green (3) at (5,3)
    - Row 6 line ends near magenta (6) at (6,9)
    - Row 8 short line connects sky blue (8) at (8,2) and magenta (6) at (8,9)
    Other colored squares unchanged, some within red frame.
