example_0:
  input: |
    10x10 grid. Non-black squares: sky blue (4,0), green (2,2), red (2,0), orange (4,4), yellow (4,6), sky blue (4,7), magenta (4,9), orange (6,1), magenta (7,2), sky blue (8,4), orange (9,9). Rest is black.
  output: |
    Original grid with red lines (value 2) connecting non-black squares. Vertical line from (0,4) to (9,4). Horizontal lines in rows 2, 3, 5, and 7. No diagonal connections. Red lines don't extend past outermost colored squares.

example_1:
  input: |
    12x12 grid. Non-black squares: green (0,4), orange (0,5), sky blue (1,2), orange (1,8), green (1,11), magenta (2,6), magenta (3,7), red (4,0), sky blue (4,3), orange (5,5), magenta (6,9), orange (7,6), sky blue (8,7), orange (10,7), green (10,8). Rest is black.
  output: |
    Original grid with red lines (value 2) forming a minimal tree-like network. Connects all non-black squares vertically and horizontally. No loops or diagonal connections. Red lines don't extend past outermost colored squares.

example_2:
  input: |
    6x6 grid. Non-black squares: green (0,2), orange (0,5), red (2,0), green (2,4), sky blue (5,5). Rest is black.
  output: |
    Original grid with red lines (value 2) connecting all non-black squares. Forms a minimal path: (0,2) - (2,0) - (2,4) - (0,5) - (5,5). No diagonal connections. Red lines don't extend past outermost colored squares.

example_3:
  input: |
    8x8 grid. Non-black squares: orange (0,1), green (0,7), red (3,0), sky blue (3,2), orange (6,1). Rest is black.
  output: |
    Original grid with red lines (value 2) connecting all non-black squares. Vertical line from (0,1) to (6,1). Horizontal connections to (3,2) and (0,7). No diagonal connections. Red lines don't extend past outermost colored squares.

example_4:
  input: |
    4x6 grid. Non-black squares: red (0,0), sky blue (1,4). Rest is black.
  output: |
    Original grid with red line (value 2) connecting the two non-black squares. Path: (0,0) - (0,2) - (1,2) - (1,4). No diagonal connections. Red line doesn't extend past outermost colored squares.

example_5:
  input: |
    8x6 grid. Non-black squares: magenta (0,0), orange (0,5), red (3,0), sky blue (3,5), orange (7,0), sky blue (7,5). Rest is black.
  output: |
    Original grid with red lines (value 2) connecting all non-black squares. Vertical lines at columns 0 and 5. Horizontal connections at rows 0, 3, and 7. No diagonal connections. Red lines don't extend past outermost colored squares.

test_case_0:
