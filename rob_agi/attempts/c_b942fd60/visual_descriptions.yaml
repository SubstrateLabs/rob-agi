example_0:
  input: |
    A 10x10 grid with scattered colored squares. The grid is mostly empty (black), with a few colored squares:
    - An sky blue (8) square in the top right corner
    - A green (3) square in the second row, third column
    - A red (2) square in the third row, first column
    - An orange (7) square in the middle of the grid
    - A sky blue (8) square and a magenta (6) square in the fifth row
    - An orange (7) square, a magenta (6) square, and a sky blue (8) square scattered in the bottom half
  output: |
    The same 10x10 grid, but with two significant changes:
    1. A red (2) line has been drawn from the original red square in the top-left, extending right and then down, forming an "L" shape.
    2. Another red (2) line has been drawn horizontally across the middle of the grid.
    All other colored squares remain in their original positions.

example_1:
  input: |
    A 12x12 grid with various colored squares scattered throughout:
    - Green (3) and orange (7) squares in the top row
    - Sky blue (8) and orange (7) squares in the second row
    - A magenta (6) square in the third row
    - Two sky blue (8) squares in the fourth row
    - A red (2) square and a sky blue (8) square in the fifth row
    - An orange (7) square in the sixth row
    - A magenta (6) square in the seventh row
    - An orange (7) square in the eighth row
    - Two orange (7) squares in the ninth row
    - A magenta (6) square in the tenth row
    - Green (3) and sky blue (8) squares in the eleventh row
    - An orange (7) square in the last row
  output: |
    The same 12x12 grid, but with red (2) lines added:
    1. A horizontal red line in the second row, connecting the sky blue and orange squares
    2. A vertical red line from the top, passing through the magenta square in the third row, and extending to the bottom
    3. An "L" shaped red line starting from the red square in the fifth row, extending right and then down to the bottom
    The red lines form a kind of irregular grid pattern. All original colored squares remain in their positions.

example_2:
  input: |
    A 6x6 grid with a few colored squares:
    - A green (3) square in the top row, third column
    - An orange (7) square in the top right corner
    - A red (2) square in the third row, first column
    - A green (3) square in the third row, fifth column
    - A green (3) square in the bottom row, third column
    - A sky blue (8) square in the bottom right corner
  output: |
    The same 6x6 grid, but with a red (2) line added:
    The line starts from the original red square in the third row, first column, extends up to the second row, then right to the fourth column, and finally down to the bottom of the grid.
    This forms a rectangular shape encompassing the central area of the grid.
    All original colored squares remain in their positions.

example_3:
  input: |
    An 8x8 grid with scattered colored squares:
    - An orange (7) square in the top left corner
    - A green (3) square in the top right corner
    - A red (2) square and a sky blue (8) square in the fourth row
    - An orange (7) square near the bottom right
  output: |
    The same 8x8 grid, but with red (2) lines added:
    1. A horizontal red line in the second row, extending from left to right
    2. A vertical red line from the top to bottom, two columns from the right edge
    These lines form an "L" shape, with the corner in the top-right area of the grid.
    All original colored squares remain in their positions.

example_4:
  input: |
    A 4x6 grid with only two colored squares:
    - A red (2) square in the second row, first column
    - A sky blue (8) square in the second row, fifth column
  output: |
    The same 4x6 grid, but with a red (2) line added:
    The line starts from the original red square, extends up to the top row, then right to the fourth column, and finally down to the bottom of the grid.
    This forms a rectangular shape encompassing the central area of the grid.
    The original sky blue square remains in its position.

example_5:
  input: |
    An 8x6 grid with scattered colored squares:
    - An orange (7) square in the top right corner
    - A magenta (6) square in the second row, first column
    - A red (2) square in the fourth row, first column
    - A sky blue (8) square in the fourth row, fifth column
    - A sky blue (8) square in the bottom right corner
    - An orange (7) square in the bottom left corner
  output: |
    The same 8x6 grid, but with red (2) lines added:
    1. A vertical red line from top to bottom in the second column
    2. A horizontal red line in the fourth row, extending from the original red square to the right edge of the grid
    These lines form an "L" shape, with the corner in the top-left area of the grid.
    All original colored squares remain in their positions.

test_case_0:
  input: |
    A 10x12 grid with various colored squares scattered throughout:
