example_0:
  input: |
    A 10x10 grid with mostly black (empty) spaces. There are scattered colored squares:
    - An orange (7) square in the top right corner
    - A sky blue (8) square in the top left corner
    - A green (3) square in the second row, third column
    - A red (2) square in the third row, first column
    - An orange (7) square in the middle of the grid
    - A sky blue (8) square next to the orange one
    - A magenta (6) square at the right edge of the middle row
    - An orange (7) square in the bottom left corner
    - A magenta (6) square in the third-to-last row
    - Two sky blue (8) squares in the bottom half
  output: |
    The grid maintains most of its original structure, but with two significant changes:
    1. A horizontal red (2) line has been added across the middle of the grid.
    2. A vertical red (2) line has been added, starting from the top edge, going down to meet the horizontal line.
    These red lines connect some of the colored squares:
    - The vertical line starts at the sky blue (8) square in the top left
    - It passes through the green (3) square
    - It connects to the horizontal line, which passes through the orange (7) and sky blue (8) squares in the middle
    - The horizontal line extends to both edges of the grid
    All other colored squares remain in their original positions.

example_1:
  input: |
    A 12x12 grid with mostly black (empty) spaces. Colored squares are scattered throughout:
    - Green (3) and orange (7) squares in the top row
    - Sky blue (8) and orange (7) squares in the second row
    - A magenta (6) square in the third row
    - Two sky blue (8) squares in the fourth row
    - A red (2) square in the fifth row, first column
    - An orange (7) square in the middle
    - A magenta (6) square in the bottom right quadrant
    - Two orange (7) squares and a sky blue (8) square in the bottom three rows
    - A green (3) square in the bottom right corner
  output: |
    The grid maintains its original colored squares, but adds red (2) lines forming a partial frame or boundary:
    1. A horizontal red line spans the entire second row from left to right.
    2. A vertical red line starts from the top, intersects the horizontal line, and continues downward, stopping at the sixth row.
    3. Another horizontal red line appears in the seventh row, spanning from the left edge to the vertical line.
    4. A second vertical red line starts from the top right corner, goes down to meet the first horizontal line.
    These red lines connect or border several of the colored squares:
    - The top horizontal line passes through the sky blue (8) and orange (7) squares in the second row
    - The left vertical line starts at the green (3) square in the top row
    - The right vertical line ends at the orange (7) square in the second row
    - The bottom horizontal line ends at the magenta (6) square
    All other colored squares remain in their original positions, some now enclosed by the red lines.

example_2:
  input: |
    A 6x6 grid with mostly black (empty) spaces. There are a few colored squares:
    - A green (3) square in the top row, third column
    - An orange (7) square in the top right corner
    - A red (2) square in the third row, first column
    - A green (3) square in the third row, fifth column
    - A green (3) square in the bottom row, third column
    - A sky blue (8) square in the bottom right corner
  output: |
    The grid maintains its original colored squares, but adds a red (2) vertical line:
    1. A red vertical line is added in the fourth column, spanning the entire height of the grid.
    This red line connects or borders some of the colored squares:
    - It's adjacent to the green (3) square in the top row
    - It's adjacent to the green (3) square in the third row
    - It's adjacent to the green (3) square in the bottom row
    All other colored squares remain in their original positions.

