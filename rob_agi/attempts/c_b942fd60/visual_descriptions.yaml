example_0:
  input: |
    A 10x10 grid with scattered colored squares. The grid is mostly empty (black), with a few colored squares:
    - An sky blue (8) square in the top right corner
    - A green (3) square in the second row, third column
    - A red (2) square in the third row, first column
    - An orange (7) square in the second row, second to last column
    - A yellow (7) square in the middle, slightly to the right
    - A sky blue (8) square just right of the yellow square
    - A magenta (6) square at the far right of the same row as the yellow and sky blue
    - An orange (7) square in the third row from the bottom, second column
    - A magenta (6) square in the same row, third column
    - A sky blue (8) square two rows below the orange and magenta, in the middle
    - An orange (7) square in the bottom row, third from the right
  output: |
    The 10x10 grid maintains most of the colored squares from the input, but adds two prominent red (2) lines:
    - A horizontal red line in the middle of the grid, spanning the entire width
    - A vertical red line starting from the top, going down to the horizontal line, positioned about 1/3 from the left edge
    These red lines connect some of the existing colored squares and create a T-shape. Some observations:
    - The sky blue square in the top right is now connected to the red vertical line
    - The green square is now touching the red vertical line
    - The red square in the top left is now part of the vertical red line
    - The yellow and sky blue squares in the middle are now part of the horizontal red line
    - The magenta square on the right is now connected to the horizontal red line
    All other colored squares remain in their original positions.

example_1:
  input: |
    A 12x12 grid with scattered colored squares on a mostly black background:
    - A green (3) square in the top row, fifth column
    - An orange (7) square next to the green square
    - A sky blue (8) square in the second row, third column
    - An orange (7) square in the same row, near the right edge
    - A green (3) square at the far right of the second row
    - A magenta (6) square in the third row, about 1/3 from the left
    - Two sky blue (8) squares in the fourth row, one near the middle and one near the right
    - A red (2) square in the fifth row, far left
    - An orange (7) square in the sixth row, slightly right of center
    - A magenta (6) square three rows from the bottom, about 1/3 from the right
    - Two orange (7) squares in the third row from the bottom, one left of center and one right of center
    - A magenta (6) square in the fourth row from the bottom, left of center
    - A green (3) square in the second row from the bottom, second column
    - A sky blue (8) square in the same row, about 2/3 to the right
    - Another green (3) square next to the sky blue square
    - An orange (7) square in the bottom row, fifth column
  output: |
    The 12x12 grid maintains most of the colored squares from the input, but adds two prominent red (2) lines forming an inverted L-shape:
    - A horizontal red line in the second row from the top, spanning most of the width
    - A vertical red line starting from the left edge of the horizontal line, going down about 2/3 of the grid height
    These red lines connect or interact with some of the existing colored squares:
    - The green and orange squares in the top row are now connected by the red horizontal line
    - The sky blue square in the second row is now part of the red horizontal line
    - The orange and green squares on the right side of the second row are now connected to the red horizontal line
    - The magenta square in the third row is now connected to the red vertical line
    - The leftmost sky blue square in the fourth row is now connected to the red vertical line
    - The red square in the fifth row is now part of the red vertical line
    - The orange square in the sixth row is now connected to the red vertical line
    - A new small horizontal red line appears in the third row from the bottom, connecting the two orange squares
    All other colored squares remain in their original positions.

example_2:
  input: |
    A 6x6 grid with a few scattered colored squares:
    - A green (3) square in the top row, third column
    - An orange (7) square in the top row, far right
    - A red (2) square in the third row, far left
    - A green (3) square in the third row, second from the right
    - A sky blue (8) square in the bottom row, far right
    - A green (3) square in the bottom row, third column
  output: |
    The 6x6 grid maintains the colored squares from the input, but adds a prominent red (2) vertical line:
    - The vertical red line starts from the top row, fourth column
    - It extends all the way down to the bottom of the grid
    This red line interacts with some of the existing colored squares:
    - It's positioned just right of the green square in the top row
    - It passes through the middle of the grid, between the red square on the left and the green square on the right in the third row
    - It's positioned just left of the green square in the bottom row
    All other colored squares remain in their original positions.

example_3:
  input: |
    An 8x8 grid with scattered colored squares:
    - An orange (7) square in the top row, second column
    - A green (3) square in the second row, far right
    - A red (2) square in the fourth row, far left
    - A sky blue (8) square in the fourth row, third column
    - An orange (7) square in the third row from the bottom, fifth column
  output: |
    The 8x8 grid maintains the colored squares from the input, but adds two prominent red (2) lines forming an inverted L-shape:
    - A vertical red line starts from the top, second column from the right
    - A horizontal red line in the second row from the top, spanning the entire width
    These red lines interact with some of the existing colored squares:
    - The orange square in the top row is now connected to the horizontal red line
    - The green square in the second row is now connected to both the horizontal and vertical red lines
    - The red square in the fourth row is now part of the horizontal red line
    - The sky blue square in the fourth row is now connected to the vertical red line
    - The orange square near the bottom is now connected to the vertical red line
    All colored squares remain in their original positions.

example_4:
  input: |
    A 4x6 grid with a few colored squares:
    - A red (2) square in the second row, far left
    - A sky blue (8) square in the second row, second from the right
  output: |
    The 4x6 grid maintains the colored squares from the input, but adds a red (2) inverted L-shape:
    - A vertical red line starts from the top, fourth column
    - A horizontal red line in the second row, spanning from the left edge to the vertical line
    These red lines interact with the existing colored squares:
    - The red square in the second row is now part of the horizontal red line
    - The sky blue square in the second row is now connected to the vertical red line
    The overall effect is an inverted L-shape made of red squares.

example_5:
  input: |
    An 8x6 grid with scattered colored squares:
    - An orange (7) square in the top row, fourth column
    - A magenta (6) square in the second row, far left
    - A red (2) square in the fourth row, far left
    - A sky blue (8) square in the fourth row, second from the right
    - A sky blue (8) square in the bottom row, far right
    - An orange (7) square in the bottom row, far left
  output: |
    The 8x6 grid maintains the colored squares from the input, but adds two prominent red (2) lines forming an inverted L-shape:
    - A vertical red line starts from the top, second column
    - A horizontal red line in the second row from the top, spanning from the left edge to the vertical line
    These red lines interact with some of the existing colored squares:
    - The orange square in the top row is now connected to the vertical red line
    - The magenta square in the second row is now connected to both the horizontal and vertical red lines
    - The red square in the fourth row is now connected to the vertical red line
    - The sky blue square in the fourth row is indirectly connected to the vertical red line (the line stops just short of it)
    - The orange square in the bottom row is now connected to the vertical red line
    All colored squares remain in their original positions.

