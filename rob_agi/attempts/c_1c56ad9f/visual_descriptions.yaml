example_0:
  input: |
    A green (color 3) hollow rectangular shape centered in a 14x13 grid of black (0) squares. The green rectangle has outer dimensions of 9x7 squares. It contains three equally spaced vertical lines, creating four columns within the shape. The rectangle's borders and internal lines are all one pixel thick.
  output: |
    The green rectangular shape maintains its overall structure but exhibits a subtle wave-like distortion:
    1. The top and bottom horizontal edges remain straight and unchanged.
    2. The vertical edges and internal lines now have a slight zigzag pattern.
    3. The zigzag effect is most pronounced in the middle rows and diminishes towards the top and bottom.
    4. The distortion is symmetrical vertically, creating a mirrored effect between the upper and lower halves.
    5. The wave-like pattern maintains connectivity between all parts of the shape.
    6. The total area occupied by green pixels remains approximately the same as in the input.

example_1:
  input: |
    A red (color 2) hollow rectangular shape near the top of a 15x14 grid of black (0) squares. The red rectangle has outer dimensions of 6x12 squares. It contains one central vertical line, dividing the shape into two equal columns. All borders and the internal line are one pixel thick.
  output: |
    The red rectangular shape undergoes a more pronounced wave-like transformation:
    1. The top and bottom horizontal edges remain straight and in their original positions.
    2. The vertical edges and central line now form a distinct zigzag pattern.
    3. The zigzag effect alternates direction every two rows, creating a sinusoidal wave appearance.
    4. The amplitude of the wave is largest in the middle rows and decreases towards the top and bottom.
    5. The wave pattern is symmetrical both vertically and horizontally.
    6. Despite the significant distortion, all parts of the shape remain connected.
    7. The overall area and perimeter of the shape are preserved, with pixels shifting rather than being added or removed.

example_2:
  input: |
    A gray (color 5) hollow rectangular shape centered in a 15x15 grid of black (0) squares. The gray rectangle has outer dimensions of 9x10 squares. It contains one central vertical line and one central horizontal line, dividing the shape into four equal quadrants. All borders and internal lines are one pixel thick.
  output: |
    The gray rectangular shape undergoes a complex wave-like transformation affecting both vertical and horizontal elements:
    1. The top and bottom horizontal edges now have slight inward curves, with dips at the 1/3 and 2/3 points.
    2. The vertical edges and central vertical line form pronounced zigzag patterns.
    3. The central horizontal line also adopts a wave-like pattern, complementing the vertical distortions.
    4. The zigzag effect in vertical elements alternates direction in each row.
    5. Wave amplitudes vary, creating a dynamic and organic appearance.
    6. The left and right edges show outward bulges at certain points, balanced by inward curves elsewhere.
    7. The transformation maintains connectivity throughout the shape and preserves the overall rectangular structure.
    8. The total area occupied by gray pixels remains consistent with the input, despite the complex distortions.

example_3:
  input: |
    A sky blue (color 8) hollow rectangular shape near the top of a 15x15 grid of black (0) squares. The sky blue rectangle has outer dimensions of 6x13 squares. It contains two equally spaced vertical lines, dividing the shape into three columns. All borders and internal lines are one pixel thick.
  output: |
    The sky blue rectangular shape undergoes the most dramatic wave-like transformation:
    1. The top and bottom horizontal edges remain straight and unchanged.
    2. The vertical edges and two internal lines now form extreme zigzag patterns.
    3. The zigzag effect alternates direction in every row, creating a high-frequency wave appearance.
    4. Wave amplitudes vary significantly, with some peaks reaching the outer boundaries of the original shape.
    5. The transformation creates the illusion of the rectangle being divided into multiple smaller, interconnected sections.
    6. Despite the extreme distortion, all parts of the shape maintain connectivity.
    7. The overall rectangular structure is preserved, though significantly altered in appearance.
    8. The total area occupied by sky blue pixels remains consistent with the input, with pixels rearranged rather than added or removed.
    9. The transformation results in a highly dynamic, fluid-like appearance while retaining the essence of the original shape.
