example_0:
  input: |
    The 10x10 grid contains a large blue (1) shape in the center, resembling an irregular oval. This shape is the largest contiguous region in the grid. It's surrounded by smaller regions of magenta (6) and sky blue (8), with some black (0) spaces. The blue shape has noticeable irregularities on its right side, where it's interrupted by sky blue (8) and magenta (6) cells. These interruptions create small concavities in the blue shape. The blue region occupies approximately 40-45% of the grid.
  output: |
    The output grid maintains the overall structure but shows a subtle enhancement of the blue (1) shape. The shape has been expanded slightly, primarily filling in the concavities on its right side. This expansion results in a more regular, symmetrical form. The enhancement respects the boundaries of other significant color regions, only affecting a few cells on the right side and bottom of the blue shape. The expansion increases the blue region's coverage to approximately 45-50% of the grid.

