example_0:
  input: |
    A 10x12 grid with a prominent blue (1) 'E' shape on the left side, spanning the full height of the grid. The 'E' shape is 6 columns wide. To the right of the 'E', there are three distinct colored regions:
    1. A small 2x2 red (2) square in the top-right corner of the remaining space.
    2. A green (3) region shaped like an inverted 'L' in the middle-right area.
    3. A magenta (6) region shaped like a regular 'L' in the bottom-right area.
    The rest of the grid is filled with black (0), creating empty space around these colored regions.
  output: |
    A 10x6 grid that appears to be a compressed version of the input. The blue (1) 'E' shape remains intact on the left side. The colored regions from the right side of the input have been moved and rearranged:
    1. The red (2) 2x2 square is now at the bottom, just inside the right arm of the 'E'.
    2. The green (3) inverted 'L' shape is now in the upper-right corner, fitting inside the top right of the 'E'.
    3. The magenta (6) 'L' shape is now in the middle-right, also fitting inside the 'E'.
    The overall effect is that all colored regions are now contained within the blue 'E' shape, with no black (empty) spaces remaining.

example_1:
  input: |
    A 13x12 grid dominated by a gray (5) shape that resembles a stylized letter 'B' or perhaps a boot. This shape spans the full height of the grid and is 6 columns wide. Inside the 'loops' or 'cavities' of this gray shape, there are three distinct colored regions:
    1. A blue (1) right triangle in the bottom-right corner.
    2. A red (2) inverted 'L' shape in the middle-right area.
    3. A green (3) shape in the top-right that looks like a sideways 'T' or a small cross.
    The rest of the grid to the right of the gray shape is filled with black (0), creating empty space around these colored regions.
  output: |
    A 13x6 grid that is a compressed and rearranged version of the input. The gray (5) 'B' or 'boot' shape remains intact on the left side. The colored regions from the right side of the input have been moved and rearranged:
    1. The blue (1) right triangle is now at the bottom, fitting inside the lower 'cavity' of the gray shape.
    2. The red (2) inverted 'L' shape is now in the middle, also fitting inside the lower 'cavity' of the gray shape.
    3. The green (3) 'T' or cross shape is now at the top, fitting inside the upper 'cavity' of the gray shape.
    All colored regions are now contained within the gray 'B' or 'boot' shape, with no black (empty) spaces remaining.