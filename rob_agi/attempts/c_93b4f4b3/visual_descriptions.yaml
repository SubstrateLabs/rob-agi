example_0:
  input: |
    The input grid is 12x10. It contains a blue (1) frame on the left side, taking up 6 columns. This frame has a rectangular shape with some gaps in the middle. Inside this blue frame, there are three smaller colored rectangles: a red (2) 2x2 square in the top-right, a green (3) 4x2 rectangle in the middle-right, and a magenta (6) 4x2 rectangle in the bottom-right. The rest of the grid is filled with black (0), which can be considered as empty space.
  output: |
    The output grid is 6x10. It's essentially a compressed version of the input, removing all the black (empty) space. The blue frame remains intact, now taking up the entire width of the grid. The colored rectangles from the input are now positioned inside the blue frame: the green (3) rectangle is at the top, the magenta (6) rectangle is in the middle, and the red (2) square is at the bottom. Each colored shape is surrounded by the blue frame.

example_1:
  input: |
    The input grid is 12x13. It features a gray (5) frame on the left side, occupying 6 columns. This frame has a more complex shape with various indentations and protrusions. Inside this gray frame, there are three colored shapes: a blue (1) inverted L-shape in the bottom-right, a red (2) triangle-like shape in the middle-right, and a green (3) rectangle in the top-right. The rest of the grid is black (0), representing empty space.
  output: |
    The output grid is 6x13. Like the previous example, it's a compressed version of the input with all black space removed. The gray frame remains intact and now spans the entire width. The colored shapes from the input are repositioned inside the gray frame: the green (3) rectangle is at the bottom, the red (2) triangle-like shape is in the middle, and the blue (1) inverted L-shape is at the top. Each colored shape is surrounded by the gray frame, maintaining its original form but in a new position.

