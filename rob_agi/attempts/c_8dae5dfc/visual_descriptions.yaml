example_0:
  input: |
    The grid contains three distinct regions:
    1. A large sky blue (8) rectangular frame with an orange (7) interior.
    2. A smaller red (2) rectangular region in the bottom right, containing a blue (1) interior with a green (3) center.
    3. The rest is black (0), representing empty space.
    The sky blue frame has a thick border and occupies most of the left side of the grid. Inside this frame is a solid orange area, except for a yellow (4) square ring in the center, which surrounds a 3x3 green square.
    The red region in the bottom right is smaller, with a blue interior and a 2x2 green square at its center.
  output: |
    The overall structure remains similar, but colors have shifted:
    1. The large frame is now green (3), with a yellow (4) interior.
    2. The smaller region in the bottom right is now blue (1), with a red (2) interior and a sky blue (8) center.
    3. The black (0) empty space remains unchanged.
    The green frame now contains a solid yellow area, with an orange (7) square ring in the center, surrounding a 3x3 sky blue square.
    The blue region in the bottom right has a red interior with a 2x2 sky blue square at its center.

example_1:
  input: |
