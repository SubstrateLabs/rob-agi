    1. The large square frame is now brown (9)
    2. The outer ring is now green (3)
    3. The inner ring is now orange (7)
    4. The 2x2 center square is now blue (1)
    The black (0) empty space surrounding the structure remains unchanged.
    The colored structure maintains its centered position within the grid.

example_2:
  input: |
    The grid contains two distinct colored regions separated by black (0) space:
    1. Upper left: A sky blue (8) square containing a red (2) square, which in turn contains a blue (1) square.
    2. Lower right: A larger, more complex structure with a magenta (6) outer frame, green (3) inner frame, yellow (4) middle layer, and red (2) inner layer with a blue (1) core.
    Both structures are positioned at the corners of the grid, with black space between and around them.
  output: |
    The overall layout remains the same, but colors have shifted in both structures:
    1. Upper left: The outer square is now blue (1), the middle square is red (2), and the innermost square is sky blue (8).
    2. Lower right: The outer frame is now blue (1), the next layer is yellow (4), followed by orange (7), then green (3), with a magenta (6) core.
    The black (0) space separating and surrounding the structures remains unchanged.

