example_0:
  input: |
    The grid contains two distinct colored regions surrounded by black (0) space:
    1. Left region: A large sky blue (8) rectangular frame occupying most of the left side.
       - Thick border of sky blue (8)
       - Interior filled with orange (7)
       - Center contains a yellow (4) square ring surrounding a 3x3 green (3) square
    2. Bottom-right region: A smaller red (2) rectangular frame
       - Outer border of red (2)
       - Interior filled with blue (1)
       - Center contains a 2x2 green (3) square
    Note the nested structure of colors in each region, from outer to inner layers.

  output: |
    The overall structure and positions remain unchanged, but colors have shifted within each region:
    1. Left region:
       - Outer frame is now green (3)
       - Interior is filled with yellow (4)
       - Center contains an orange (7) square ring surrounding a 3x3 sky blue (8) square
    2. Bottom-right region:
       - Outer frame is now blue (1)
       - Interior is filled with red (2)
       - Center contains a 2x2 sky blue (8) square
    Observe how the colors have shifted inward, with the innermost color becoming the new outermost color in each region.

example_1:
  input: |
    The grid shows a single, centered structure surrounded by black (0) space:
    1. Outermost: Large sky blue (8) square frame with a thick border
    2. Next layer: Ring of orange (7)
    3. Inner layer: Ring of sky blue (8)
    4. Center: 2x2 red (2) square
    Note the symmetrical, nested structure of colors from the outer edge to the center.

  output: |
    The structure's position and shape remain the same, but colors have shifted:
    1. Outermost: The large square frame is now brown (9)
    2. Next layer: Ring of green (3)
    3. Inner layer: Ring of orange (7)
    4. Center: 2x2 blue (1) square
    Observe how each color has moved inward by one layer, with the centermost color (red) shifting to become the new outermost color (brown).

example_2:
  input: |
    The grid contains two separate colored structures in opposite corners, surrounded by black (0) space:
    1. Upper-left structure: Nested squares
       - Outer: Sky blue (8)
       - Middle: Red (2)
       - Inner: Blue (1)
    2. Lower-right structure: More complex nested shape
       - Outermost: Magenta (6) frame
       - Next layer: Green (3) frame
       - Middle layer: Yellow (4)
       - Inner layer: Red (2)
       - Core: Blue (1)
    Note the increasing complexity and number of color layers in the lower-right structure.

  output: |
    The positions and shapes of both structures remain unchanged, but colors have shifted within each:
    1. Upper-left structure:
       - Outer: Now Blue (1)
       - Middle: Still Red (2)
       - Inner: Now Sky blue (8)
    2. Lower-right structure:
       - Outermost: Now Blue (1)
       - Next layer: Now Yellow (4)
       - Middle layer: Now Orange (7) (note the new color appearance)
       - Inner layer: Now Green (3)
       - Core: Now Magenta (6)
    Observe how colors shift inward, with the innermost color becoming the new outermost color in each structure.

example_3:
  input: |
    The grid contains two distinct structures separated vertically by black (0) space:
    1. Upper structure: Rectangular shape
       - Outer frame: Blue (1)
       - Middle area: Magenta (6)
       - Inner rectangle: Sky blue (8)
    2. Lower structure: Square shape with more layers
       - Outermost frame: Red (2)
       - Next layer: Yellow (4)
       - Inner frame: Blue (1)
       - Core: Sky blue (8)
    Note the different number of color layers in each structure and their arrangement.

  output: |
    The overall layout and shapes remain the same, but colors have shifted within each structure:
    1. Upper structure:
       - Outer frame: Now Sky blue (8)
       - Middle area: Still Magenta (6)
       - Inner rectangle: Now Blue (1)
    2. Lower structure:
       - Outermost frame: Now Sky blue (8)
       - Next layer: Now Blue (1)
       - Inner layer: Now Yellow (4)
       - Core: Now Red (2)
    Observe how colors shift inward in each structure, with the innermost color becoming the new outermost color. The number of color layers in each structure remains consistent.
