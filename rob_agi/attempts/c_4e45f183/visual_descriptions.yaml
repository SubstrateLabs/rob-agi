example_0:
  input: |
    Grid structure: 19x19 with black (0) borders and two vertical black lines creating three 5x5 sections.
    Color palette: Primary - sky blue (8), Secondary - blue (1), Border - black (0)
    Left section (1-5, 1-5):
      - Sky blue (8) frame, 1 unit thick on top, left, and right; 2 units thick on bottom
      - Blue (1) interior
    Middle section (1-5, 7-11):
      - Predominantly blue (1)
      - Two sky blue (8) squares in top-left corner (1-2, 7-8)
    Right section (1-5, 13-17):
      - Predominantly blue (1)
      - Two sky blue (8) squares in bottom-right corner (4-5, 16-17)
    Note: Sections repeat vertically in rows 7-11 and 13-17

  output: |
    Grid structure: Maintained 19x19 with black borders and dividing lines
    Color palette: Unchanged - Primary (8), Secondary (1), Border (0)
    Transformation pattern:
    Left section (1-5, 1-5):
      - Sky blue (8) frame on left and top only, 1 unit thick
      - Blue (1) interior and right/bottom edges
    Middle section (1-5, 7-11):
      - Symmetrical sky blue (8) frame, 1 unit thick on top/sides, 2 units on bottom
      - Blue (1) interior
    Right section (1-5, 13-17):
      - Mirror of left section: sky blue (8) frame on right and top, 1 unit thick
      - Blue (1) interior and left/bottom edges
    Symmetry:
      - Vertical symmetry across entire grid
      - Horizontal symmetry between top and bottom thirds (rows 1-5 mirror 13-17)
    Note: Middle section (rows 7-11) maintains its own internal symmetry

example_1:
  input: |
    Grid structure: 19x19 with black (0) borders and two vertical black lines creating three 5x5 sections
    Color palette: Primary - green (3), Secondary - red (2), Border - black (0)
    Left section (1-5, 1-5):
      - Predominantly green (3)
      - Red (2) squares scattered, higher concentration in top-left
    Middle section (1-5, 7-11):
      - Predominantly green (3)
      - Two red (2) squares in top-left corner (1-2, 7-8)
    Right section (1-5, 13-17):
      - Predominantly green (3)
      - Red (2) squares scattered, higher concentration in bottom-right
    Note: Sections repeat vertically in rows 7-11 and 13-17, with slight variations

  output: |
    Grid structure: Maintained 19x19 with black borders and dividing lines
    Color palette: Unchanged - Primary (3), Secondary (2), Border (0)
    Transformation pattern:
    Left section (1-5, 1-5):
      - Red (2) frame on left and top, 1 unit thick
      - Green (3) interior and right/bottom edges
    Middle section (1-5, 7-11):
      - Symmetrical red (2) frame, 1 unit thick on sides, 2 units on top/bottom
      - Green (3) interior with red (2) center square
    Right section (1-5, 13-17):
      - Mirror of left section: red (2) frame on right and top, 1 unit thick
      - Green (3) interior and left/bottom edges
    Symmetry:
      - Perfect vertical and horizontal symmetry across entire grid
      - Each third (rows 1-5, 7-11, 13-17) internally symmetrical
    Note: Consistent pattern application across all three vertical thirds

