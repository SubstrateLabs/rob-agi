example_0:
  input: |
    A 30x30 grid with a complex pattern. The dominant colors are sky blue (8) and brown (9), forming large irregular shapes. There's a distinctive magenta (6) shape that resembles a sideways 'U' or horseshoe in the top-left quadrant. Red (2) and blue (1) dots are scattered throughout, often appearing in pairs. Yellow (4) forms small clusters, particularly near the edges. Green (3) appears in small amounts, often adjacent to magenta areas. Gray (5) is minimal, appearing in a few spots.
  output: |
    A much smaller 6x8 grid. The pattern is simpler but retains some elements from the input. The dominant colors are still sky blue (8) and brown (9), forming larger blocks. Yellow (4) is more prominent, forming a distinct shape on the left side. There's a single red (2) dot in the top-left corner. The magenta (6) is reduced to two small areas. Green (3) appears in two spots on the right edge.

