example_0:
  input: |
    The input grid is 23x23. It's mostly black (0) with a small magenta (6) rectangle in the center. The magenta rectangle is 2 cells wide and 4 cells tall, positioned vertically from rows 5 to 8 and columns 6 to 7.
  output: |
    The output grid is 23x23. It contains several distinct elements:
    1. Four magenta (6) squares, each 2x3 in size, positioned in the corners of the grid.
    2. Four green (3) rectangles, each 4x4 in size, positioned between the magenta squares.
    3. The original magenta rectangle from the input remains in the center.
    4. The green rectangles and magenta squares form a symmetrical pattern that resembles a picture frame or a stylized flower.

