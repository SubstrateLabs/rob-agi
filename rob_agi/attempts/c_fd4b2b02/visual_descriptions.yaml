example_0:
  input: |
    Grid size: 23x23
    Main shape: Magenta (6) rectangle
    Shape dimensions: 2x4 cells
    Shape position: Center (rows 5-8, columns 6-7)
    Background: Black (0)
  output: |
    Grid size: 23x23
    Pattern elements:
    1. Corner elements: Magenta (6) squares, 3x3 each
    2. Side elements: Green (3) rectangles, 4x4 each
    3. Center: Original magenta rectangle preserved
    Pattern characteristics:
    - Symmetrical across both axes
    - Forms a frame-like or flower-like structure
    - Corner elements and side elements alternate
    Background: Black (0)

example_1:
  input: |
    Grid size: 16x16
    Main shape: Green (3) rectangle
    Shape dimensions: 3x1 cells
    Shape position: Center (row 7, columns 7-9)
    Background: Black (0)
  output: |
    Grid size: 16x16
    Pattern elements:
    1. Corner elements: Magenta (6) squares, 3x3 each
    2. Side elements: Green (3) squares, 3x3 each
    3. Center: Original green rectangle preserved
    Pattern characteristics:
    - Symmetrical across both axes
    - Forms a cross-like or plus sign structure
    - Corner elements and side elements alternate
    Background: Black (0)

example_2:
  input: |
    Grid size: 26x26
    Main shape: Green (3) rectangle
    Shape dimensions: 2x5 cells
    Shape position: Upper-middle (rows 5-9, columns 11-12)
    Background: Black (0)
  output: |
    Grid size: 26x26
    Pattern elements:
    1. Corner elements: Green (3) rectangles, 2x5 each
    2. Side elements: Magenta (6) squares, 5x5 each
    3. Original position: Green rectangle preserved
    4. Accent: Single green (3) cell in bottom-right corner
    Pattern characteristics:
    - Symmetrical across both axes
    - Forms a cross-like structure
    - Corner elements and side elements alternate
    - Side elements form the main body, corner elements act as accents
    Background: Black (0)

