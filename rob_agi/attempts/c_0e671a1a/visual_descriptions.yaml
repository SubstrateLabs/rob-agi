example_0:
  input: |
    A 13x13 grid mostly filled with black (0). There are three colored squares:
    - A red square (2) in the top-left quadrant at position (2, 1)
    - A yellow square (4) in the top-right quadrant at position (6, 10)
    - A green square (3) in the bottom-left quadrant at position (11, 3)
    These colored squares form a triangle-like shape across the grid.
  output: |
    The same 13x13 grid, but now with a gray (5) rectangular path connecting the three colored squares:
    - The red square (2) remains at (2, 1)
    - The yellow square (4) remains at (6, 10)
    - The green square (3) remains at (11, 3)
    The gray path forms a rectangle that encloses these three squares, with:
    - A horizontal line from (2, 1) to (2, 10)
    - A vertical line from (2, 10) to (6, 10)
    - A horizontal line from (6, 10) to (6, 3)
    - A vertical line from (6, 3) to (11, 3)
    The area inside this gray rectangle is not filled, except for the original colored squares.

