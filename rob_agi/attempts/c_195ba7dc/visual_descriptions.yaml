example_0:
  input: |
    A 5x13 grid with a distinct vertical red line (color 2) in the 7th column. The rest of the grid is filled with black (0) and orange (7) squares. The orange squares form irregular patterns on both sides of the red line, with more orange on the left side.
  output: |
    A 5x6 grid where the rightmost column corresponds to the area right of the red line in the input. The grid is mostly filled with blue (1), with some black (0) squares scattered throughout. The pattern of blue and black squares roughly corresponds to the orange and black pattern from the left side of the red line in the input.

