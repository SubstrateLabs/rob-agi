    2. A red (2) vertical line at column 8, extending from row 0 to 13.
    3. A red (2) horizontal line at row 3, extending from column 0 to 13.
    4. A red (2) horizontal line at row 9, extending from column 0 to 13.
    The original green crosses are preserved.