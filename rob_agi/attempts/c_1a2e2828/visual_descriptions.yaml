example_0:
  input: |
    A 12x8 grid with several distinct features:
    1. Two vertical red (2) lines on the left side, spanning the full height except for one row.
    2. A single vertical sky blue (8) line on the right side of the center, spanning the full height.
    3. Two horizontal green (3) lines in the middle, each two rows thick.
    4. A single horizontal magenta (6) line in the middle, one row thick.
    5. The rest of the grid is filled with black (0), which can be seen as empty space.
    The overall effect is like a stylized letter "H" with additional vertical lines.
  output: |
    A 1x1 grid containing only magenta (6).

example_1:
  input: |
    An 11x9 grid with these key elements:
    1. Two vertical yellow (4) lines slightly left of center, spanning the full height.
    2. A single vertical sky blue (8) line on the right side, spanning the full height.
    3. Two horizontal green (3) lines near the top, each one row thick.
    4. Two horizontal magenta (6) lines in the middle, each one row thick.
    5. The rest of the grid is black (0), representing empty space.
    The layout resembles a stylized double-door or window frame.
  output: |
    A 1x1 grid containing only sky blue (8).

example_2:
