example_0:
  input: |
    A 3x10 grid with a distinct pattern in the first 3 columns. The top row shows a sky-red-sky pattern (8-2-8). The second and third rows have an identical blue-sky-blue pattern (1-8-1). The rest of the grid (columns 4-10) is filled with black (0), which can be interpreted as empty space.
  output: |
    The 3x10 grid maintains the pattern from the first 3 columns but extends it across the entire width. The top row now repeats the sky-red-sky pattern (8-2-8) for the full 10 columns. The second and third rows similarly extend their blue-sky-blue pattern (1-8-1) across all 10 columns. The previously empty black space is now filled with the extended pattern.

example_1:
  input: |
    A 4x12 grid with a distinct pattern in the first 3 columns. The first and third rows show a green-red-green pattern (3-2-3). The second row has a blue-red-blue pattern (1-2-1). The fourth row has a blue-green-blue pattern (1-3-1). The rest of the grid (columns 4-12) is filled with black (0), representing empty space.
  output: |
    The 4x12 grid extends the pattern from the first 3 columns across the entire width. The first and third rows now repeat the green-red-green pattern (3-2-3) for 11 columns, ending with a final green. The second row extends its blue-red-blue pattern (1-2-1) similarly. The fourth row extends its blue-green-blue pattern (1-3-1) across all 12 columns. The previously empty black space is now filled with the extended pattern.

example_2:
  input: |
    A 3x14 grid with a distinct pattern in the first 4 columns. The pattern is somewhat more complex than the previous examples. All rows start and end with red (2). The first row has a green-sky-red sequence (3-8-2) after the initial red. The second row has a sky-sky-red sequence (8-8-2) after the initial red. The third row has a sky-green-red sequence (8-3-2) after the initial red. The rest of the grid (columns 5-14) is filled with black (0), representing empty space.
  output: |
    The 3x14 grid extends the pattern from the first 4 columns across the entire width. Each row now repeats its unique 4-column pattern until it reaches the 14th column. The first row repeats the red-green-sky-red sequence (2-3-8-2) three times, ending with a final red (2). The second row repeats the red-sky-sky-red sequence (2-8-8-2) three times, also ending with a red (2). The third row repeats the red-sky-green-red sequence (2-8-3-2) three times, ending with a red (2). The previously empty black space is now filled with the extended pattern.

