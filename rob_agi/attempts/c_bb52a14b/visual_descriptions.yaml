example_0:
  input: |
    A 22x22 grid predominantly filled with black (0) squares. Scattered blue (1) and sky (8) squares appear throughout. The key feature is a unique 3x3 pattern in the center-left area:
    [1, 1, 1]
    [1, 8, 1]
    [1, 4, 1]
    This pattern is the only instance of yellow (4) in the entire grid, making it highly distinctive.

  output: |
    The grid remains largely unchanged, with one crucial modification:
    1. The original 3x3 pattern in the center-left area is preserved.
    2. An exact replica of this pattern appears in the bottom-right corner:
    [1, 1, 1]
    [1, 8, 1]
    [1, 4, 1]
    This replication maintains all existing non-black colors in the target area.

example_1:
  input: |
    A 22x22 grid with a mix of black (0), blue (1), and sky (8) squares. The focal point is a distinctive 3x3 pattern in the center:
    [8, 1, 8]
    [1, 4, 1]
    [8, 1, 8]
    This is the only occurrence of yellow (4) in the grid, surrounded symmetrically by blue (1) and sky (8).

  output: |
    The grid shows two key changes while preserving the original structure:
    1. The central 3x3 pattern remains intact.
    2. An exact copy of the 3x3 pattern is added in the top-right quadrant:
    [8, 1, 8]
    [1, 4, 1]
    [8, 1, 8]
    This replication respects existing non-black colors, integrating seamlessly with surrounding blue (1) and sky (8) squares.

example_2:
  input: |
    A 22x22 grid dominated by black (0) squares, interspersed with blue (1) and sky (8). The standout feature is a unique 3x3 pattern in the top-left quadrant:
    [8, 4, 8]
    [4, 4, 4]
    [8, 4, 8]
    This cross-shaped yellow (4) pattern with sky (8) corners is the only instance of yellow in the grid.

  output: |
    The grid undergoes three significant changes while maintaining its overall structure:
    1. The original 3x3 pattern in the top-left quadrant is preserved.
    2. Two exact replicas of the pattern are added:
       - One in the center-right area
       - Another in the bottom-left quadrant
    Both new patterns maintain the exact structure:
    [8, 4, 8]
    [4, 4, 4]
    [8, 4, 8]
    These replications respect all existing non-black colors in their respective areas.

test_case_0:
