example_0:
  input: |
    A 16x15 grid with mostly black (0) space. Three distinct colored regions:
    1. Yellow (4): Horizontal line of 5 squares in row 4, columns 7-11.
    2. Sky blue (8): Horizontal line of 4 squares in row 7, columns 1-4.
    3. Green (3): Horizontal line of 3 squares in row 12, columns 8-10.
    Gray (5) base: Entire bottom row (row 16).
    Key observations: Colors are isolated, not touching each other or the gray base.
  output: |
    16x15 grid with expanded colored regions:
    1. Yellow (4): 5x8 rectangle, rows 4-11, columns 7-11. Expanded downwards.
    2. Sky blue (8): 4x8 rectangle, rows 7-14, columns 1-4. Expanded downwards to gray base.
    3. Green (3): 3x4 rectangle, rows 12-15, columns 8-10. Expanded downwards.
    Gray (5) base unchanged. Colored regions don't overlap. Rest is black (0).
    Key expansions: Vertical first, then horizontal within vertical limits.

example_1:
  input: |
    16x17 grid, mostly black (0). Four distinct colored regions:
    1. Red (2): Two squares in column 12, rows 2-3.
    2. Green (3): Vertical line of 4 squares in column 7, rows 5-8.
    3. Orange (7): Vertical line of 4 squares in column 3, rows 8-11.
    4. Gray (5): Entire rightmost column (column 17).
    Key observations: Colors don't touch. Gray forms a vertical border.
  output: |
    16x17 grid with expanded colored regions:
    1. Red (2): 2x5 rectangle, rows 2-3, columns 12-16. Expanded right to gray border.
    2. Green (3): 10x7 rectangle, rows 1-10, columns 7-13. Expanded in all directions, mostly down and right.
    3. Orange (7): 7x11 rectangle, rows 5-15, columns 1-7. Expanded in all directions, mostly down and right.
    Gray (5) border unchanged. Colored regions don't overlap. Rest is black (0).
    Key expansions: Vertical first, then horizontal. Top-to-bottom priority.

example_2:
  input: |
    17x17 grid, mostly black (0). Four distinct colored regions:
    1. Gray (5): Entire leftmost column (column 1).
    2. Green (3): Vertical line of 6 squares in column 10, rows 2-7.
    3. Magenta (6): Vertical line of 9 squares in column 14, rows 5-13.
    4. Red (2): Two squares in column 7, rows 11-12.
    Key observations: Colors don't touch. Gray forms a vertical border.
  output: |
    17x17 grid with expanded colored regions:
    1. Gray (5): Unchanged, still entire leftmost column.
    2. Green (3): 9x10 rectangle, rows 1-9, columns 2-11. Expanded left to gray, down, and right.
    3. Magenta (6): 9x6 rectangle, rows 5-13, columns 12-17. Expanded left and slightly down.
    4. Red (2): 2x6 rectangle, rows 11-12, columns 2-7. Expanded left to gray, slightly down.
    Colored regions don't overlap. Rest is black (0).
    Key expansions: Vertical first, then horizontal within vertical limits. Top-to-bottom, left-to-right priority.

