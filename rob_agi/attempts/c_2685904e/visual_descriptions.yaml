example_0:
  input: |
    10x10 grid. Key features:
    1. Top-left: 3x1 sky blue (8) rectangle
    2. Row 7: Full gray (5) line
    3. Row 9: Diverse color sequence (8, 6, 4, 3, 4, 7, 3, 8, 3, 7)
    4. All other cells: Black (0)
    Note: Row 9 has three green (3) cells, which is the least frequent non-black color.
  output: |
    Changes from input:
    1. Three green (3) vertical lines added, extending from row 4 to the gray line (row 7)
    2. Green lines positioned in columns 4, 7, and 9, matching green cells in row 9
    3. All other features (sky blue rectangle, gray line, row 9 sequence) unchanged

example_1:
  input: |
    10x10 grid. Key features:
    1. Top-left: Single sky blue (8) square
    2. Row 7: Full gray (5) line
    3. Row 9: Color sequence (6, 6, 4, 6, 2, 1, 9, 2, 9, 4)
    4. All other cells: Black (0)
    Note: Blue (1) appears once in row 9, the least frequent non-black color.
  output: |
    Changes from input:
    1. Single blue (1) square added in row 6, column 6, directly above the gray line
    2. Blue square corresponds to the single blue cell in row 9
    3. All other features remain unchanged

example_2:
  input: |
    10x10 grid. Key features:
    1. Top-left: 3x1 sky blue (8) rectangle
    2. Row 7: Full gray (5) line
    3. Row 9: Color sequence (4, 1, 4, 4, 6, 3, 1, 6, 3, 6)
    4. All other cells: Black (0)
    Note: Yellow (4) and magenta (6) each appear 3 times in row 9, more than other colors.
  output: |
    Changes from input:
    1. Yellow (4) vertical lines added in columns 1-3, from row 4 to gray line
    2. Magenta (6) vertical lines added in columns 5, 8, and 10, from row 4 to gray line
    3. Lines correspond to yellow and magenta positions in row 9
    4. All other features unchanged

example_3:
  input: |
    10x10 grid. Key features:
    1. Top-left: 2x1 sky blue (8) rectangle
    2. Row 7: Full gray (5) line
    3. Row 9: Color sequence (2, 3, 3, 2, 3, 1, 1, 3, 1, 1)
    4. All other cells: Black (0)
    Note: Red (2) appears twice in row 9, less frequent than green (3) and blue (1).
  output: |
    Changes from input:
    1. Two red (2) vertical lines added, each 2 cells tall
    2. Red lines in columns 1 and 4, from row 5 to gray line
    3. Lines correspond to red positions in row 9
    4. All other features unchanged

example_4:
  input: |
    10x10 grid. Key features:
    1. Top-left: 4x1 sky blue (8) rectangle
    2. Row 7: Full gray (5) line
    3. Row 9: Alternating red and blue pattern (2, 1, 2, 1, 2, 1, 1, 2, 2, 2)
    4. All other cells: Black (0)
    Note: Blue (1) appears 4 times in row 9, less frequent than red (2).
  output: |
    Changes from input:
    1. Blue (1) vertical lines added in columns 2, 4, 6, and 7
    2. Blue lines extend from row 3 to gray line
    3. Lines correspond to blue positions in row 9
    4. All other features unchanged

example_5:
  input: |
    10x10 grid. Key features:
    1. Top-left: Single sky blue (8) square
    2. Row 7: Full gray (5) line
    3. Row 9: Mostly blue sequence with exceptions (1, 3, 1, 1, 1, 1, 4, 1, 1, 1)
    4. All other cells: Black (0)
    Note: Green (3) and yellow (4) each appear once in row 9, least frequent non-black colors.
  output: |
    Changes from input:
    1. Green (3) square added in row 6, column 2
    2. Yellow (4) square added in row 6, column 7
    3. Added squares correspond to green and yellow positions in row 9
    4. All other features unchanged

