example_0:
  input: |
    A 20x10 grid mostly filled with black (0). There are three sky-colored (8) squares scattered across the grid:
    1. In the top-left quadrant at position (1, 3)
    2. In the top-right quadrant at position (2, 16)
    3. Near the bottom-center at position (8, 10)
    These sky-colored squares appear as isolated "dots" in the black background.
  output: |
    A 20x10 grid with a rectangular blue (1) outline connecting the three sky-colored (8) squares from the input. The outline forms a shape resembling an elongated, tilted rectangle:
    - The top edge runs from (1, 3) to (2, 16)
    - The right edge runs from (2, 16) to (8, 10)
    - The bottom edge runs from (8, 10) to (1, 3)
    - The left edge runs from (1, 3) to (8, 10)
    The sky-colored squares remain in their original positions, now incorporated into the blue outline. The area inside and outside the blue rectangle remains black (0).

example_1:
  input: |
    A 12x8 grid mostly filled with black (0). There are three sky-colored (8) squares forming a triangle:
    1. Near the top-left at position (1, 3)
    2. Near the top-right at position (3, 9)
    3. Near the bottom-left at position (6, 2)
    These sky-colored squares appear as isolated "dots" in the black background.
  output: |
    A 12x8 grid with a blue (1) outline connecting the three sky-colored (8) squares from the input, forming a triangle:
    - The top edge runs from (1, 3) to (3, 9)
    - The right edge runs from (3, 9) to (6, 2)
    - The left edge runs from (6, 2) back to (1, 3)
    The sky-colored squares remain in their original positions, now incorporated into the blue outline. The area inside and outside the blue triangle remains black (0).

example_2:
  input: |
    A 13x11 grid mostly filled with black (0). There are three sky-colored (8) squares forming a right-angled triangle:
    1. Near the top-right at position (1, 8)
    2. Near the bottom-left at position (6, 2)
    3. Near the bottom-right at position (9, 10)
    These sky-colored squares appear as isolated "dots" in the black background.
  output: |
    A 13x11 grid with a blue (1) outline connecting the three sky-colored (8) squares from the input, forming a right-angled triangle:
    - The top edge runs from (1, 8) to (9, 10)
    - The right edge runs from (9, 10) to (6, 2)
    - The left edge runs from (6, 2) back to (1, 8)
    The sky-colored squares remain in their original positions, now incorporated into the blue outline. The area inside and outside the blue triangle remains black (0).