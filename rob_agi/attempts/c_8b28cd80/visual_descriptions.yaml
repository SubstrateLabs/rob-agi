example_0:
  input: |
    A 3x3 grid with a single yellow (4) square in the center. The rest of the grid is black (0).
  output: |
    A 9x9 grid with a yellow (4) border around the entire grid. Inside this border is a 7-segment display style number "0" drawn in yellow (4). The segments of the "0" are thick, taking up 2 squares in width. The interior and exterior of the "0" are filled with black (0).

example_1:
  input: |
    A 3x3 grid with a single gray (5) square in the top-left corner. The rest of the grid is black (0).
  output: |
    A 9x9 grid with a gray (5) border on the left, top, and right sides. The bottom border is incomplete, with only the corners filled. Inside this border is a 7-segment display style number "2" drawn in gray (5). The segments of the "2" are thick, taking up 2 squares in width. The interior and exterior of the "2" are filled with black (0). There are additional gray (5) lines extending from the right side of the "2" to the right border.

