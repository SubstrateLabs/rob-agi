example_0:
  input: |
    The grid is 17x7. There are several red (2) 2x2 squares scattered across the grid. These squares are positioned at various locations: top-left corner, top-right corner, middle-left, middle-right, bottom-right, and a few in between. The rest of the grid is filled with black (0), which can be considered empty space.
  output: |
    The grid maintains its 17x7 size. Most of the red (2) 2x2 squares have been transformed into sky blue (8) 2x2 squares. Specifically, all the squares touching the edges of the grid (top, left, right) have changed to sky blue. The red squares not touching any edge (in the middle of the grid) have remained red. The black (0) spaces remain unchanged.

