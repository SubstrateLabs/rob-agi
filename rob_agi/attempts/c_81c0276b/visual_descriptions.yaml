example_0:
  input: |
    The input grid is 19x13 in size. It consists of a series of rectangular shapes separated by magenta (6) lines. The magenta lines form a cross-like pattern, dividing the grid into 9 rectangular sections. Each section contains a 2x2 square of a specific color, surrounded by black (0). The colors of these squares are:
    - Top left: Yellow (4)
    - Top center: Magenta (6)
    - Top right: Sky (8)
    - Middle left: Sky (8)
    - Middle center: Magenta (6)
    - Middle right: Green (3)
    - Bottom left: Magenta (6)
    - Bottom center: Sky (8)
    - Bottom right: Yellow (4)
    The magenta lines forming the cross pattern are one unit thick, creating a grid-like structure.
  output: |
    The output grid is much smaller, 3x3 in size. It contains three colored squares arranged diagonally from top-left to bottom-right:
    - Top-left: Green (3)
    - Center: Yellow (4)
    - Bottom-right: Sky (8)
    The remaining cells are black (0).

