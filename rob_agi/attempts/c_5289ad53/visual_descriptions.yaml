    - Two green (3) horizontal lines: one in the middle spanning 5 squares, and one near the middle spanning 6 squares
    - One red (2) horizontal line at the bottom right, spanning 5 squares
  output: |
    A small 2x3 grid. The top row has green (3) twice, followed by red (2). The bottom row is all red (2).

