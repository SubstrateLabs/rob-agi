example_0:
  input: |
    A 3x3 grid with a pattern of orange (7) and gray (5) squares. The corners are orange, while the center and middle edges are gray, forming a cross-like pattern.
  output: |
    A 3x12 grid that appears to be an expanded version of the input. The pattern is repeated four times horizontally, with each repetition separated by a column that mirrors the leftmost column of the original pattern. The result is a symmetrical pattern that alternates between the original 3x3 grid and its mirror image.

example_1:
  input: |
    A 3x3 grid with sky blue (8) dominating the top row and right column. The bottom left corner is orange (7), and there are two gray (5) squares in the middle of the left side.
  output: |
    A 3x12 grid that expands the input pattern. The top row and rightmost column maintain the sky blue (8) color throughout. The orange (7) and gray (5) pattern on the left is mirrored and repeated four times across the bottom two rows, creating a symmetrical design.

example_2:
  input: |
    A 3x3 grid with a sky blue (8) top row, gray (5) middle row, and a bottom row that transitions from gray (5) to orange (7) to sky blue (8) from left to right.
  output: |
    A 3x12 grid that expands the input. The top row remains entirely sky blue (8). The middle row alternates between gray (5) and orange (7) in a symmetrical pattern. The bottom row mirrors this alternation but with sky blue (8) replacing the gray (5) squares.

example_3:
  input: |
    A 3x3 grid with sky blue (8) dominating the top row and right column. The bottom left corner is orange (7), and there are two gray (5) squares in the middle of the left side.
  output: |
    A 3x12 grid that expands the input pattern. The top row alternates between sky blue (8) and orange (7) in a symmetrical pattern. The middle row alternates between gray (5) and orange (7). The bottom row mirrors the top row but with sky blue (8) and orange (7) positions swapped.