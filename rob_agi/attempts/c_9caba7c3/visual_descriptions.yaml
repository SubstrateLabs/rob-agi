example_0:
  input: |
    A 19x19 grid with gray (5) as the dominant color. Black (0) squares are scattered throughout, creating barriers. Red (2) squares appear in small clusters or individually, mostly in the lower half. The upper-left quadrant contains fewer red squares compared to other areas. Gray squares form the background and connect most of the grid.
  output: |
    The 19x19 structure and all black (0) squares remain unchanged. Key transformations:
    1. Red (2) squares in the upper-left quadrant (roughly 9x9 area) stay red.
    2. Red squares outside the upper-left quadrant change to yellow (4).
    3. Orange (7) color propagates from yellow squares, moving right and down.
    4. Orange replaces gray and other colors, but stops at black squares.
    5. Orange forms continuous paths or regions, sometimes "jumping" over black squares.
    6. Gray areas unaffected by orange propagation remain unchanged.

