example_0:
  input: |
    The grid is 14x14 and divided into three rows and three columns by sky blue (8) lines. In the top-left section, there's a 2x2 red (2) square. In the top-middle section, there's a larger gray (5) shape that looks like an inverted 'L'. The bottom-left section has a 2x2 green (3) square. The bottom-middle section has a 2x2 blue (1) square. All other cells are black (0).
  output: |
    The grid maintains its 14x14 size and the sky blue (8) dividing lines. Each non-empty section now contains a 4x4 pattern of its original color:
    - Top-left: A red (2) pattern that looks like a plus sign or cross.
    - Top-middle: The same red (2) pattern, repeated twice horizontally.
    - Top-right: The red (2) pattern again.
    - Middle row: Three green (3) patterns, each looking like a plus sign or cross.
    - Bottom row: Three blue (1) patterns, each looking like a plus sign or cross.
    The patterns are aligned with the top-left corner of each section.

example_1:
  input: |
    The grid is 19x19 and divided into four rows and four columns by green (3) lines. In the top-left section, there's a 2x2 yellow (4) square. In the second row, leftmost section, there's a 2x2 red (2) square. In the third row, leftmost section, there's a 2x2 sky blue (8) square. In the bottom-left section, there's a 2x2 blue (1) square. In the bottom row, second column, there's a magenta (6) shape that looks like a backwards 'L'. All other cells are black (0).
  output: |
    The grid maintains its 19x19 size and the green (3) dividing lines. Each non-empty section now contains a 4x4 pattern of its original color:
    - Top row: Four yellow (4) patterns, each looking like a plus sign or cross.
    - Second row: Four red (2) patterns, each looking like a plus sign or cross.
    - Third row: Four sky blue (8) patterns, each looking like a plus sign or cross.
    - Bottom row: Four blue (1) patterns, each looking like a plus sign or cross.
    The patterns are aligned with the top-left corner of each section. The magenta (6) shape in the original input is not represented in the output.