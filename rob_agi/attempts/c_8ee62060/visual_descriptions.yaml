example_0:
  input: |
    12x12 grid with a diagonal pattern from top-left to bottom-right.
    Pattern: sky blue (8) square followed by two red (2) squares.
    Each set (8,2,2) is offset by 2 rows down and 2 columns right from the previous.
    First set starts at (0,0). Last set ends at (10,10).
    All other cells are black (0).
  output: |
    12x12 grid with the same diagonal pattern, but from bottom-left to top-right.
    Pattern: sky blue (8) square followed by two red (2) squares.
    Each set (8,2,2) is offset by 2 rows up and 2 columns right from the previous.
    First set starts at (11,0). Last set ends at (1,10).
    All other cells are black (0).

example_1:
  input: |
    12x12 grid with a diagonal pattern from top-right to bottom-left.
    Pattern: two red (2) squares followed by one green (3) square.
    Each set (2,2,3) is offset by 2 rows down and 2 columns left from the previous.
    First set starts at (0,9). Last set ends at (10,1).
    All other cells are black (0).
  output: |
    12x12 grid with the same diagonal pattern, but from bottom-left to top-right.
    Pattern: two red (2) squares followed by one green (3) square.
    Each set (2,2,3) is offset by 2 rows up and 2 columns right from the previous.
    First set starts at (11,0). Last set ends at (1,10).
    All other cells are black (0).

example_2:
  input: |
    10x10 grid with a diagonal pattern from top-left to bottom-right.
    Pattern: one red (2) square followed by one blue (1) square.
    Each pair (2,1) is offset by 2 rows down and 2 columns right from the previous.
    First pair starts at (0,0). Last pair ends at (8,8).
    All other cells are black (0).
  output: |
    10x10 grid with the same diagonal pattern, but from bottom-left to top-right.
    Pattern: one red (2) square followed by one blue (1) square.
    Each pair (2,1) is offset by 2 rows up and 2 columns right from the previous.
    First pair starts at (9,0). Last pair ends at (1,8).
    All other cells are black (0).
