example_0:
  input: |
    A 4x19 grid with four distinct regions separated by green (3) vertical lines. From left to right:
    1. A sky blue (8) region with some black (0) spaces, forming an irregular shape.
    2. A gray (5) region, mostly solid but with some black spaces.
    3. A brown (9) region with some black spaces, forming another irregular shape.
    4. A yellow (4) region, mostly solid in the top and bottom rows, with black spaces in the middle rows.
  output: |
    A 4x4 grid where each column seems to represent a condensed version of the input regions:
    1. Mostly brown (9) with one sky blue (8) square.
    2. A mix of brown (9), sky blue (8), and gray (5).
    3. A mix of yellow (4) and sky blue (8).
    4. Mostly yellow (4) with one brown (9) square.

