example_0:
  input: |
    A 19x4 grid with four distinct sections separated by green (3) columns. From left to right:
    1. Sky blue (8) dominant, with some black (0) spaces.
    2. Gray (5) dominant, with some black (0) spaces.
    3. Brown (9) dominant, with some black (0) spaces.
    4. Yellow (4) dominant, with some black (0) spaces.
    Each section has a unique pattern of its dominant color and black.
  output: |
    A 4x4 grid showcasing a mix of colors from the input:
    - Brown (9) is most prominent, forming a rough L-shape.
    - Sky blue (8) appears in two corners.
    - Yellow (4) forms a diagonal line.
    - Gray (5) appears once.
    The pattern seems to balance the colors from the input sections.

example_1:
