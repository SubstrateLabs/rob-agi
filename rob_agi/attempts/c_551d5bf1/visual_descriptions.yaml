example_0:
  input: |
    Grid size: 28x24
    Blue (1) structures:
    1. Top-left: 7x5 rectangle at (1,1)
    2. Top-right: 7x5 rectangle at (1,19)
    3. Center: 9x7 rectangle at (8,12)
    4. Bottom-left: 6x6 rectangle at (15,5)
    5. Bottom-right: 6x6 rectangle at (19,20)
    All structures are disconnected and surrounded by black (0) space.
    No structures touch the grid edges.
  output: |
    Grid size: 28x24
    Blue (1) structures:
    - All original structures maintain their positions and outer borders.
    Sky blue (8) network:
    1. Connects all blue structures with minimal paths.
    2. Fills the interior of all blue structures.
    3. Extends to the right edge (column 27) and bottom edge (row 23).
    4. Creates a single connected component that includes all blue structures.
    5. Fills all enclosed areas within the network.
    Key observations:
    - The network uses horizontal and vertical paths, no diagonals.
    - It forms a tree-like structure with no cycles.
    - The network is optimized to use the minimum number of sky blue cells.

example_1:
  input: |
    Grid size: 25x24
    Blue (1) structures:
    1. Top-left: 7x6 rectangle at (1,1)
    2. Top-right: 7x6 rectangle at (1,17)
    3. Center: 7x6 rectangle at (9,10)
    4. Bottom-left: 9x6 rectangle at (17,2) with 3x1 extension on top at (16,5)
    5. Bottom-right: 6x4 rectangle at (18,17)
    All structures are disconnected and surrounded by black (0) space.
    The bottom-left structure touches the left edge.
  output: |
    Grid size: 25x24
    Blue (1) structures:
    - All original structures maintain their positions and outer borders.
    Sky blue (8) network:
    1. Connects all blue structures with minimal paths.
    2. Fills the interior of all blue structures.
    3. Extends to the right edge (column 23) and bottom edge (row 24).
    4. Creates a single connected component that includes all blue structures.
    5. Fills all enclosed areas within the network.
    Key observations:
    - The network uses horizontal and vertical paths, no diagonals.
    - It forms a tree-like structure with no cycles.
    - The bottom-left structure is connected to the network and the bottom edge.
    - The network is optimized to use the minimum number of sky blue cells.
