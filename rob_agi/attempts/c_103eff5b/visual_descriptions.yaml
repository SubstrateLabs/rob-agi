    - A 6x3 rectangle in rows 10-12, columns 1-6
    - A 6x3 rectangle in rows 13-15, columns 4-9
    - A 3x3 square in rows 16-18, columns 1-3
    - A 3x3 square in rows 16-18, columns 7-9
    The rest of the grid is filled with black (0) squares.
  output: |
    The output grid maintains the same 22x12 size and keeps the small colored pattern in the top-left corner unchanged.
    
