example_0:
  input: |
    A 21x21 grid with a clear pattern of cells separated by lines. The majority of the grid (background) is filled with gray (5) squares. The cell structure is defined by green (3) lines:
    - Vertical green lines: 3 lines at columns 3, 9, and 19
    - Horizontal green lines: 2 lines at rows 11 and 14
    These lines create a grid of rectangular cells of varying sizes. The lines are single-pixel wide and continuous from edge to edge.
  output: |
    A 3x4 grid extracted from the input, consisting entirely of gray (5) squares. This represents the content of a single cell from the input grid, excluding the green boundary lines.

example_1:
  input: |
    A 27x27 grid with a similar cell structure to example_0, but using different colors and dimensions. The background is gray (5), with sky blue (8) lines defining the cells:
    - Vertical sky blue lines: 4 lines at columns 7, 17, 20, and 26
    - Horizontal sky blue lines: 4 lines at rows 10, 15, 20, and 25
    The lines create a more complex grid pattern with cells of various sizes. All lines are single-pixel wide and span the entire grid.
  output: |
    A 5x5 grid of gray (5) squares, representing the largest cell extracted from the input grid. The sky blue boundary lines are not included in this extraction.

example_2:
  input: |
    A 10x10 grid with a different color scheme and a more intricate pattern. The background is blue (1), with yellow (4) lines forming the cell boundaries:
    - Vertical yellow lines: 3 lines at columns 1, 3, and 9, extending the full height of the grid
    - Horizontal yellow line: 1 line at row 6, spanning the entire width
    Unlike previous examples, the vertical lines intersect with the horizontal line, creating a more complex cell structure.
  output: |
    A 2x3 grid of blue (1) squares. This represents one of the complete cells from the input grid, bounded by but not including the yellow lines. The cell extracted is likely from the upper-right section of the input grid.
