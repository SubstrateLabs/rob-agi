example_0:
  input: |
    The grid is 13x10. There are three distinct shapes visible:
    1. In the top-left, a 3x3 square shape made of sky blue (8) and yellow (4) colors. The yellow forms an inverted L-shape within the square.
    2. In the middle-right, a 3x3 square shape made of green (3) and red (2) colors. The red forms a diagonal line from top-right to bottom-left within the square.
    3. In the bottom-left, a T-shaped object made of green (3) with two magenta (6) squares in the middle of the top row.
    The rest of the grid is filled with black (0), which can be considered empty space.
  output: |
    The grid maintains its 13x10 size. The three shapes are still present but have been transformed:
    1. The top-left square has been rotated 180 degrees. The yellow inverted L-shape is now in the opposite orientation.
    2. The middle-right square has been flipped horizontally. The red diagonal now runs from top-left to bottom-right.
    3. The bottom-left T-shape has been inverted. The two magenta squares are now at the bottom of the T, and the green forms an inverted U-shape above them.
    The black (empty) spaces remain unchanged.

example_1:
