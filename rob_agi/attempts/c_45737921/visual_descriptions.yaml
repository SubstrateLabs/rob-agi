       - Blue fills the remaining cells
    2. Top-right (3x3): Green (3) and red (2)
       - Red forms a plus sign
       - Green fills the remaining cells
    3. Middle-left (3x3): Blue (1) and magenta (6)
       - Magenta forms an inverted L-shape in the top-right corner
       - Blue fills the remaining cells
    4. Bottom-right (3x3): Yellow (4) and gray (5)
       - Yellow forms an L-shape in the top-left corner
       - Gray fills the remaining cells
    Background: Black (0)

  output: |
    Grid size: 12x12 (unchanged)
    Four transformed two-color regions:
    1. Top-left (3x3): Blue (1) and sky blue (8)
       - Colors swapped within the region
       - Sky blue cross is now inverted
       - Blue fills the remaining cells
    2. Top-right (3x3): Green (3) and red (2)
       - Colors swapped within the region
       - Red plus sign remains visually unchanged due to symmetry
       - Green fills the remaining cells
    3. Middle-left (3x3): Blue (1) and magenta (6)
       - Colors swapped within the region
       - Magenta now forms an L-shape in the bottom-left corner
       - Blue fills the remaining cells
    4. Bottom-right (3x3): Yellow (4) and gray (5)
       - Colors swapped within the region
       - Yellow now forms an L-shape in the bottom-right corner
       - Gray fills the remaining cells
    Background: Black (0) (unchanged)

