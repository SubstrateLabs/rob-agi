example_0:
  input: |
    Grid size: 13x10
    Three distinct two-color regions:
    1. Top-left (3x3): Sky blue (8) and yellow (4)
       - Yellow forms an inverted L-shape
       - Sky blue fills the remaining cells
    2. Middle-right (3x3): Green (3) and red (2)
       - Red forms a diagonal line from top-right to bottom-left
       - Green fills the remaining cells
    3. Bottom-left (T-shape): Green (3) and magenta (6)
       - Two magenta squares in the middle of the top row
       - Green forms a T-shape around the magenta squares
    Background: Black (0)

  output: |
    Grid size: 13x10 (unchanged)
    Three transformed two-color regions:
    1. Top-left (3x3): Sky blue (8) and yellow (4)
       - Colors swapped within the region
       - Yellow now forms an L-shape in the bottom-right
       - Sky blue fills the remaining cells
    2. Middle-right (3x3): Green (3) and red (2)
       - Colors swapped within the region
       - Red diagonal now runs from top-left to bottom-right
       - Green fills the remaining cells
    3. Bottom-left (T-shape): Green (3) and magenta (6)
       - Colors swapped within the region
       - Two magenta squares now at the bottom of the T
       - Green forms an inverted U-shape above the magenta squares
    Background: Black (0) (unchanged)

