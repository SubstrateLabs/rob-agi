example_2:
  input: |
    The grid is 12x12. There are four distinct shapes visible:
    1. In the top-left, a 3x3 square shape made of blue (1) and sky blue (8) colors. The sky blue forms a cross shape within the square.
    2. In the top-right, a 3x3 square shape made of green (3) and red (2) colors. The red forms a plus sign within the square.
    3. In the middle-left, a 3x3 square shape made of blue (1) and magenta (6) colors. The magenta forms an inverted L-shape in the top-right corner of the square.
    4. In the bottom-right, a 3x3 square shape made of yellow (4) and gray (5) colors. The yellow forms an L-shape in the top-left corner of the square.
    The rest of the grid is filled with black (0), which can be considered empty space.
  output: |
    The grid maintains its 12x12 size. All four shapes have been transformed:
    1. The top-left square has been rotated 180 degrees. The sky blue cross is now inverted.
    2. The top-right square has been rotated 180 degrees. The red plus sign remains unchanged due to its symmetry.
    3. The middle-left square has been rotated 180 degrees. The magenta inverted L-shape is now in the bottom-left corner of the square.
    4. The bottom-right square has been rotated 180 degrees. The yellow L-shape is now in the bottom-right corner of the square.
    The black (empty) spaces remain unchanged.

