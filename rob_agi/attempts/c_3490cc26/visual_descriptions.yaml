  output: |
    The same 28x28 grid, but with orange rectangles connecting all the sky blue squares. The connections form a complex network, creating a shape reminiscent of a tree or a circuit diagram. The red square remains unchanged. The orange lines connect all sky blue squares, forming vertical and horizontal paths between them.

