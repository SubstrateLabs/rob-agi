example_0:
  input: |
    An 18x26 grid with mostly black (empty) space. There are four 2x2 sky blue squares positioned at different locations: one near the top left, two in the middle row (left and right sides), and one near the bottom right. There's also a single 2x2 red square near the bottom left.
  output: |
    The same 18x26 grid, but with orange rectangles connecting the sky blue squares. The top left square is connected to both middle squares with vertical orange lines. The bottom right square is connected to both middle squares with horizontal orange lines. The red square remains unchanged. The orange lines form a rough 'H' shape connecting all the sky blue squares.

