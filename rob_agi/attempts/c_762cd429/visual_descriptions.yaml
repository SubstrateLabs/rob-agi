example_0:
  input: |
    A 10x14 grid predominantly black (0). In the bottom-left corner, there's a crucial 2x2 pattern:
    - Top row: red (2) | green (3)
    - Bottom row: blue (1) | blue (1)
    This 2x2 pattern is the key to understanding the transformation.
  output: |
    A 10x14 grid with a transformed pattern:
    1. Bottom half (5 rows x 14 columns): Solid blue (1) rectangle.
    2. Top-right quadrant (5 rows x 8 columns): Checkerboard pattern of red (2) and green (3).
    3. Remaining area: Unchanged, black (0).
    Note: The 2x2 input pattern expands to fill 2/3 of the width and 1/2 of the height.

