example_0:
  input: |
    The input grid shows a pattern of sky blue (8) shapes on a black (0) background. There are three distinct sky blue shapes:
    1. A large rectangular shape in the top right corner, with a small black square inside it.
    2. A smaller rectangular shape in the middle left, with a black square in its center.
    3. A T-shaped structure at the bottom, consisting of a horizontal bar with three vertical extensions downward.
  output: |
    The output grid maintains the same overall structure as the input, but with color changes:
    1. The large rectangular shape in the top right is now blue (1).
    2. The smaller rectangular shape in the middle left is also blue (1).
    3. The T-shaped structure at the bottom is now green (3).
    The black (0) background and internal black squares remain unchanged.

example_1:
  input: |
    The input grid displays several sky blue (8) shapes on a black (0) background:
    1. A large rectangular shape with internal divisions in the top left quadrant.
    2. A smaller square shape in the middle right.
    3. A large, complex shape in the bottom left, resembling an inverted 'L' with additional extensions.
    4. A rectangular shape with internal divisions in the bottom right.
  output: |
    The output grid preserves the shapes from the input but assigns different colors:
    1. The large rectangular shape in the top left is now red (2).
    2. The smaller square shape in the middle right is now blue (1).
    3. The complex shape in the bottom left is now green (3).
    4. The rectangular shape in the bottom right is now blue (1), matching the middle right shape.
    The black (0) background remains unchanged.

