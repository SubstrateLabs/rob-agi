example_0:
  input: |
    A 30x30 grid with black (0), blue (1), and red (2) squares. Key features:
    1. Four 2x2 red squares:
       - Top-left corners at (3,5), (4,18), (15,10), and (23,20)
    2. Blue dots:
       - Edge dots: (0,18), (10,26), (28,21)
       - Non-edge dots: (4,2), (4,11), (4,14), (4,24), (7,5), (9,18), (10,10), (16,6), (16,20), (23,13)
    3. No blue dots directly adjacent to red squares
    4. Some blue dots form patterns (e.g., four on row 4)
  output: |
    The 30x30 grid after transformation:
    1. All 2x2 red squares remain unchanged
    2. New blue dot placement:
       - Left of leftmost red square in each row: (3,4), (4,17), (15,9), (23,19)
       - Right of rightmost red square in each row: (5,7), (6,20), (17,12), (25,22)
    3. Blue dot retention:
       - Edge dots preserved: (0,18), (10,26), (28,21)
       - All non-edge, isolated blue dots removed
    4. No blue dots added between red squares (none are adjacent in the same row)

example_1:
  input: |
    A 30x30 grid with black (0), blue (1), and red (2) squares. Key features:
    1. Three 2x2 red squares:
       - Top-left corners at (7,5), (16,16), and (23,20)
    2. Blue dots:
       - Edge dots: (2,26), (23,3), (28,24)
       - Non-edge dots: (3,6), (7,16), (8,17), (10,10), (15,11), (16,6), (19,20)
    3. No blue dots directly adjacent to red squares
    4. Two blue dots near each other (7,16) and (8,17)
  output: |
    The 30x30 grid after transformation:
    1. All 2x2 red squares remain unchanged
    2. New blue dot placement:
       - Left of leftmost red square in each row: (7,4), (16,15), (23,19)
       - Right of rightmost red square in each row: (9,7), (18,18), (25,22)
    3. Blue dot retention:
       - Edge dots preserved: (2,26), (23,3), (28,24)
       - All non-edge, isolated blue dots removed
    4. No blue dots added between red squares (none are adjacent in the same row)

example_2:
  input: |
    A 13x10 grid with black (0), blue (1), and red (2) squares. Key features:
    1. Four 2x2 red squares:
       - Top-left corners at (3,1), (3,10), (4,1), and (4,10)
    2. Blue dots:
       - Edge dot: (8,4)
       - Non-edge dots: (3,5), (4,7)
    3. Red squares are adjacent in the same column but not in the same row
  output: |
    The 13x10 grid after transformation:
    1. All 2x2 red squares remain unchanged
    2. New blue dot placement:
       - Between adjacent red squares in the same row: (3,3), (4,9)
    3. Blue dot retention:
       - Edge dot preserved: (8,4)
       - All non-edge, isolated blue dots removed
    4. No blue dots added to the left or right of red squares (they're at the grid edges)

