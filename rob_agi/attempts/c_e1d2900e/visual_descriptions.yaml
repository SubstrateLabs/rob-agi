example_0:
  input: |
    A 30x30 grid mostly filled with black (empty) squares. There are several notable features:
    1. Four 2x2 red squares located at different positions:
       - Top-left corner at (3,5)
       - Top-left corner at (4,18)
       - Top-left corner at (15,10)
       - Top-left corner at (23,20)
    2. Several isolated blue dots scattered across the grid:
       - At (0,18), (4,2), (4,11), (4,14), (4,24), (7,5), (9,18), (10,10), (10,26), (16,6), (16,20), (23,13), (28,21)
  output: |
    The 30x30 grid has been transformed. Key changes:
    1. The four 2x2 red squares remain in their original positions.
    2. Most isolated blue dots have been removed.
    3. New blue dots have been added adjacent to the red squares:
       - For the square at (3,5): blue dots at (3,4) and (5,5)
       - For the square at (4,18): blue dots at (4,17) and (6,18)
       - For the square at (15,10): blue dots at (15,9) and (17,10)
       - For the square at (23,20): blue dots at (23,19) and (25,20)
    4. Blue dots on the edges of the grid have been preserved: (0,18), (10,26), (28,21)

