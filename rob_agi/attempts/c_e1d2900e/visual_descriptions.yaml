example_2:
  input: |
    A 13x10 grid mostly filled with black (empty) squares. Notable features:
    1. Four 2x2 red squares:
       - Top-left corners at (3,1), (3,10), (4,1), and (4,10)
    2. Three isolated blue dots:
       - At (3,5), (4,7), (8,4)
  output: |
    The 13x10 grid has been transformed:
    1. The four 2x2 red squares remain in their original positions.
    2. All isolated blue dots have been removed.
    3. New blue dots have been added adjacent to the red squares:
       - For the squares at (3,1) and (4,1): a blue dot at (3,3)
       - For the squares at (3,10) and (4,10): a blue dot at (4,9)
    4. The blue dot at (8,4) has been preserved as it's on the edge of the grid.

