example_0:
  input: |
    The grid shows two distinct blue (1) regions on a black (0) background. The first region is a 4x4 square in the top-left corner, separated from the edge by a single row/column of black. The second region is a 3x3 square in the top-right corner, also separated from the edge by black. Below these, there's a larger 5x6 rectangular blue region in the bottom-center of the grid, touching the bottom edge.
  output: |
