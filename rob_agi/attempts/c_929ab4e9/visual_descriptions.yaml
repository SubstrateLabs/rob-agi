example_0:
  input: |
    24x24 grid with butterfly/hourglass symmetry. Center: 3x3 red (2) area disrupting pattern. Core: brown (9) cross surrounded by sky blue (8). Corners: magenta (6) blocks. Diagonal lines: orange (7) and yellow (4) connecting corners to center. Perfect horizontal and vertical symmetry except for red center.
  output: |
    Identical to input, but red center replaced. Center now: brown (9) cross surrounded by sky blue (8), matching adjacent pattern. Full horizontal, vertical, and rotational symmetry restored. Pattern continuity maintained in all directions.

example_1:
  input: |
    24x24 grid, complex symmetry. Center: 5x5 red (2) area breaking pattern. Core structure: orange (7) and sky blue (8) cross, encircled by brown (9). Corners: large sky blue (8) blocks. Diagonal lines with alternating colors connect corners to center. Perfect symmetry except for red center.
  output: |
    Same as input, but red center replaced. Center now: orange (7) and sky blue (8) cross encircled by brown (9), matching surrounding pattern. Full horizontal, vertical, and rotational symmetry restored. Color transitions and pattern continuity preserved across entire grid.

example_2:
  input: |
    24x24 grid, circular/flower-like symmetry. Center: 5x5 red (2) area disrupting pattern. Core: brown (9) cross. Surrounding: concentric rings of sky blue (8) and orange (7). Corners: magenta (6) blocks. Curved lines create petal effect from corners to center. Perfect symmetry except for red center.
  output: |
    Identical to input, but red center replaced. Center now: brown (9) cross with concentric sky blue (8) and orange (7) rings, matching adjacent pattern. Full radial and reflectional symmetry restored. Flower-like appearance enhanced with continuous petal structures.

example_3:
  input: |
    24x24 grid, rectangular/frame-like symmetry. Center: 5x5 red (2) area breaking pattern. Outer edge: alternating brown (9) and sky blue (8). Inner frame: thick magenta (6) border. Center area: complex pattern with orange (7), sky blue (8), gray (5). Diagonal lines connect corners to center. Perfect symmetry except for red center.
  output: |
    Same as input, but red center replaced. Center now: complex pattern of orange (7), sky blue (8), gray (5), matching inner area. Full horizontal, vertical, and rotational symmetry restored. Frame structure preserved with continuous color transitions from edge to center.

test_case_0:
  input: |
    24x24 grid, rectangular/frame-like symmetry (similar to example_3). Center: 5x5 red (2) area breaking pattern. Outer edge: alternating brown (9) and sky blue (8). Inner frame: thick magenta (6) border. Center area: complex pattern with orange (7), sky blue (8), gray (5). Diagonal lines connect corners to center. Perfect symmetry except for red center.
  output: |
    Expected output: Identical to input, but red center replaced with complex pattern matching inner area (orange (7), sky blue (8), gray (5)). Full horizontal, vertical, and rotational symmetry should be restored. Frame structure and color transitions from edge to center should be continuous and consistent.
