example_0:
  input: |
    A 9x5 grid with several distinct regions:
    1. Top-left: A red (2) shape resembling an inverted 'L', surrounded by black (0).
    2. Middle: A single yellow (4) horizontal line spanning the entire width.
    3. Bottom-right: A blue (1) shape resembling a backwards 'Z'.
    The rest of the grid is filled with black (0).
  output: |
    A 4x5 grid that appears to be a transformed version of the top part of the input:
    1. A green (3) shape that covers most of the grid, resembling a rectangle with its bottom-right corner missing.
    2. The rest is filled with black (0), mainly in the bottom-right corner.

example_1:
  input: |
    A 9x5 grid with several distinct regions:
    1. Top: A red (2) shape resembling a thick frame or border, with some gaps.
    2. Middle: A single yellow (4) horizontal line spanning the entire width.
    3. Bottom: A blue (1) pattern that looks like scattered pieces, mostly on the left side.
    The rest of the grid is filled with black (0).
  output: |
    A 4x5 grid that seems to be a transformed version of the top part of the input:
    1. A green (3) shape that covers most of the grid, resembling the original red shape but filled in, with two small black (0) spaces.
    2. The rest is filled with black (0), mainly in two small areas.

example_2:
  input: |
    A 9x5 grid with several distinct regions:
    1. Top: A red (2) shape resembling a partial frame or disconnected pieces, mostly on the right and bottom.
    2. Middle: A single yellow (4) horizontal line spanning the entire width.
    3. Bottom: A blue (1) pattern that looks like a partial frame or disconnected pieces, mostly on the left and top.
    The rest of the grid is filled with black (0).
  output: |
    A 4x5 grid that appears to be a transformed version of the top part of the input:
    1. A green (3) shape that covers most of the grid, resembling a filled-in version of the original red shape, with some additions.
    2. The rest is filled with black (0), mainly in three small areas.

example_3:
  input: |
    A 9x5 grid with several distinct regions:
    1. Top: A red (2) shape resembling scattered pieces or a partial frame, mostly on the right side.
    2. Middle: A single yellow (4) horizontal line spanning the entire width.
    3. Bottom: A blue (1) pattern that looks like scattered dots, mostly on the left side.
    The rest of the grid is filled with black (0).
  output: |
    A 4x5 grid that seems to be a transformed version of the top part of the input:
    1. A green (3) shape that covers most of the grid, resembling a filled-in and expanded version of the original red shape.
    2. The rest is filled with black (0), mainly in the top-right and bottom-left corners.