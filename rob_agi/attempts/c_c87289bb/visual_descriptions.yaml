example_0:
  input: |
    A 9x10 grid with mostly black (empty) space. There are three vertical lines of sky blue (8) squares, each one square wide, positioned at columns 1, 5, and 9. These lines extend from the top row to the third row. In the middle of the grid (row 4), there's a horizontal line of three red (2) squares.
  output: |
    The same 9x10 grid, but with significant changes. The three vertical sky blue lines now extend all the way from the top to the bottom of the grid. Additionally, a new vertical sky blue line has appeared, connecting the right end of the red line to the bottom of the grid. This forms a rectangular enclosure around the red line, with the left side open.

example_1:
  input: |
    A 10x12 grid with alternating vertical lines of black (0) and sky blue (8) squares in the top four rows. There are six sky blue lines, each one square wide. The bottom six rows are mostly black, except for a horizontal line of three red (2) squares in the middle of row 5.
  output: |
    The same 10x12 grid, but with changes. The alternating pattern of black and sky blue lines now extends all the way to the bottom of the grid. Additionally, two new vertical sky blue lines have appeared, enclosing the red line on both sides and extending to the bottom of the grid. This forms a complete rectangular enclosure around the red line.

example_2:
  input: |
    A 10x12 grid with three vertical lines of sky blue (8) squares in the top four rows, positioned at columns 1, 5, and 7. There's also a partial fourth line at column 10. In row 5, there are two separate horizontal red (2) lines: one with two squares on the left side, and another with three squares near the center.
  output: |
    The same 10x12 grid, but with changes. All existing sky blue lines now extend to the bottom of the grid. New sky blue lines have appeared, forming rectangular enclosures around both red lines. The left red line is enclosed on three sides (left, right, bottom), while the center red line is fully enclosed.

example_3:
  input: |
    A 10x12 grid with four vertical lines of sky blue (8) squares in the top four rows, positioned at columns 0, 2, 6, and 9. In row 5, there are two separate horizontal red (2) lines: one with two squares on the left side, and another with three squares near the center.
  output: |
    The same 10x12 grid, but with changes. All existing sky blue lines now extend to the bottom of the grid. New sky blue lines have appeared, forming rectangular enclosures around both red lines. Both red lines are now fully enclosed by sky blue squares, creating two distinct "boxes" that extend to the bottom of the grid.