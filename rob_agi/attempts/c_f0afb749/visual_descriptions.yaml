example_0:
  input: |
    A 5x5 grid with mostly black (0) squares. There are three gray (5) squares forming an L-shape: one in the top-right corner, one in the middle-left, and one in the bottom-left. The rest of the grid is black.
  output: |
    A 10x10 grid, double the size of the input. The gray squares from the input have been expanded into 2x2 blocks of gray. A diagonal line of blue (1) squares runs from the top-right to the bottom-left, starting from the middle of the grid. The line is not continuous but appears every other square on the diagonal.

example_1:
  input: |
    A small 2x2 grid with a single red (2) square in the top-left corner. The rest of the squares are black (0).
  output: |
    A 4x4 grid, double the size of the input. The red square has been expanded into a 2x2 block of red in the top-left corner. A diagonal line of two blue (1) squares runs from the bottom-right to the top-left of the right half of the grid.

example_2:
  input: |
    A 6x6 grid with mostly black (0) squares. There are two green (3) squares: one in the top-right corner and one in the middle-left. The rest of the grid is black.
  output: |
    A 12x12 grid, double the size of the input. The green squares from the input have been expanded into 2x2 blocks of green. A diagonal line of blue (1) squares runs from the top-right to the bottom-left, starting from the third row and second column. The line is continuous and consists of 10 blue squares.

