example_0:
  input: |
    A 15x14 grid predominantly filled with black (0). Five non-black, single-cell color points are scattered:
    - Sky blue (8): row 1, column 5
    - Yellow (4): row 4, column 2
    - Green (3): row 5, column 9
    - Red (2): row 7, column 5
    - Magenta (6): row 11, column 3
    Note: Colors are represented by integers (1-9). Black (0) and red (2) are special colors.
  output: |
    A 15x14 grid featuring a centered, rectangular frame:
    - Frame dimensions: 10 cells wide, 11 cells tall
    - Frame position: Starts at row 1, centered horizontally (columns 2-11)
    - Frame border colors (clockwise from top): Sky blue (8), green (3), magenta (6), yellow (4)
    - Frame interior: Filled with gray (5)
    - Red line: Horizontal, centered vertically within the frame (row 6, columns 3-10)
    - Outside the frame: Remains black (0)
    Key observation: Frame uses all non-black, non-red colors from input. Red maintains its position.

