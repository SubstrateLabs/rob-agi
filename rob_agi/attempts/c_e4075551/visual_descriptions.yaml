example_0:
  input: |
    A 15x14 grid mostly filled with black (0). There are five colored squares scattered across the grid:
    - A sky blue (8) square in the top-right quadrant
    - A yellow (4) square in the left side, about 1/3 down
    - A green (3) square in the right side, about 1/3 down
    - A red (2) square in the middle, slightly below center
    - A magenta (6) square in the bottom-left quadrant
  output: |
    A 15x14 grid with a distinct rectangular frame structure. The frame is 10x11 squares, positioned slightly off-center towards the top-left. The frame consists of:
    - A sky blue (8) top border
    - A yellow (4) left border
    - A green (3) right border
    - A magenta (6) bottom border
    - Gray (5) filling most of the interior
    - The original red (2) square remains in its position, breaking the gray interior
    The rest of the grid outside the frame remains black (0).

