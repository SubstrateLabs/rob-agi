example_0:
  input: |
    A 10x10 grid mostly filled with black (0). In the center, there's a gray (5) shape that resembles an uppercase letter "H". The H is 4 rows tall and 4 columns wide, with the horizontal bar of the H being 1 row thick in the middle.
  output: |
    The grid is mostly the same as the input, but with two key differences:
    1. A red (2) line has been added, starting from the left edge of the grid in row 3, extending right until it reaches the left side of the gray H.
    2. The inside of the H has been filled with red (2), creating a red rectangle within the gray H shape.

example_1:
  input: |
