example_0:
  input: |
    The input grid is 23x17. It contains two distinct patterns:
    1. Upper pattern (rows 7-10): Two vertical lines of sky blue (8) squares, each 4 squares tall, separated by one black square column.
    2. Lower pattern (rows 18-20): Two vertical lines of green (3) squares, each 3 squares tall, separated by one black square column.
    All other squares are black (0).
    Key observations:
    - The colored squares form compact, vertical groups.
    - There's significant vertical space between the two colored patterns.
    - The grid edges are entirely black.

  output: |
    The output grid (23x17) shows a transformation based on the input:
    1. Original colored squares (sky blue and green) remain unchanged.
    2. Diamond patterns extend from each colored square:
       - Sky blue diamonds from the upper pattern.
       - Green diamonds from the lower pattern.
    3. Diamond characteristics:
       - Extend diagonally (45-degree angles) from original squares.
       - Each color's diamonds have the same maximum extent.
       - Sky blue diamonds are larger than green diamonds.
    4. Intersections:
       - Where sky blue and green diamonds overlap, squares are magenta (6).
       - Several magenta squares appear in the middle of the grid.
    5. Pattern observations:
       - Diamonds create symmetrical X-shapes centered on original square groups.
       - The overall pattern is vertically symmetrical.
       - Edges of the grid remain mostly black, with some diagonal color intrusions.

example_1:
  input: |
    The input grid is 22x18. It contains two distinct patterns:
    1. Upper pattern (rows 2-4): Two vertical lines of green (3) squares, each 3 squares tall, separated by one black square column.
    2. Middle pattern (rows 8-9): Two vertical lines of sky blue (8) squares, each 2 squares tall, separated by two black square columns.
    All other squares are black (0).
    Key observations:
    - The colored squares are closer to the top of the grid.
    - There's less vertical space between the two colored patterns compared to example_0.
    - The grid's bottom half is entirely black.

  output: |
    The output grid (22x18) shows a transformation based on the input:
    1. Original colored squares (green and sky blue) remain unchanged.
    2. Diamond patterns extend from each colored square:
       - Green diamonds from the upper pattern.
       - Sky blue diamonds from the middle pattern.
    3. Diamond characteristics:
       - Extend diagonally (45-degree angles) from original squares.
       - Each color's diamonds have the same maximum extent.
       - Green diamonds are slightly larger than sky blue diamonds.
    4. Intersections:
       - No visible intersections between green and sky blue diamonds.
       - No magenta (6) squares present.
    5. Pattern observations:
       - Diamonds create symmetrical X-shapes centered on original square groups.
       - The overall pattern is vertically asymmetrical due to the input's layout.
       - The bottom edge of the grid remains black, while other edges show diagonal color patterns.

example_2:
  input: |
    The input grid is 24x19. It contains two distinct patterns:
    1. Upper pattern (rows 7-10): Two vertical lines of green (3) squares, each 4 squares tall, separated by three black square columns.
    2. Lower pattern (row 20): Two single sky blue (8) squares, separated by one black square column.
    All other squares are black (0).
    Key observations:
    - The green squares form a compact group, while the sky blue squares are isolated.
    - There's significant horizontal space between the green vertical lines.
    - The sky blue squares are very close to the bottom edge.

  output: |
    The output grid (24x19) shows a transformation based on the input:
    1. Original colored squares (green and sky blue) remain unchanged.
    2. Diamond patterns extend from each colored square:
       - Green diamonds from the upper pattern.
       - Sky blue diamonds from the lower pattern.
    3. Diamond characteristics:
       - Extend diagonally (45-degree angles) from original squares.
       - Each color's diamonds have different maximum extents.
       - Sky blue diamonds are significantly larger than green diamonds.
    4. Intersections:
       - One visible magenta (6) square where a green and sky blue diamond overlap.
    5. Pattern observations:
       - Green diamonds form two distinct X-shapes in the upper half.
       - Sky blue diamonds create a wide, V-shaped pattern from the bottom.
       - The overall pattern is vertically asymmetrical.
       - Top and side edges of the grid show diagonal color intrusions, while the bottom edge is mostly colored.

Key insights across all examples:
- The transformation creates diamond patterns extending from original colored squares.
- Diamond size seems related to the spread of same-colored squares in the input.
- Magenta appears at intersections of different colored diamonds.
- Original colored squares are always preserved in their input positions.
- The transformation maintains the input grid's dimensions.
