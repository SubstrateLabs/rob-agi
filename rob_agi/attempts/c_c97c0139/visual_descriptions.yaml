example_0:
  input: |
    Grid size: 19x17
    Key features:
    - Single horizontal red (2) line in row 7, spanning columns 2-16 (15 units long)
    - All other cells are black (0)
    Observations:
    - The red line is centered vertically in the grid
    - There's equal space (5 rows) above and below the red line
    - The red line starts and ends 2 columns from the grid edges

  output: |
    Grid size: 19x17 (unchanged)
    Key features:
    - Original red (2) line remains unchanged
    - Sky blue (8) diamond shape surrounding the red line
    Diamond properties:
    - Extends 7 rows above and below the red line (total height: 15 rows)
    - Widest point aligns with the ends of the red line (15 units wide)
    - Tapers symmetrically to a point at top and bottom
    - Each row of the diamond is 2 units shorter than the one below/above it
    Observations:
    - The diamond's height matches the red line's length
    - The diamond is perfectly centered in the grid
    - Black (0) cells fill all areas outside the diamond

example_1:
  input: |
    Grid size: 21x19
    Key features:
    1. Vertical red (2) line:
       - In column 4
       - Spans rows 2-6 (5 units tall)
    2. Horizontal red (2) line:
       - In row 12
       - Spans columns 9-17 (9 units wide)
    - All other cells are black (0)
    Observations:
    - The two red lines do not intersect
    - The vertical line is closer to the left edge
    - The horizontal line is slightly below the vertical midpoint of the grid

  output: |
    Grid size: 21x19 (unchanged)
    Key features:
    - Both original red (2) lines remain unchanged
    - Two distinct sky blue (8) diamond shapes, one around each red line
    Diamond properties:
    1. Around vertical line:
       - 3 units wide at its widest (centered on the red line)
       - Extends 1 unit above and below the red line
       - Total height: 7 units (matching the line's length)
    2. Around horizontal line:
       - 7 units tall at its tallest (centered on the red line)
       - Extends 4 units left and right of the line's ends
       - Total width: 17 units (matching the line's length)
    Observations:
    - Diamond size correlates with the length of the corresponding red line
    - Diamonds taper symmetrically to points at their extremities
    - No overlap between the two diamond shapes
    - Black (0) cells fill all areas outside the diamonds

