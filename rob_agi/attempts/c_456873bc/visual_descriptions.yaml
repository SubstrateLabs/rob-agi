example_0:
  input: |
    The grid is 19x19. The top half contains three red (2) "F" shapes, each consisting of a vertical line with two horizontal lines extending to the right. These shapes are evenly spaced across the top. The middle of the grid (rows 5-9) is filled with green (3). The bottom half mirrors the top, but with the "F" shapes inverted and progressively fewer of them (3, then 2, then 1) as we move down the grid.
  output: |
    The grid maintains its 19x19 size. The green area is completely removed. The red "F" shapes remain, but now some cells are changed to sky blue (8). These sky blue cells appear at the top-left corner of each "F" shape, both in the upper and lower halves of the grid. The pattern of "F" shapes is preserved, including the decreasing number in the lower half.

