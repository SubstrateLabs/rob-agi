example_0:
  input: |
    A 25x23 grid with mostly black (0) background. There are several distinct elements:
    1. Two pairs of red (2) 2x2 squares in the top-right and bottom-right corners.
    2. Two pairs of red 2x2 squares in the middle-left and middle-right of the grid.
    3. Several blue (1) pixels scattered throughout the grid, some in small clusters, others isolated.
    4. Some blue 2x2 squares, particularly in the top-left quadrant.
  output: |
    The same 25x23 grid, with the following changes:
    1. The red (2) squares remain unchanged.
    2. The blue (1) pixels have been rearranged and expanded into more structured patterns:
       - A symmetrical pattern in the top-left quadrant with 2x2 blue squares as anchors.
       - A central vertical line of blue pixels.
       - Symmetrical patterns in the middle and bottom of the grid.
    3. All blue pixels are now connected, forming a single continuous shape.
    4. The overall arrangement of blue pixels appears more balanced and symmetrical.

example_1:
  input: |
    A 23x22 grid with a black (0) background and several elements:
    1. Multiple sky blue (8) 2x2 squares scattered around the edges of the grid.
    2. Several blue (1) pixels distributed across the grid, some in small clusters, others isolated.
    3. Some sky blue rectangular shapes (2x3 or 3x2) near the edges.
  output: |
    The same 23x22 grid, with the following changes:
    1. The sky blue (8) squares and rectangles remain unchanged.
    2. The blue (1) pixels have been rearranged and expanded into more structured patterns:
       - Symmetrical patterns formed around the sky blue squares.
       - A more connected and continuous blue shape across the grid.
    3. All blue pixels are now connected, forming a single continuous shape.
    4. The overall arrangement of blue pixels appears more balanced and symmetrical.

example_2:
  input: |
    A 21x20 grid with a black (0) background and several elements:
    1. Green (3) 2x2 squares in the corners and along the edges.
    2. Blue (1) pixels scattered throughout the grid, some in small clusters, others isolated.
  output: |
    The same 21x20 grid, with the following changes:
    1. The green (3) squares remain unchanged.
    2. The blue (1) pixels have been rearranged and expanded into more structured patterns:
       - Symmetrical patterns formed around and between the green squares.
       - A more connected and continuous blue shape across the grid.
    3. All blue pixels are now connected, forming a single continuous shape.
    4. The overall arrangement of blue pixels appears more balanced and symmetrical, with some 2x2 blue squares formed as part of the pattern.