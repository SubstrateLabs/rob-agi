example_0:
  input: |
    A 25x25 grid with mostly black (empty) space. There are several distinct elements:
    1. Four yellow 2x2 squares in the corners of the grid (top-left, top-right, bottom-left, bottom-right).
    2. A pattern of blue dots and small blue shapes scattered across the grid:
       - Two horizontal blue dots in the top-left quadrant
       - A small L-shaped blue pattern in the top-right quadrant
       - A single blue dot in the middle-right of the grid
       - Two vertical blue dots in the bottom-right quadrant
       - A cluster of blue dots forming a rough diamond shape in the center-left of the grid
    3. Red elements:
       - Two 2x2 red squares in the top-center of the grid
       - Two 2x2 red squares in the bottom-center of the grid
       - Single red dots adjacent to some of these red squares
  output: |
    The 25x25 grid maintains the same overall structure as the input, with some key changes:
    1. The four yellow 2x2 squares in the corners remain unchanged.
    2. The blue elements have been significantly modified:
       - The scattered blue dots and shapes have been connected to form more cohesive patterns
       - A symmetrical blue pattern has emerged in the top half of the grid, resembling a stylized bird or butterfly
       - The central cluster has been extended into a more defined shape
       - New blue connections have been added, creating lines and shapes that weren't present in the input
    3. The red elements (2x2 squares and adjacent dots) remain unchanged
    Overall, the output grid shows a more structured and symmetrical arrangement of blue elements, while maintaining the positions of yellow and red elements.

example_1:
  input: |
    A 23x23 grid with mostly black (empty) space. The grid contains:
    1. Six sky-blue (color 8) 2x2 squares arranged in three pairs:
       - Top-left and top-right
       - Middle-left and middle-right
       - Bottom-left and bottom-right
    2. Blue dots and small shapes scattered across the grid:
       - A small L-shape in the top-left quadrant
       - Two separate dots in the top-right quadrant
       - A cluster of dots forming a rough T-shape in the center
       - A single dot in the bottom-left quadrant
       - Two dots forming a diagonal line in the bottom-right quadrant
    3. Green elements:
       - Two 2x2 green squares in the center-top of the grid
       - Two 2x2 green squares in the center-bottom of the grid
  output: |
    The 23x23 grid maintains the same overall structure, with significant changes to the blue elements:
    1. The six sky-blue 2x2 squares remain unchanged in their positions.
    2. The blue elements have been transformed:
       - The scattered blue dots and shapes are now connected, forming a more cohesive pattern
       - A symmetrical blue pattern has emerged, resembling a stylized face or mask
       - The central T-shape has been extended and connected to other blue elements
       - New blue connections have been added, creating lines and shapes that weren't present in the input
    3. The green 2x2 squares remain unchanged in their positions
    The output grid shows a more structured and symmetrical arrangement of blue elements, while maintaining the positions of sky-blue and green elements.

