example_0:
  input: |
    A 21x23 grid dominated by a large red (2) structure in the center, resembling a building. Key features:
    - Red (2) forms the main body, roughly rectangular with some internal divisions.
    - Blue (1) creates an L-shaped structure at the bottom, wrapping around the red.
    - Yellow (4) appears in two main areas: top-left corner of the red structure and bottom-right of the grid.
    - Sky blue (8) forms two small 2x2 squares in the middle-left of the red structure.
    - Magenta (6) creates a 3x6 rectangle on the far right, adjacent to the red.
    - Green (3) appears as two small areas in the top-right corner.
    - Gray (5) dots are scattered around the edges, not forming any significant structure.
    - Black (0) fills the remaining space, creating the background.
  output: |
    A 21x23 grid with a simplified and more symmetrical structure. Key transformations:
    - Red (2) maintains its central position but becomes a perfect rectangle without internal divisions.
    - Blue (1) retains its L-shape at the bottom but with straighter edges.
    - Yellow (4) is consolidated into a single rectangular region inside the red structure.
    - Sky blue (8) is enlarged to a 2x3 rectangle, centrally placed within the red area.
    - Magenta (6) keeps its rectangular shape but is now positioned inside the blue structure.
    - Green (3) is moved to form a small rectangle within the blue area.
    - Gray (5) is completely removed.
    - Black (0) forms a clear border around the entire structure and fills any gaps.

example_1:
  input: |
    A 20x22 grid with distinct color regions. Key features:
    - Blue (1) dominates the top-left quadrant, forming a large square with internal details.
    - Yellow (4) creates a complex shape in the bottom half, with irregular edges and internal gaps.
    - Red (2) forms a small 3x5 rectangle in the top-right corner.
    - Sky blue (8) appears as two 2x2 squares in the middle-left of the yellow area.
    - Green (3) creates three vertical lines on the far right side.
    - Gray (5) dots are scattered around the edges and corners.
    - Black (0) fills the remaining space and gaps between color regions.
  output: |
    A 20x22 grid with a more organized and symmetrical layout. Key transformations:
    - Blue (1) maintains its position in the top-left but becomes a perfect square without internal details.
    - Yellow (4) is transformed into a large rectangle occupying the bottom half of the grid.
    - Red (2) is moved inside the blue structure, forming a smaller rectangle in the top-left corner.
    - Sky blue (8) is consolidated into a single 2x2 square, centrally placed within the yellow area.
    - Green (3) is condensed into a small rectangle within the yellow structure on the right side.
    - Gray (5) is completely removed.
    - Black (0) creates a clear border around all structures and fills any gaps.

example_2:
  input: |
    A 20x20 grid dominated by a large blue (1) structure. Key features:
    - Blue (1) forms a complex shape covering most of the grid, with internal details and irregular edges.
    - Red (2) creates a small 3x3 rectangle in the top-right corner.
    - Yellow (4) forms a 4x4 rectangle in the middle-left area.
    - Sky blue (8) appears as a vertical line of 4 cells on the right side.
    - Green (3) forms two 2x2 squares in the bottom-middle area.
    - Gray (5) dots are scattered around the edges and corners.
    - Black (0) fills the remaining space and internal gaps.
  output: |
    A 20x20 grid with a simplified and more symmetrical structure. Key transformations:
    - Blue (1) is transformed into a large, perfect rectangle occupying most of the grid.
    - Red (2) is moved inside the blue structure, forming a small rectangle in the top-left corner.
    - Yellow (4) maintains its rectangular shape but is repositioned inside the blue structure in the middle-left.
    - Sky blue (8) is changed from a vertical line to a small rectangle within the blue structure on the right side.
    - Green (3) is consolidated into a single small rectangle within the blue structure at the bottom.
    - Gray (5) is completely removed.
    - Black (0) creates a clear border around the entire structure and fills any remaining gaps.

