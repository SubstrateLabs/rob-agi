example_0:
  input: |
    A 15x15 grid with most cells black (0). In the center-left area, there's a small cluster of colored cells:
    - Row 1: A red (2) cell, a gray (5) cell, and an orange (7) cell
    - Row 2: A red (2) cell, a sky (8) cell, and an orange (7) cell
    - Row 3: Three green (3) cells in a row
    The rest of the grid is black (0).
  output: |
    A 15x15 grid with various color expansions:
    - Red (2) expands horizontally across row 2 and vertically up one cell in column 1
    - Gray (5) remains in its original position
    - Orange (7) expands diagonally down-right, filling the entire right side of the grid from its starting point
    - Sky (8) remains in its original position
    - Green (3) expands in a diagonal cross pattern, forming a long diagonal line from top-left to bottom-right, and shorter diagonal lines perpendicular to it
    The rest of the grid remains black (0).

example_1:
  input: |
    A 10x10 grid with most cells black (0). In the center, there's a small cluster of colored cells:
    - Row 2: A green (3) cell, a blue (1) cell, and a red (2) cell
    - Row 3: A red (2) cell, a magenta (6) cell, and a red (2) cell
    - Row 4: A red (2) cell and two orange (7) cells
    The rest of the grid is black (0).
  output: |
    A 10x10 grid with color expansions:
    - Green (3) expands diagonally up-left for two cells
    - Blue (1) expands diagonally up-right for two cells
    - Red (2) expands horizontally across row 3 and vertically up and down from its ends
    - Magenta (6) expands diagonally up-left, reaching the top-left corner
    - Orange (7) expands diagonally down-right, forming a triangular pattern in the bottom-right corner
    The rest of the grid remains black (0).

example_2:
  input: |
    A 20x20 grid with most cells black (0). In the bottom-right quadrant, there's a small cluster of colored cells:
    - Row 6: A magenta (6) cell and two red (2) cells
    - Row 7: A yellow (4) cell, a gray (5) cell, and a yellow (4) cell
    - Row 8: A magenta (6) cell and two sky (8) cells
    The rest of the grid is black (0).
  output: |
    A 20x20 grid with color expansions:
    - Magenta (6) in row 6 expands diagonally up-left, reaching the top-left corner
    - Red (2) expands horizontally across row 6 and vertically up from its rightmost position
    - Yellow (4) expands horizontally, filling the entire row 7
    - Gray (5) remains in its original position
    - Magenta (6) in row 8 expands diagonally up-left, but stops at the yellow row
    - Sky (8) expands diagonally down-right, forming a triangular pattern in the bottom-right corner
    The rest of the grid remains black (0).

