example_0:
  input: |
    The input grid is 19x13 in size. The most prominent feature is a large, inverted L-shaped structure made of sky blue (8) that runs along the top and left side of the grid. This structure is 1 unit thick. Inside this L-shape, there's a diverse array of colors and patterns:
    - In the top-left corner, there's a small cluster of various colors (5, 3, 0, 8, 0, 6).
    - The right side of the grid has a vertical line of orange (7) squares near the bottom-right corner.
    - There are several isolated squares of different colors scattered throughout the grid.
    - The bottom-right quadrant has a distinct pattern: a 5x5 square outline made of orange (7), with the top-left corner missing.
    - Inside this orange square, there are a few colored squares, including blue (1) and brown (9).
  output: |
    The output grid is significantly smaller, 6x7 in size. It appears to be a section extracted from the input grid:
    - The top-left corner starts with a yellow (4) square.
    - There's a partial sky blue (8) line running vertically on the right side.
    - The bottom-left area contains a cluster of colors, including brown (9), blue (1), and magenta (6).
    - The right side has a pattern of alternating colors, including orange (7) and yellow (4).
    This output seems to be a specific region from the input grid, focusing on an area with diverse color patterns.

