example_0:
  input: |
    The grid is 30x30, divided into four quadrants by a black cross at rows/columns 14-15.
    Top-left quadrant (0-13, 0-13):
    - Green (3) frame: (2,2) to (18,12)
    - Yellow (4) rectangle: (4,4) to (16,10)
    - Blue (1) rectangle: (6,6) to (14,8)
    - Sky blue (8) rectangle: (8,8) to (12,12)
    Bottom-right quadrant (16-29, 16-29):
    - Green (3) rectangle: (14,15) to (28,24)
    All other areas are black (0).
  output: |
    The grid structure remains 30x30 with the black cross.
    Top-left quadrant: Unchanged from input.
    Bottom-right quadrant: The green rectangle now contains nested rectangles mirroring the top-left pattern:
    - Green (3) outer rectangle
    - Yellow (4) rectangle inside
    - Blue (1) rectangle within yellow
    - Sky blue (8) innermost rectangle
    Other quadrants and the central cross remain black (0).

example_1:
  input: |
    30x30 grid with black cross at rows/columns 14-15.
    Top-left quadrant (0-13, 0-13):
    - Red (2) rectangle: (2,2) to (13,11)
    - Yellow (4) rectangle: (5,5) to (11,10)
    - Blue (1) rectangle: (7,7) to (9,10)
    - Sky blue (8) rectangle: (3,6) to (10,7), overlapping yellow
    - Magenta (6) inverted 'L': top and left edges of red rectangle
    Bottom-right quadrant (16-29, 16-29):
    - Red (2) rectangle: (14,19) to (28,28)
    Other areas black (0).
  output: |
    Grid structure and top-left quadrant unchanged.
    Bottom-right quadrant: Red rectangle now contains the complete pattern from top-left:
    - Red (2) outer rectangle
    - Yellow (4) rectangle inside
    - Blue (1) rectangle within yellow
    - Sky blue (8) rectangle overlapping yellow
    - Magenta (6) inverted 'L' along top and left of red rectangle
    Other quadrants and central cross remain black (0).

