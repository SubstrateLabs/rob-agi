example_0:
  input: |
    A 16x15 grid with a single large red (2) rectangular region in the center. The red rectangle is 11x8, spanning rows 4-11 and columns 4-14. The rest of the grid is black (0).
  output: |
    The 16x15 grid with the red rectangle transformed:
    1. The outer border (top, bottom, left, right) remains solid red (2).
    2. The interior is filled with a checkerboard pattern of red (2) and black (0).
    3. The pattern starts with red in the top-left interior cell (row 5, column 5).
    4. The bottom row (row 11) and rightmost column (column 14) of the rectangle remain solid red.
    5. The checkerboard pattern is based on the absolute grid position, not relative to the rectangle.

example_1:
  input: |
    A 13x15 grid with two distinct colored regions:
    1. Top-left: A 5x5 blue (1) square, rows 0-4, columns 0-4.
    2. Bottom-right: A 6x10 sky blue (8) rectangle, rows 6-11, columns 4-13.
    The rest of the grid is black (0).
  output: |
    The 13x15 grid with both colored regions transformed:
    1. Blue square:
       - Outer border remains solid blue (1).
       - Interior filled with blue-black checkerboard, starting blue at (1,1).
       - Bottom row (row 4) and rightmost column (column 4) remain solid blue.
    2. Sky blue rectangle:
       - Outer border remains solid sky blue (8).
       - Interior filled with sky blue-black checkerboard, starting sky blue at (7,5).
       - Bottom row (row 11) and rightmost column (column 13) remain solid sky blue.
    3. Checkerboard patterns are based on absolute grid positions for both regions.

example_2:
  input: |
    A 17x16 grid with three distinct colored regions:
    1. Top-left: Green (3) 8x7 rectangle, rows 1-7, columns 2-9.
    2. Bottom-left: Yellow (4) 8x8 square, rows 9-16, columns 0-7.
    3. Bottom-right: Sky blue (8) 6x5 rectangle, rows 9-14, columns 10-15.
    The rest of the grid is black (0).
  output: |
    The 17x16 grid with all three colored regions transformed:
    1. Green rectangle:
       - Outer border remains solid green (3).
       - Interior filled with green-black checkerboard, starting green at (2,3).
       - Bottom row (row 7) and rightmost column (column 9) remain solid green.
    2. Yellow square:
       - Outer border remains solid yellow (4).
       - Interior filled with yellow-black checkerboard, starting yellow at (10,1).
       - Bottom row (row 16) and rightmost column (column 7) remain solid yellow.
    3. Sky blue rectangle:
       - Outer border remains solid sky blue (8).
       - Interior filled with sky blue-black checkerboard, starting sky blue at (10,11).
       - Bottom row (row 14) and rightmost column (column 15) remain solid sky blue.
    4. All checkerboard patterns are based on absolute grid positions, ensuring consistency across regions.

test_case_0:
