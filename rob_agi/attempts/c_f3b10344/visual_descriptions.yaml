  output: |
    The layout is similar to the input, with the addition of sky blue (8) connections. A 3-cell wide sky blue bridge connects the right side of the upper left yellow square to the left side of the upper right yellow square. Another bridge connects the bottom of the upper right yellow square to the top of the magenta rectangle in the center right. A third bridge connects the bottom of this magenta rectangle to the top of the magenta square in the lower right. A fourth bridge connects the left side of the lower left yellow rectangle to the left side of the upper left yellow square. Finally, a fifth bridge connects the right side of the lower left yellow rectangle to the left side of the lower right magenta square.

