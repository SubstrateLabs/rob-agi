example_0:
  input: |
    The grid contains several distinct colored regions. In the top-left, there's a magenta (6) rectangular shape, approximately 7x3 in size. Below and to the right of this is a larger gray (5) region, roughly L-shaped and extending to the right side of the grid. In the bottom-left quadrant, there's a sky blue (8) region that's roughly rectangular. To its right is a red (2) region that's also roughly rectangular. In the bottom-left, there's a small green (3) region that's roughly L-shaped. The rest of the grid is filled with black (0), which can be considered empty space.
  output: |
    The overall structure is similar to the input, but with some key differences. The magenta (6) region in the top-left has been slightly reshaped, becoming more rectangular and losing its rightmost column. The gray (5) region has expanded leftward, filling the space left by the magenta region's contraction. The sky blue (8) region has moved upward and slightly to the left. The red (2) region remains in roughly the same position but has become more rectangular. The green (3) region has expanded slightly to become a perfect rectangle. All regions now have more defined, rectangular shapes with straighter edges.

example_1:
  input: |
