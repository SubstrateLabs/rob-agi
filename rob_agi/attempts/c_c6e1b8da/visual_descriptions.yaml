example_0:
  input: |
    The 20x20 grid contains five colored regions surrounded by black (0) space:
    1. Magenta (6): Top-left, roughly rectangular (7x3), touching the left edge.
    2. Gray (5): Center-right, L-shaped, largest region, touching the right edge.
    3. Sky Blue (8): Bottom-left, roughly rectangular, not touching any edge.
    4. Red (2): Bottom-right, roughly rectangular, touching the right edge.
    5. Green (3): Bottom-left corner, small L-shape, touching the bottom and left edges.
    Regions have irregular shapes with some jagged edges. There's no consistent spacing between regions.
  output: |
    The transformed 20x20 grid maintains the same color regions but with significant changes:
    1. Magenta (6): Reshaped to a perfect 6x3 rectangle, still in top-left, touching the top and left edges.
    2. Gray (5): Expanded leftward, now a large rectangle covering most of the top-right quadrant, touching the top and right edges.
    3. Sky Blue (8): Moved up and left, now a perfect rectangle touching the left edge, below the magenta region.
    4. Red (2): Reshaped to a perfect rectangle, still in bottom-right, touching the bottom and right edges.
    5. Green (3): Expanded to a perfect 5x5 square in the bottom-left corner, touching the bottom and left edges.
    All regions are now perfect rectangles or squares with straight edges. There's a consistent one-cell black border between all regions and around the grid edges.

