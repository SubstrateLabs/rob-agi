example_0:
  input: |
    The grid is 13x12. The top row is entirely sky blue (8). The bottom row is entirely green (3). The middle 10 rows are mostly black (0) with scattered blue dots (1). There are 7 blue dots in total, distributed seemingly randomly across the middle section.
  output: |
    The grid maintains its 13x12 size. The top and bottom rows remain unchanged (sky blue and green respectively). The middle section now has additional sky blue (8) and green (3) squares. Each blue dot from the input has been modified:
    - The two blue dots in the second column now have a sky blue square directly above them.
    - The blue dot in the fifth column has a sky blue square diagonally above-left.
    - The blue dot in the sixth row now has a green square directly below it.
    - The blue dot in the ninth column of the third row remains unchanged, but now has a sky blue square directly above it.
    - The blue dot in the last column of the eighth row now has a green square directly below it.
    - The blue dot in the ninth column of the ninth row remains unchanged.

