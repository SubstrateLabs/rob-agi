example_0:
  input: |
    A 3x3 grid with a single magenta (6) square in the center (1,1), surrounded by black (0) squares.
  output: |
    A 9x9 grid with a 3x3 expansion of the input. The central magenta (6) square is preserved at (4,4).
    Blue (1) squares form a cross pattern around the magenta square and create a grid-like structure.
    Green (3) squares appear in the corners of each 3x3 section in a checkerboard pattern.
    The remaining squares are black (0).

example_1:
  input: |
    A 2x4 grid with a single gray (5) square in the top row, third column (0,2). All other squares are black (0).
  output: |
    A 6x12 grid, representing a 3x3 expansion of each input cell.
    The gray (5) square is preserved at (1,7).
    Blue (1) squares surround the gray square in a cross pattern and form a grid structure every third row and column.
    Green (3) squares appear in corners of 3x3 sections in a checkerboard pattern, alternating with black corners.
    The remaining squares are black (0).

example_2:
  input: |
    A 4x6 grid with three yellow (4) squares: one in the second row, third column (1,2),
    and two in the bottom row at the first and fifth columns (3,0) and (3,4). All other squares are black (0).
  output: |
    A 12x18 grid, representing a 3x3 expansion of each input cell.
    Yellow (4) squares are preserved at (4,7), (10,1), and (10,13).
    Blue (1) squares surround each yellow square in a cross pattern and form a grid structure every third row and column.
    Green (3) squares appear in corners of 3x3 sections in a checkerboard pattern, alternating with black corners.
    The remaining squares are black (0).

example_3:
  input: |
    A 5x5 grid with a single red (2) square in the center (2,2). All other squares are black (0).
  output: |
    A 15x15 grid, representing a 3x3 expansion of each input cell.
    The central red (2) square is preserved at (7,7).
    Blue (1) squares surround the red square in a cross pattern and form a grid structure every third row and column.
    Green (3) squares appear in corners of 3x3 sections in a checkerboard pattern, alternating with black corners.
    The remaining squares are black (0).

