example_0:
  input: |
    An 11x11 grid with mostly black (empty) squares. There are three colored squares:
    - A gray (5) square in the top-left corner
    - A magenta (6) square adjacent to the gray square
    - A blue (1) square in the middle of the 5th row, 4th column
  output: |
    An 11x11 grid with a distinct pattern:
    - A rectangular shape formed by gray (5) and magenta (6) squares
    - The shape resembles an incomplete rectangle or 'C' shape
    - Gray forms most of the shape, with magenta forming the right side
    - The blue (1) square from the input is preserved inside this shape
    - The shape is positioned in the upper-left quadrant of the grid
    - The rest of the grid remains black (empty)

