example_0:
  input: |
    A mostly empty 11x11 grid with two colored squares in the top-left corner: a gray (5) square at (0,0) and a magenta (6) square at (0,1). There's also a single blue (1) square near the center at (4,3).
  output: |
    An 11x11 grid with a distinct shape formed by gray (5) and magenta (6) squares. The shape resembles a rectangular frame or box with an opening on the right side. The frame is made of gray squares, with magenta squares forming the left side and part of the top. The blue (1) square from the input is now inside this frame, slightly off-center. The rest of the grid remains black (0).

example_1:
  input: |
    An 11x11 grid with two colored squares in the top-left corner: a green (3) square at (0,0) and a red (2) square at (0,1). There's also a single blue (1) square in the lower right quadrant at (6,6).
  output: |
    An 11x11 grid with a distinct rectangular shape formed by green (3) and red (2) squares. The shape is larger than in the previous example and positioned more centrally. It forms a complete rectangle with green squares making up most of the perimeter, and red squares forming the right side and part of the bottom. The blue (1) square from the input is now inside this rectangle, positioned slightly off-center. The rest of the grid remains black (0).

example_2:
  input: |
    A 12x12 grid with two colored squares in the top-left corner: a gray (5) square at (0,0) and a green (3) square at (0,1). There's also a single blue (1) square slightly left of center at (6,5).
  output: |
    A 12x12 grid with a complex shape formed by gray (5) and green (3) squares. The shape resembles two interconnected rectangles. The outer rectangle is made primarily of gray squares, with green squares forming the right side and part of the bottom. Inside this, there's a smaller rectangle also made of gray squares. The blue (1) square from the input is now inside the inner rectangle, slightly off-center. The rest of the grid remains black (0).