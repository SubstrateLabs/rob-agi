example_0:
  input: |
    The grid is 12x9. There's a horizontal blue line (color 1) in the middle of the grid, at row 5. Above this line, there's a red (color 2) and green (color 3) pattern. The pattern looks like an inverted 'T' shape, with red on the outside and green in the center. The rest of the grid is black (color 0).
  output: |
    The grid maintains its 12x9 size and the blue horizontal line. The pattern above the line has changed: it's now green on the outside and red in the center, effectively inverting the colors of the original pattern. Below the blue line, a mirror image of the original red-green pattern appears, maintaining its original color scheme (red outside, green inside).

