example_0:
  input: |
    A 23x19 grid with a large blue (1) rectangular shape in the top-left quadrant. The shape has a border of blue and is filled with various colors. There's a red (2) dot in the top-left corner of the blue shape, a yellow (4) dot in the top-right corner, and a green (3) dot in the bottom-left corner. Inside the blue shape is a sky blue (8) pattern resembling a stick figure or abstract shape. The rest of the grid is filled with black (0), representing empty space. There are three isolated colored dots at the bottom of the grid: green (3), yellow (4), and red (2).
  output: |
    A 10x10 grid that appears to be a cropped and centered version of the blue shape from the input. The blue (1) border remains intact. The red (2), yellow (4), and green (3) dots are now positioned in the corners: red in bottom-right, yellow in top-right, and green in top-left. The sky blue (8) pattern is preserved and centered within the blue border.

