example_0:
  input: |
    A blue L-shaped object is present in the top-left corner of the grid. It consists of a vertical line of 4 blue squares with a horizontal line of 3 blue squares attached at the top. There's a single green square (3) isolated in the middle-right area of the grid. A single sky blue square (8) is located at the bottom-left corner of the grid. The rest of the grid is filled with black (0), representing empty space.
  output: |
    The original blue L-shaped object remains in the top-left corner. A new, rotated green L-shaped object appears, mirroring the blue one but rotated 90 degrees clockwise. It's positioned so that its corner aligns with the original isolated green square. A new sky blue L-shaped object appears at the bottom-left, extending from the original single sky blue square. This new object is a mirror image of the original blue L-shape, flipped horizontally. The rest of the grid remains black (empty).

example_1:
  input: |
    A blue shape resembling an irregular 'T' or 'anchor' is present in the middle-left area of the grid. It consists of a horizontal line of 4 blue squares with a vertical line of 3 blue squares attached below the second square from the left. There's a single magenta square (6) isolated near the right edge of the grid, slightly above the middle. The rest of the grid is filled with black (0), representing empty space.
  output: |
    The original blue 'T' or 'anchor' shape remains unchanged. A new magenta shape, identical to the blue one but rotated 90 degrees counterclockwise, appears on the right side of the grid. Its position is such that the end of its longer arm aligns with the original isolated magenta square. The rest of the grid remains black (empty).

example_2:
  input: |
    A blue shape resembling a 'Y' or a tree is present in the top-left quadrant of the grid. It consists of a vertical line of 3 blue squares with two diagonal arms extending upwards and outwards from the top, each arm being 2 squares long. There's a single red square (2) isolated near the middle-bottom of the grid. The rest of the grid is filled with black (0), representing empty space.
  output: |
    The original blue 'Y' or tree shape remains unchanged in the top-left quadrant. A new red shape, identical to the blue one but rotated 180 degrees (upside down), appears in the bottom half of the grid. Its position is such that the tip of its 'trunk' aligns with the original isolated red square. The rest of the grid remains black (empty).

example_3:
  input: |
    A blue shape resembling an irregular 'U' or horseshoe is present in the top-left quadrant of the grid. It consists of two vertical lines of 3 blue squares each, connected by a horizontal line of 2 blue squares at the top. There's a single red square (2) isolated near the top-right corner of the grid. A single sky blue square (8) is located in the left-middle area of the grid. The rest of the grid is filled with black (0), representing empty space.
  output: |
    The original blue 'U' or horseshoe shape remains unchanged in the top-left quadrant. A new red shape, identical to the blue one but rotated 90 degrees clockwise, appears in the top-right quadrant. Its position is such that its open end aligns with the original isolated red square. A new sky blue shape, identical to the original blue shape but rotated 90 degrees counterclockwise, appears in the left-middle area of the grid. Its position is such that its top-right corner aligns with the original isolated sky blue square. The rest of the grid remains black (empty).

