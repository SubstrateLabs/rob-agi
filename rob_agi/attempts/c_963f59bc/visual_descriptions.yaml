example_0:
  input: |
    An L-shaped blue object is present in the top-left corner of the grid. It consists of a vertical line of 4 blue squares with a horizontal extension of 3 squares at the top. There's a single green square (3) in the middle-right area of the grid, and a single sky blue square (8) in the bottom-left corner. The rest of the grid is filled with black (0), which can be considered empty space.
  output: |
    The original L-shaped blue object remains in the top-left corner. A new, rotated and mirrored version of this blue shape appears around the green square, with the green square at its core. Similarly, another rotated version of the blue shape appears around the sky blue square in the bottom-left, with the sky blue square at its core. These new shapes maintain the color of their respective core squares (green and sky blue).

