example_0:
  input: |
    A 9x9 grid predominantly filled with yellow (4) squares. There is a single blue (1) dot in the third row, second column. Another blue (1) dot is in the eighth row, seventh column. The rest of the grid is entirely yellow.
  output: |
    The same 9x9 grid with a yellow (4) background. The two blue (1) dots are now connected by a diagonal line of blue (1) squares. This line starts from the top-left blue dot, moves diagonally down and right, ending at the bottom-right blue dot. The line passes through 5 squares in total, including the original dots.

example_1:
  input: |
    An 11x8 grid with a sky blue (8) background. There are three colored dots: a blue (1) dot in the second row, seventh column; a magenta (6) dot in the fourth row, fifth column; and another blue (1) dot in the seventh row, second column.
  output: |
    The same 11x8 grid with a sky blue (8) background. Two diagonal lines have been drawn: a magenta (6) line connecting the top-left corner to the original magenta dot, and a blue (1) line connecting the two original blue dots. The magenta line passes through 5 squares, while the blue line passes through 6 squares, including the original dots.

example_2:
  input: |
    A 12x9 grid with a yellow (4) background. There are three colored dots: a blue (1) dot in the second row, eighth column; a magenta (6) dot in the seventh row, eighth column; and another blue (1) dot in the eighth row, second column.
  output: |
    The same 12x9 grid with a yellow (4) background. A diagonal blue (1) line has been drawn connecting the two blue dots. This line starts from the top-right blue dot, moves diagonally down and left, ending at the bottom-left blue dot. The line passes through 7 squares in total, including the original dots. The magenta (6) dot remains unchanged.

example_3:
  input: |
    A 15x12 grid with a gray (5) background. There are five colored dots: a blue (1) dot in the fourth row, second column; a magenta (6) dot in the third row, tenth column; another magenta (6) dot in the sixth row, fourth column; a third magenta (6) dot in the ninth row, seventh column; and another blue (1) dot in the tenth row, eighth column.
  output: |
    The same 15x12 grid with a gray (5) background. Two diagonal lines have been drawn: a blue (1) line connecting the two original blue dots, and a magenta (6) line connecting all three magenta dots. The blue line passes through 7 squares, starting from the top-left blue dot and ending at the bottom-right blue dot. The magenta line forms a zigzag pattern, connecting the three original magenta dots in order from top to bottom, passing through 11 squares in total.

example_4:
  input: |
    A 16x15 grid with a sky blue (8) background. There are six colored dots: a magenta (6) dot in the second row, ninth column; a blue (1) dot in the third row, third column; another blue (1) dot in the fourth row, thirteenth column; a magenta (6) dot in the tenth row, tenth column; another magenta (6) dot in the eleventh row, second column; and a blue (1) dot in the twelfth row, twelfth column; and a final magenta (6) dot in the fifteenth row, fourteenth column.
  output: |
    The same 16x15 grid with a sky blue (8) background. Two diagonal lines have been drawn: a blue (1) line connecting the three blue dots, and a magenta (6) line connecting the four magenta dots. The blue line forms a zigzag pattern, starting from the top-left blue dot, passing through the middle blue dot, and ending at the bottom-right blue dot. The magenta line also forms a zigzag pattern, connecting all four magenta dots in order from top to bottom. Both lines pass through multiple squares, creating a complex pattern across the grid.