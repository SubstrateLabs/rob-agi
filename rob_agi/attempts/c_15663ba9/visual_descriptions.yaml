  output: |
    The output grid maintains the overall structure of the input, but with color changes that highlight specific structural features:
    - Corners (where two adjacent blue cells meet at a right angle) are now yellow (4)
    - Intersections (where three or more blue cells meet) are now red (2)
    - Endpoints (where a blue line terminates) are now yellow (4)
