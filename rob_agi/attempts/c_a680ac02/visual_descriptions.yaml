  output: |
    The output grid is 8x4 in size. It contains two square outlines stacked vertically:
    1. A blue (1) square outline on top, 4x4 in size.
    2. A red (2) square outline on bottom, 4x4 in size.
    The interiors of both squares are filled with black (0).

example_2:
