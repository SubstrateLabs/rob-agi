example_0:
  input: |
    The input grid is 18x17 in size. It contains four distinct shapes:
    1. A red (2) square outline in the top-left corner, 5x5 in size.
    2. A yellow (4) square outline in the top-right corner, 5x5 in size.
    3. A green (3) solid square in the middle-left, 4x4 in size.
    4. A sky blue (8) solid square in the bottom-right, 4x4 in size.
    The rest of the grid is filled with black (0), which can be considered empty space.
  output: |
    The output grid is 4x8 in size. It contains two square outlines side by side:
    1. A red (2) square outline on the left, 4x4 in size.
    2. A yellow (4) square outline on the right, 4x4 in size.
    The interiors of both squares are filled with black (0).

example_1:
