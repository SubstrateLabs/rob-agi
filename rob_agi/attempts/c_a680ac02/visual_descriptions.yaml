example_0:
  input: |
    The input grid is 18x17 in size. It contains four distinct shapes:
    1. A red (2) square outline in the top-left corner, 5x5 in size. The outline is one cell thick with a black interior.
    2. A yellow (4) square outline in the top-right corner, 5x5 in size. The outline is one cell thick with a black interior.
    3. A green (3) solid square in the middle-left, 4x4 in size. This is not an outline.
    4. A sky blue (8) solid square in the bottom-right, 4x4 in size. This is not an outline.
    The rest of the grid is filled with black (0).
    Key observation: Only the red and yellow shapes are square outlines.
  output: |
    The output grid is 4x8 in size. It contains two square outlines side by side:
    1. A red (2) square outline on the left, 4x4 in size.
    2. A yellow (4) square outline on the right, 4x4 in size.
    Both outlines are one cell thick with black (0) interiors.
    Note: The outlines have been standardized to 4x4 size and arranged horizontally.

