example_0:
  input: |
    A 6x9 grid with a distinct vertical blue line (color 1) in the 5th column. To the left of this line is a pattern of yellow (4) and black (0) squares. The yellow squares form a rough L-shape along the left and top edges. To the right of the blue line, the grid is mostly black with a few scattered yellow squares.
  output: |
    A 6x4 grid composed entirely of sky blue (8) and black (0) squares. The sky blue squares form a distinct pattern that resembles the yellow pattern from the input, but more compact and shifted slightly. The black squares appear where there were gaps in the yellow pattern of the input.

