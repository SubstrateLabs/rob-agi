    1. Top section (blue, black): Blue squares forming a dense pattern on the left side and top-right corner.
    2. Middle section (sky blue, black): Sky blue squares forming two clusters, one in the top-left corner and one in the bottom-right corner.
    3. Bottom section (magenta, black): Magenta squares forming a dense pattern, mostly concentrated on the bottom half of the grid.
  output: |
    The output grid is 5x5. It combines elements from all three input sections:
