example_0:
  input: |
    A 22x12 grid with sparse colored elements:
    - Red (2): Single cell at (3, 0)
    - Green (3): Three vertical lines at columns 6, 13, 20, each 3 cells tall (rows 2-4)
    - Blue (1): Two vertical lines at columns 9, 17 (rows 3-5), and a single cell at (2, 20)
    - Black (0): All other cells
    Key observations:
    - Colored elements form a rough horizontal line
    - Large empty spaces between colored elements
    - Some colored elements touch the grid edge (left and top)
  output: |
    Same 22x12 grid with original elements preserved and new red (2) cells added:
    - Original red cell acts as the root of the tree structure
    - Horizontal red line at row 3 connects all vertical colored lines
    - Vertical red lines extend from horizontal line to all colored cells
    - Red path extends to top-right blue cell
    - No diagonal connections
    - Red structure touches left and top edges where colored cells were present
    Key transformations:
    - Minimal red paths connect all non-black cells
    - Tree-like structure with clear "trunk" and "branches"
    - Red cells only added where necessary for connectivity

example_1:
  input: |
    A 12x22 grid with scattered colored elements:
    - Red (2): Single cell at (0, 3)
    - Blue (1): Multiple horizontal lines, each 3 cells wide, at rows 5, 7, 9
    - Green (3): Multiple horizontal lines, each 3 cells wide, at rows 2, 6, 12, 15, 17, 19
    - Black (0): All other cells
    Key observations:
    - Colored elements spread across the grid vertically
    - Some colored lines are disconnected (e.g., blue line in row 9)
    - Large empty spaces between colored elements
    - Some colored elements touch the grid edge (top)
  output: |
    Same 12x22 grid with original elements preserved and new red (2) cells added:
    - Vertical red "trunk" on the left side connects all horizontal colored lines
    - Horizontal red "branches" extend from trunk to each colored element
    - Red paths extend to right edge where colored elements are near
    - Original red cell at top integrated into the structure
    Key transformations:
    - Minimal red network connects all non-black cells
    - Clear tree-like structure with main trunk and branches
    - Red cells only added where necessary for connectivity
    - Structure adapts to the vertical spread of colored elements

example_2:
  input: |
    A 12x22 grid with scattered colored elements:
    - Red (2): Single cell at (0, 5)
    - Blue (1): Horizontal lines at rows 2, 4, 7, 11, 19, each 3 cells wide
    - Green (3): Horizontal lines at rows 6, 9, 14, 17, some spanning full width
    - Black (0): All other cells
    Key observations:
    - Colored elements spread across the grid, more dense on left
    - Some green lines span the entire grid width
    - Large empty spaces between some colored elements
    - Some colored elements touch the grid edges (top, left, right)
  output: |
    Same 12x22 grid with original elements preserved and new red (2) cells added:
    - Vertical red "trunk" slightly left of center connects all horizontal colored lines
    - Horizontal red "branches" extend from trunk to each colored element
    - Red paths reach both left and right edges where colored elements are near
    - Original red cell at top integrated into the structure
    Key transformations:
    - Minimal red network connects all non-black cells
    - Tree-like structure adapts to the distribution of colored elements
    - Red cells efficiently bridge large gaps between colored elements
    - Structure touches grid edges where original colors were present

example_3:
  input: |
    A 19x13 grid with colored elements in upper-left quadrant:
    - Red (2): Single cell at (3, 0)
    - Green (3): Three vertical lines at columns 3, 9, 12, each 3 cells tall (rows 2-4)
    - Blue (1): One vertical line at column 6, 3 cells tall (rows 3-5)
    - Black (0): All other cells
    Key observations:
    - Colored elements concentrated in top-left, rows 2-6 and columns 0-12
    - Large empty area in bottom-right
    - Some colored elements touch the grid edge (left)
  output: |
    Same 19x13 grid with original elements preserved and new red (2) cells added:
    - Horizontal red line at row 3 connects all vertical colored lines
    - Vertical red lines extend to connect all colored cells
    - Red path extends to right edge from rightmost green line
    - Red path extends to bottom edge from lowest point of the structure
    - Original red cell integrated into the structure
    Key transformations:
    - Minimal red network connects all non-black cells
    - Tree-like structure confined to upper-left quadrant where colors exist
    - Red paths extend to right and bottom edges
    - Efficient use of red cells, leaving large empty areas untouched

