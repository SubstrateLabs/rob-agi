example_0:
  input: |
    A 10x13 grid with mostly black (empty) space. There are several distinct shapes:
    1. A blue (1) L-shaped object in the middle-left, spanning rows 4-6 and columns 1-4.
    2. Two sky blue (8) dots vertically aligned in the upper-right corner, in rows 1-2, column 10.
    3. A red (2) horizontal line near the bottom, in row 8, spanning columns 5-7.
  output: |
    A compact 3x4 grid containing elements from the input:
    1. The top-left 2x2 area is red (2).
    2. The bottom-left 1x2 area is blue (1).
    3. The right column contains the two sky blue (8) dots at the top, with blue (1) below.

example_1:
  input: |
    A 10x12 grid with mostly black (empty) space. There are several distinct shapes:
    1. A red (2) T-shaped object in the upper-middle, spanning rows 2-4 and columns 4-6.
    2. A green (3) backwards L-shaped object in the lower-right, spanning rows 5-7 and columns 8-10.
    3. A single sky blue (8) dot in the left side, in row 6, column 1.
  output: |
    A compact 3x4 grid containing elements from the input:
    1. The left column is entirely red (2).
    2. The top row is red (2) followed by three green (3) squares.
    3. The middle-right 2x2 area is green (3).
    4. The bottom-left corner is sky blue (8).

example_2:
  input: |
    A 10x11 grid with mostly black (empty) space. There are several distinct shapes:
    1. A blue (1) cross-shaped object in the upper-left, spanning rows 1-3 and columns 3-5.
    2. A red (2) vertical line in the lower-right, spanning rows 5-8 and column 8.
    3. Two sky blue (8) dots: one in the middle (row 6, column 4) and one in the lower-left (row 8, column 1).
  output: |
    A compact 3x4 grid containing elements from the input:
    1. The top row is sky blue (8), blue (1), and two red (2) squares.
    2. The middle row is entirely blue (1).
    3. The bottom row repeats the pattern of the top row: sky blue (8), blue (1), and two red (2) squares.

