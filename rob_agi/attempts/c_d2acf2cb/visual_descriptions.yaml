example_0:
  input: |
    The grid is 9x7. The dominant color is magenta (6), forming several connected regions. There's a large magenta 'U' shape on the left side, with another magenta region on the right. Two yellow (4) squares are present in the bottom corners. Black (0) areas form gaps between the magenta regions, creating a pattern of spaces and filled areas.
  output: |
    The grid maintains its 9x7 size and overall structure. The magenta (6) regions remain unchanged in the upper 6 rows. The bottom row is identical to the input. The key change is in the second-to-last row: the previously magenta area is now filled with orange (7) and sky (8) colors. The orange forms a continuous line in the middle, flanked by sky color on both sides. The yellow (4) corners remain unchanged.

example_1:
  input: |
    The grid is 9x9. It has a complex pattern with alternating rows. Rows 1, 3, 5, 7, and 9 consist mainly of magenta (6) and black (0) in various arrangements. Rows 2, 5, and 8 are filled with yellow (4), orange (7), and sky (8) colors in different patterns. This creates a striped effect with 'solid' and 'patterned' rows alternating.
  output: |
    The 9x9 grid maintains its overall structure, but with significant changes. The odd-numbered rows (1, 3, 5, 7, 9) remain exactly the same as in the input. The even-numbered rows (2, 4, 6, 8) have been transformed. The colorful patterns in these rows have been replaced mostly with magenta (6) and black (0), mimicking the pattern of the odd rows. The yellow (4) corners in these rows remain unchanged.

example_2:
  input: |
    The grid is 6x9. It features a complex pattern of magenta (6) and black (0) areas, forming various shapes and lines. There are four yellow (4) squares positioned asymmetrically: two in the top row (4th and 8th columns) and two in the bottom row (4th and 8th columns, but offset from the top ones).
  output: |
    The 6x9 grid maintains its overall structure and the positions of the magenta (6) and black (0) areas remain unchanged. The key difference is the addition of sky (8) and orange (7) colors in previously black areas, primarily in the middle columns. These new colors form vertical lines or columns that connect the yellow (4) squares at the top and bottom. The sky color is used for the outer columns, while orange is used for the inner columns.

