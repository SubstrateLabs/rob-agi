example_0:
  input: |
    A 10x10 grid with a sky blue (8) square shape in the top left corner. The square is 3x3 in size, with its top-left corner at (1,1). The square has a hollow center, creating a "frame" effect. There's also a single sky blue pixel at (6,1). The rest of the grid is filled with black (0).
  output: |
    A 10x10 grid with the same sky blue (8) square shape, but it has been moved to the right by 3 spaces. The square is now centered horizontally in the top half of the grid, with its top-left corner at (1,4). The single sky blue pixel has moved one space to the right and is now at (6,2). The rest of the grid remains black (0).

example_1:
  input: |
    A 5x5 grid with a solid 2x2 sky blue (8) square in the top-left corner. The square occupies positions (1,0), (1,1), (2,0), and (2,1). The rest of the grid is black (0).
  output: |
    A 5x5 grid with the same 2x2 sky blue (8) square, but it has been moved two spaces to the right. The square now occupies positions (1,2), (1,3), (2,2), and (2,3). The rest of the grid remains black (0).

example_2:
  input: |
    A 12x12 grid with multiple sky blue (8) shapes. In the top-left quadrant, there's a complex shape resembling an irregular 'E'. It starts at (1,1) and spans 4 rows and 4 columns. Below this, at (8,4) and (9,4), there's a 2x2 sky blue square. The rest of the grid is black (0).
  output: |
    A 12x12 grid with the same sky blue (8) shapes, but they have been moved to the right. The irregular 'E' shape has been moved 4 spaces to the right, now starting at (1,5). The 2x2 square below has been moved 2 spaces to the right, now at (8,6) and (9,6). The rest of the grid remains black (0).