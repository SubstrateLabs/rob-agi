example_0:
  input: |
    The input grid shows two distinct C-shaped objects made of red (2) squares. The first C is in the top-left quadrant, spanning rows 2-4 and columns 2-4. It has a gray (5) square in its center. The second C is in the bottom-right quadrant, spanning rows 10-12 and columns 11-13. It also has a gray (5) square, but this one is positioned on the right side of the C. The rest of the grid is filled with black (0) squares, representing empty space.
  output: |
    The output grid maintains the two C-shaped red objects in their original positions. However, the space between them is now filled with yellow (4) squares, creating a rectangular yellow area that connects the two C shapes. This yellow area extends from the bottom of the upper C to the top of the lower C, and from the left edge of the upper C to the right edge of the lower C. The gray squares inside the C shapes remain unchanged. The rest of the grid outside this connected structure remains black (0).

example_1:
