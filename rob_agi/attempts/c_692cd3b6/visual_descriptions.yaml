  output: |
    The output grid keeps the two C-shaped red objects in their original positions. A yellow (4) area is added, connecting the two C shapes. This yellow area extends horizontally from the left edge of the bottom-left C to the right edge of the top-right C, and vertically from the bottom of the top-right C to the top of the bottom-left C. The yellow area also fills in the open part of the top-right C. The gray squares inside the C shapes remain unchanged. The rest of the grid outside this connected structure stays black (0).

example_2:
