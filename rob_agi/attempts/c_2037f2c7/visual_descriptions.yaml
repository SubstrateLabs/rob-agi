example_0:
  input: |
    The input grid is 25x23 in size. It contains two distinct, symmetrical shapes resembling stylized flowers or stars.

    Key characteristics:
    1. Color palette: Yellow (4), magenta (6), green (3), and red (2) on a black (0) background.
    2. Shape structure: Central column of magenta (6) surrounded by yellow (4), with alternating green (3) and red (2) "petals".
    3. Shape distribution: One smaller shape in the top-right quadrant, one larger shape occupying the left half (rows 5-19).
    4. Symmetry: Both shapes have vertical and horizontal symmetry.
    5. Density: Moderate, with significant black space between and around shapes.
    6. Complexity: Medium, with distinct color layers and repeated patterns within each shape.

  output: |
    The output grid is a highly abstracted representation, 3x7 in size, using only sky blue (8) and black (0).

    Key features:
    1. Size reduction: Significant downsizing from 25x23 to 3x7.
    2. Color simplification: Only uses sky blue (8) and black (0).
    3. Shape abstraction: Creates a silhouette-like pattern suggesting the input's symmetry and central structure.
    4. Layout:
       - Top row:    8,0,0,0,0,0,8
       - Middle row: 8,8,0,0,0,8,8
       - Bottom row: 8,0,0,0,0,0,8
    5. Symmetry: Maintains vertical symmetry from the input.
    6. Central emphasis: Wider middle row reflects the central importance of the shapes in the input.

example_1:
  input: |
    The input grid is 25x25, featuring two distinct shapes resembling stylized rockets or missiles.

    Key characteristics:
    1. Color palette: Yellow (4), magenta (6), blue (1), green (3), orange (7), and red (2) on a black (0) background.
    2. Shape distribution: Smaller shape in upper-left quadrant (rows 2-9), larger shape in bottom-right quadrant (rows 9-20).
    3. Shape structure: Vertical orientation with pointed top (magenta), long body (yellow), and fin-like base.
    4. Asymmetry: While individual shapes have some symmetry, their placement and size differences create overall asymmetry.
    5. Complexity: High, with multiple colors and intricate details in each shape.
    6. Vertical emphasis: Both shapes are vertically oriented and span multiple rows.

  output: |
    The output grid is an abstract representation, 4x8 in size, using only sky blue (8) and black (0).

    Key features:
    1. Size reduction: Significant downsizing from 25x25 to 4x8.
    2. Color simplification: Only uses sky blue (8) and black (0).
    3. Shape abstraction: Creates a pattern suggesting vertical orientation and asymmetry of the input.
    4. Layout:
       - Row 1: 0,8,0,0,0,0,8,8
       - Row 2: 8,8,8,8,0,8,8,8
       - Row 3: 0,0,8,0,0,0,0,8
       - Row 4: 0,0,0,0,0,0,0,8
    5. Asymmetry: Reflects the input's asymmetry with an uneven distribution of sky blue squares.
    6. Vertical emphasis: Maintains a column-like structure, especially on the right side.

example_2:
  input: |
    The input grid is 22x22, containing two shapes resembling stylized hourglasses or vases.

    Key characteristics:
    1. Color palette: Green (3), yellow (4), orange (7), and red (2) on a black (0) background.
    2. Shape distribution: One shape in upper-left quadrant (rows 3-11), one in bottom-right quadrant (rows 12-20).
    3. Shape structure: Symmetrical hourglass form with a narrow middle, wider top and bottom.
    4. Color layering: Green outer layers, yellow inner layers, orange center.
    5. Asymmetry: Second shape (bottom-right) is incomplete or asymmetrical in its lower part.
    6. Vertical symmetry: Both shapes have clear vertical symmetry.

  output: |
    The output grid is a highly simplified representation, 2x6 in size, using only sky blue (8) and black (0).

    Key features:
    1. Size reduction: Dramatic downsizing from 22x22 to 2x6.
    2. Color simplification: Only uses sky blue (8) and black (0).
    3. Shape abstraction: Creates a minimal pattern suggesting the hourglass form.
    4. Layout:
       - Row 1: 8,8,8,0,8,8
       - Row 2: 0,0,8,0,0,0
    5. Vertical emphasis: The single column in the bottom row suggests the narrow middle of the hourglass.
    6. Asymmetry: The pattern is not perfectly symmetrical, possibly reflecting the asymmetry in the input's second shape.

