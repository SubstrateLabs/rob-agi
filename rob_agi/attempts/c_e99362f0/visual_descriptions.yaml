example_0:
  input: |
    An 11x9 grid with a distinct vertical yellow (4) line in the middle. On the left side, there's a concentration of orange (7) in the top-left corner, with some black (0) spaces. Red (2) is present in the bottom-left. On the right side, there's brown (9) in the upper portion and sky blue (8) in the lower-right corner. The yellow line divides the grid into two clear halves.
  output: |
    A 5x4 grid with a mix of colors. The top-left corner is orange (7), while the top-right has brown (9) and sky blue (8). The bottom-left has black (0) and orange (7), and the bottom-right has sky blue (8) and red (2). The colors seem to be distributed to reflect the general layout of the input grid, but in a more compact form.

