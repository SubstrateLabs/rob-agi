example_0:
  input: |
    A 21x16 grid with mostly black (0) background. Four distinct colored shapes are present:
    1. Sky blue (8) shape in the top-left quadrant: A complete cross or plus sign, not touching any edges.
    2. Red (2) shape in the top-right quadrant: An irregular T or hammer, touching the top edge.
    3. Orange (7) shape in the middle-right: A distorted H or two connected rectangles, not touching any edges.
    4. Magenta (6) shape in the bottom-right: An irregular cross, touching the bottom edge.
    All shapes are separated by black space and do not touch each other.
  output: |
    A 4x5 grid showing only the sky blue (8) cross shape from the input. This shape is complete, centered, and surrounded by black (0) background, demonstrating it was the first non-edge-touching shape encountered.

example_1:
  input: |
    A 22x17 grid with a black (0) background. Five distinct colored shapes are visible:
    1. Red (2) shape in the top-left: A heart or strawberry, touching the top edge.
    2. Green (3) shape in the middle-right: A distorted star or flower, not touching any edges.
    3. Yellow (4) shape on the left side: A vertical rectangle with protrusions, touching the left edge.
    4. Blue (1) shape in the bottom-center: A diamond or kite, not touching any edges.
    5. A single sky blue (8) pixel in the top-right corner, touching the top and right edges.
    All shapes are separated by black space.
  output: |
    A 6x7 grid containing only the blue (1) diamond or kite shape from the input. This shape is complete, centered, and surrounded by black (0) background, indicating it was the first non-edge-touching shape encountered.

example_2:
  input: |
    A 21x19 grid with a black (0) background. Five distinct colored shapes are present:
    1. Magenta (6) shape in the top-left: An irregular T or hammer, not touching any edges.
    2. Green (3) shape in the top-right: A distorted star or flower, touching the top edge.
    3. Blue (1) shape in the middle: A butterfly or bow tie, touching the left edge.
    4. Orange (7) shape in the middle-right: A small L or corner, not touching any edges but very close to the right edge.
    5. Yellow (4) shape at the bottom: A goblet or chalice, touching the bottom edge.
    All shapes are separated by black space.
  output: |
    A 3x5 grid showing only the magenta (6) irregular T or hammer shape from the input. This shape is complete, centered, and surrounded by black (0) background, demonstrating it was the first non-edge-touching shape encountered.

