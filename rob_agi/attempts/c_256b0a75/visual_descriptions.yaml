example_0:
  input: |
    A 23x21 grid mostly filled with black (0). There are scattered colored squares:
    - A yellow (4) square in the top right quadrant
    - A green (3) square in the left side, about 1/5 down
    - A magenta (6) square slightly right of center, about 1/5 down
    - Two red (2) squares in the left side, about 1/3 down
    - Four sky (8) squares forming a small square shape slightly right of center, about 1/3 down
    - An orange (7) square slightly right of center, about halfway down
    - Another yellow (4) square on the left side, about halfway down
    - Two orange (7) squares forming a horizontal line slightly left of center, about 2/3 down
    - Three sky (8) squares forming an L shape slightly right of center, about 2/3 down
    - A brown (9) square on the right side, about 2/3 down
    - A blue (1) square slightly right of center, near the bottom
    - Another blue (1) square on the left side, at the bottom
    - Another brown (9) square on the right side, near the bottom
  output: |
    The grid is transformed with large colored regions:
    - A vertical orange (7) stripe runs down the center, widening at the top and bottom
    - Two vertical sky (8) stripes flank the orange stripe in the middle third of the grid
    - A horizontal red (2) stripe runs across the top left corner
    - A yellow (4) region fills the top left corner
    - A magenta (6) dot is embedded in the orange region near the top
    - A green (3) dot is in the top left, just below the red stripe
    - Two brown (9) dots are on the right side, one about 2/3 down and one near the bottom
    - A vertical blue (1) stripe runs down the right side of the bottom third of the grid
    The rest of the grid remains black (0)

