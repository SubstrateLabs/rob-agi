example_0:
  input: |
    The 25x17 grid is divided into a 4x3 arrangement of 5x5 cells, separated by black (0) rows and columns.
    Each 5x5 cell contains a 3x3 pattern of colored squares surrounded by black.
    Colors used: black (0), blue (1), sky blue (8).
    
    Pattern distribution:
    - Top row: blue frame, sky blue square, blue with missing corners
    - Middle row: All blue patterns (frame, solid, with missing corners)
    - Bottom row: Mirrors top row, with patterns in different positions
    
    Key observations:
    - Symmetry between top and bottom rows
    - Central sky blue square
    - Consistent 3x3 pattern size within 5x5 cells
  output: |
    Grid structure and size remain unchanged.
    Colors used: black (0), blue (1), orange (7), sky blue (8).
    
    Key transformations:
    1. Sky blue square moved diagonally (center-top to top-right)
    2. Blue patterns alternate with orange:
       - Top-left blue frame becomes orange
       - Top-right blue pattern becomes orange
       - Middle row alternates blue-orange-blue
       - Bottom row mirrors top row's color changes
    3. Black squares and overall symmetry preserved

example_1:
