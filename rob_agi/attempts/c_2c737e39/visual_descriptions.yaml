example_0:
  input: |
    A small, asymmetrical pattern is visible in the top-left corner of the grid. The pattern consists of:
    - A vertical green (3) line of two squares
    - A blue (1) square on each side of the green line's top
    - Two yellow (4) squares below the left blue square
    - A gray (5) square to the right of the yellow squares
    - An orange (7) square below the gray square
    - A red (2) square to the right of the orange square
    The rest of the grid is mostly black (0), with a single isolated gray (5) square in the bottom-left quadrant.
  output: |
    The original pattern from the top-left corner is duplicated and shifted down and to the right. The duplicate pattern is positioned so that its top-left corner is at row 5, column 6. The duplicate pattern is identical to the original except for the omission of the gray (5) square.
    The isolated gray square from the input has been removed.
    The rest of the grid remains black (0).

example_1:
  input: |
    A small, rectangular pattern is visible in the top-left quadrant of the grid. The pattern consists of:
    - Two green (3) squares side by side at the top
    - Two red (2) squares directly below the green squares
    - Another red (2) square below the left red square
    - A gray (5) square to the right of the bottom red square
    The rest of the grid is mostly black (0), with a single isolated gray (5) square in the bottom-left quadrant.
  output: |
    The original pattern from the top-left quadrant is duplicated and shifted down and to the right. The duplicate pattern is positioned so that its top-left corner is at row 6, column 6. The duplicate pattern is identical to the original except for the omission of the gray (5) square.
    The isolated gray square from the input has been removed.
    The rest of the grid remains black (0).

example_2:
  input: |
    A small, asymmetrical pattern is visible in the top-left quadrant of the grid. The pattern consists of:
    - A vertical blue (1) line of two squares
    - Another blue (1) square to the right of the top blue square
    - A gray (5) square below the right blue square
    - Two red (2) squares, one below the gray square and one to its right
    - A green (3) square to the right of the bottom-right red square
    The rest of the grid is mostly black (0), with a single isolated gray (5) square in the left side of the grid, about halfway down.
  output: |
    The original pattern from the top-left quadrant is duplicated and shifted down and to the left. The duplicate pattern is positioned so that its top-left corner is at row 4, column 2. The duplicate pattern is identical to the original except for the omission of the gray (5) square.
    The isolated gray square from the input has been removed.
    The rest of the grid remains black (0).