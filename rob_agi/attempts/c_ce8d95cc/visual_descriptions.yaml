example_0:
  input: |
    An 11x10 grid with three vertical lines: two thin lines (sky blue and magenta) and one thick green line. The sky blue line is at column 3, the magenta line at column 8, and the thick green line spans columns 1-3. The green line is interrupted by two horizontal lines: one at row 1 (green) and another at row 6 (gray). These horizontal lines extend across the entire width of the grid.
  output: |
    A 5x5 grid that appears to be a condensed version of the input. It retains the essential structure: two vertical lines (sky blue and magenta) and the thick green line, now reduced to a single column. The horizontal green and gray lines are preserved, each occupying a single row. The grid is effectively a simplified representation of the key elements from the input.

example_1:
  input: |
    A 12x11 grid featuring three vertical lines: blue (column 2), sky blue (column 5), and green (column 7). There are two horizontal lines: a red line at row 3 and an orange line at row 9. These horizontal lines span the entire width of the grid. The rest of the grid is filled with black (empty space).
  output: |
    A 5x7 grid that maintains the core structure of the input. The three vertical lines (blue, sky blue, green) are preserved, each occupying a single column. The two horizontal lines (red and orange) are also kept, each taking up a single row. The grid effectively condenses the input while retaining its key visual elements.

example_2:
  input: |
    A 12x9 grid with a single yellow vertical line in the third column. There are two horizontal lines: a green line at row 4 and a sky blue line at row 9. These horizontal lines span the entire width of the grid. The rest of the grid is black (empty space).
  output: |
    A 5x3 grid that simplifies the input to its essential elements. The yellow vertical line is preserved in the middle column. The two horizontal lines (green and sky blue) are retained, each occupying a single row. The grid effectively represents a minimized version of the input, focusing on the key structural components.

example_3:
  input: |
    An 12x11 grid with two vertical lines: green (column 2) and blue (column 7). There are three horizontal lines: orange (row 1), red (row 6), and sky blue (row 10). All these lines span the full width or height of the grid. The rest is black (empty space).
  output: |
    A 7x5 grid that maintains the core structure of the input. The two vertical lines (green and blue) are preserved, each in its own column. The three horizontal lines (orange, red, and sky blue) are also kept, each occupying a single row. The grid effectively condenses the input while retaining all its key visual elements in a more compact form.