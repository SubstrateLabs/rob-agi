example_0:
  input: |
    A 15x15 grid with mostly black (0) squares. Colored squares are:
    - Magenta (6): (0,5) and (4,0)
    - Gray (5): (0,6)
    - Green (3): (0,7) and (2,14)
    Key observations:
    - Each color appears at least twice, except for gray
    - The topmost occurrence of each color is in the first row
    - Colors are disconnected and spread across the grid
  output: |
    The 15x15 grid now has lines connecting same-colored squares:
    - Magenta (6): Vertical line from (0,5) to (4,0)
    - Gray (5): Vertical line from (0,6) to the bottom row
    - Green (3): Vertical line from (0,7) to row 2, then horizontal to (2,14)
    Key transformations:
    - Lines start from the topmost occurrence of each color
    - Vertical lines extend to the bottom or until they reach another square of the same color
    - Horizontal lines in the bottom row connect disconnected squares
    - Lines do not overwrite existing colored squares or other lines

example_1:
  input: |
    A 12x12 grid with mostly black (0) squares. Colored squares are:
    - Gray (5): (0,4) and (4,0)
    - Green (3): (0,5) and (8,0)
    - Sky blue (8): (0,6) and (5,11)
    Key observations:
    - Each color appears exactly twice
    - The topmost occurrence of each color is in the first row
    - Colors are disconnected and spread across edges and corners
  output: |
    The 12x12 grid now has lines connecting same-colored squares:
    - Gray (5): Vertical line from (0,4) to row 4, then horizontal to (4,0)
    - Green (3): Vertical line from (0,5) to (8,0)
    - Sky blue (8): Vertical line from (0,6) to row 5, then horizontal to (5,11)
    Key transformations:
    - Lines prioritize vertical movement before horizontal
    - Horizontal lines only appear in the row of the lower square
    - The minimum number of line segments are used for each color

example_2:
  input: |
    An 11x11 grid with mostly black (0) squares. Colored squares are:
    - Yellow (4): (0,3) and (4,0)
    - Magenta (6): (0,4) and (9,10)
    - Red (2): (0,5) and (4,10)
    Key observations:
    - Each color appears exactly twice
    - All colors start in the top row but end in different rows
    - Colors are maximally spread out (corners and edges)
  output: |
    The 11x11 grid now has lines connecting same-colored squares:
    - Yellow (4): Vertical line from (0,3) to row 4, then horizontal to (4,0)
    - Magenta (6): Vertical line from (0,4) to (9,10)
    - Red (2): Vertical line from (0,5) to row 4, then horizontal to (4,10)
    Key transformations:
    - Vertical lines always start from the top occurrence
    - Horizontal lines are only drawn in the row of the lower square
    - Lines take the shortest path while adhering to the vertical-then-horizontal rule

