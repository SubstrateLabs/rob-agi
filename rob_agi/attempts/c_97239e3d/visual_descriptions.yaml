example_0:
  input: |
    A 17x17 grid with a predominantly black background. There are sky-colored (8) squares forming a pattern of 3x3 blocks separated by black spaces. These blocks are arranged in a 4x4 grid, with black spaces between them. There are two red (2) squares: one in the top-left corner and one in the middle of the 9th row, 13th column.
  output: |
    The grid maintains its 17x17 size. The top-left quadrant (8x8) is now filled with red (2), except for the rightmost column and bottom row which remain unchanged. The sky-colored (8) pattern within this quadrant is preserved but now has red squares where black ones were. The rest of the grid remains unchanged from the input.

example_1:
