example_0:
  input: |
    A 17x17 grid divided into four 8x8 quadrants, with the 17th row and column as borders.
    Background: Predominantly black (0).
    Pattern: 4x4 arrangement of 3x3 sky-colored (8) blocks, separated by black spaces.
    Special squares: Two red (2) squares - one at (0,0) in the top-left quadrant, another at (8,12) in the bottom-right quadrant.
    Note: The 17th row and column are entirely black.
  output: |
    Grid structure: Maintains 17x17 size with four 8x8 quadrants and black 17th row/column border.
    Changed area: Top-left 8x8 quadrant filled with red (2), preserving sky-colored (8) pattern.
    Unchanged areas: Other three quadrants and the 17th row/column remain as in the input.
    Key observation: Only the quadrant containing the top-left red square was affected.

example_1:
  input: |
    17x17 grid with four 8x8 quadrants and black 17th row/column border.
    Background and pattern: Same as example_0.
    Special squares: 
      - Magenta (6): at (0,4) in top-left quadrant and (4,16) in top-right quadrant.
      - Blue (1): at (16,0) in bottom-left corner.
    Note: The special blue square is in the 17th row, outside the main quadrants.
  output: |
    Grid structure: Maintains 17x17 size with four 8x8 quadrants and black 17th row/column border.
    Changed areas:
      - Top-right 8x8 quadrant filled with magenta (6), preserving sky pattern.
      - Bottom-left 8x8 quadrant filled with blue (1), preserving sky pattern.
    Unchanged areas: Top-left quadrant, bottom-right quadrant, and 17th row/column.
    Key observation: Quadrant expansion prioritizes top-right over bottom-left.

example_2:
  input: |
    17x17 grid with four 8x8 quadrants and black 17th row/column border.
    Background and pattern: Same as previous examples.
    Special squares:
      - Orange (7): at (0,12) in top-right quadrant and (3,16) in the 17th column.
      - Green (3): at (8,1) in bottom-left quadrant and (11,11) in bottom-right quadrant.
    Note: One orange square is in the 17th column, outside the main quadrants.
  output: |
    Grid structure: Maintains 17x17 size with four 8x8 quadrants and black 17th row/column border.
    Changed areas:
      - Top-right 8x8 quadrant filled with orange (7), preserving sky pattern.
      - Bottom-left 8x8 quadrant filled with green (3), preserving sky pattern.
    Unchanged areas: Top-left quadrant, bottom-right quadrant, and 17th row/column.
    Key observations: 
      - Expansion priority: top-right, then bottom-left.
      - Special squares in 17th row/column don't trigger expansion.

