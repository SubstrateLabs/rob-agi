example_0:
  input: |
    An 18x17 grid with scattered colored squares. Notable features:
    - A 3x3 square of sky blue (8) in the center-left, rows 5-7, columns 6-8
    - A 3x3 square of orange (7) in the bottom-right, rows 11-13, columns 13-15
    - Single orange (7) squares in the top-left and bottom-right corners
    - Several brown (9) squares scattered around
    - A few red (2) squares in the bottom half
    - Single blue (1) and yellow (4) squares in the middle rows
    - A gray (5) square in the left column
    - Mostly empty (black) space
  output: |
    The 18x17 grid is transformed with new features:
    - Two vertical lines: sky blue (8) in column 7, orange (7) in column 13
    - Two horizontal lines: sky blue (8) in row 5, orange (7) in row 11
    - The original 3x3 squares of sky blue and orange are preserved
    - All other original colored squares are preserved
    - The vertical and horizontal lines only overwrite black (empty) spaces or lower-numbered colors

