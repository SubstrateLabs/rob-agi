    3. Bottom-left (rows 10-12, columns 3-5): Predominantly red (2) with some green (3).
    4. Bottom-right (rows 9-11, columns 7-9): Mix of blue (1) and orange (7).
  output: |
    A 3x3 grid extracted from the top-left region of the input. It contains:
