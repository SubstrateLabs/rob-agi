example_0:
  input: |
    A 15x15 grid with mostly black (empty) space. There are four distinct 3x3 colored regions:
    1. Top-left (rows 2-4, columns 2-4): Predominantly brown (9) with some sky blue (8).
    2. Top-right (rows 2-4, columns 8-10): Mix of orange (7) and yellow (4).
    3. Bottom-left (rows 9-11, columns 2-4): Mix of green (3) and magenta (6).
    4. Bottom-right (rows 7-9, columns 8-10): Mix of blue (1), red (2), and green (3).
  output: |
    A 3x3 grid extracted from the bottom-right region of the input. It contains:
    - 5 blue (1) squares
    - 2 red (2) squares
    - 2 green (3) squares
    Arranged in a specific pattern.

example_1:
