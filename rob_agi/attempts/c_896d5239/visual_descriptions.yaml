example_0:
  input: |
    A 13x12 grid with a mix of black (0), blue (1), and green (3) squares. The green squares are sparsely distributed, appearing in 7 locations: (2,4), (3,3), (3,5), (4,2), (4,6), (9,5), (9,6), (10,3), and (11,2). Blue squares form irregular patterns throughout the grid. Black squares fill the remaining spaces, creating a somewhat random appearance.
  output: |
    The grid maintains its 13x12 size and preserves the original positions of blue (1) and green (3) squares. The significant change is the addition of sky blue (8) squares forming rectangles. These rectangles are bounded by green squares at their corners. The largest sky blue rectangle is 6x6, located in the bottom right corner. Two smaller sky blue rectangles appear: a 3x3 in the top left quadrant and a 2x2 in the middle right area. The rest of the grid remains unchanged from the input.

