example_0:
  input: |
    A 9x9 grid with a horizontal gray line (color 5) in the middle (row 5). There are two vertical lines: a red line (color 2) in the third column, and a yellow line (color 4) in the seventh column. The red line spans 2 squares above the gray line and 2 squares below. The yellow line spans 2 squares above the gray line and 4 squares below. The rest of the grid is filled with black (color 0).
  output: |
    A 2x2 grid filled entirely with yellow (color 4).

