example_0:
  input: |
    A 9x9 grid with the following key features:
    - Horizontal gray line (color 5) in row 5
    - Red vertical line (color 2) in column 3, spanning 2 squares above and 2 below the gray line
    - Yellow vertical line (color 4) in column 7, spanning 2 squares above and 4 below the gray line
    - All other cells are black (color 0)
  output: |
    A 2x2 grid filled entirely with yellow (color 4), as the yellow line has more squares below the gray line.

example_1:
  input: |
    A 9x9 grid with the following key features:
    - Horizontal gray line (color 5) in row 5
    - Red vertical line (color 2) in column 3, spanning 2 squares above and 4 below the gray line
    - Yellow vertical line (color 4) in column 7, spanning 2 squares above and 4 below the gray line
