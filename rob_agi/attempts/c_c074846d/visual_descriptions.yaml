example_0:
  input: |
    A 5x7 grid mostly filled with black (0). There's a horizontal red line (2) in the middle row (row 3), spanning 2 cells. Immediately to the right of this red line is a single gray cell (5).
  output: |
    The same 5x7 grid, mostly black (0). The horizontal red line has been replaced by a green line (3) of the same length. A new vertical red line (2) has appeared, extending upwards from the gray cell for 2 cells.

example_1:
  input: |
    A 6x7 grid, mostly black (0). There's a horizontal red line (2) in the fourth row, spanning 3 cells. Immediately to the right of this red line is a single gray cell (5).
  output: |
    The same 6x7 grid, mostly black (0). The horizontal red line has been replaced by a green line (3) of the same length. A new vertical red line (2) has appeared, extending upwards from the gray cell for 3 cells, reaching the top of the grid.

example_2:
  input: |
    A 7x7 grid, mostly black (0). There's a single red cell (2) in the third row, fourth column. Directly below it, in the fourth row, fourth column, is a single gray cell (5).
  output: |
    The same 7x7 grid, mostly black (0). The original red cell has been replaced by a green cell (3). A new red cell (2) has appeared to the right of the gray cell, in the fourth row, fifth column.

example_3:
  input: |
    A small 3x3 grid. The middle row contains a gray cell (5) followed by a red cell (2) from left to right. The rest is black (0).
  output: |
    The same 3x3 grid. The red cell in the middle row has been replaced by a green cell (3). A new red cell (2) has appeared directly below the green cell, in the bottom-right corner of the grid.

example_4:
  input: |
    A 7x7 grid, mostly black (0). In the fifth row, fifth column, there's a gray cell (5). Below it, in the sixth and seventh rows, fifth column, there are two red cells (2) forming a vertical line.
  output: |
    The same 7x7 grid, mostly black (0). The original vertical red line has been replaced by a green line (3) of the same length. A new horizontal red line (2) has appeared, extending to the left from the gray cell for 2 cells in the fifth row.

