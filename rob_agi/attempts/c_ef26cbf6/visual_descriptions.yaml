example_0:
  input: |
    The grid is 7x11 in size. There are three vertical yellow (4) lines dividing the grid into four columns. The middle two yellow lines are complete from top to bottom, while the outer two are interrupted. There's a horizontal yellow line in the middle of the grid, creating two distinct sections.

    In the top section:
    - The first column has a single green (3) square in the second row.
    - The second column has a single red (2) square in the second row.
    - The fourth column has a single magenta (6) square in the second row.

    In the bottom section:
    - There's a pattern of blue (1) squares forming an incomplete 'L' shape in the first column and an inverted 'L' shape in the fourth column.
    - The second and third columns have some scattered blue squares.

    The rest of the grid is filled with black (0) squares, which can be considered as empty space.

  output: |
    The grid structure remains the same as the input, with the yellow (4) lines unchanged.

    The key differences are in the bottom section:
    - The blue (1) squares in the first column have been replaced with green (3), matching the color of the single square in the top section of this column.
    - The scattered blue squares in the second column have been replaced with red (2), matching the color of the single square in the top section of this column.
    - The blue squares in the fourth column have been replaced with magenta (6), matching the color of the single square in the top section of this column.

    The top section remains unchanged. All other squares that were black (0) in the input remain black in the output.

example_1:
  input: |
    The grid is 11x7 in size. There are two vertical yellow (4) lines dividing the grid into three columns. These yellow lines run the full height of the grid. There are also two horizontal yellow lines, dividing the grid into three rows.

    In the top section:
    - The first column has a single orange (7) square in the second row.
    - The third column has two blue (1) squares in the second row.

    In the middle section:
    - The first column has a single green (3) square in the second row.
    - The third column has three blue (1) squares forming an 'L' shape.

    In the bottom section:
    - The first column has a single sky blue (8) square in the second row.
    - The third column has three blue (1) squares, two in the second row and one in the third row.

    The rest of the grid is filled with black (0) squares, which can be considered as empty space.

  output: |
    The grid structure remains the same as the input, with the yellow (4) lines unchanged.

    The key differences are in the colored squares:
    - In the top section, the two blue (1) squares in the third column have been replaced with orange (7), matching the color of the single square in the first column of this section.
    - In the middle section, the three blue (1) squares in the third column have been replaced with green (3), matching the color of the single square in the first column of this section.
    - In the bottom section, the three blue (1) squares in the third column have been replaced with sky blue (8), matching the color of the single square in the first column of this section.

    All other squares that were black (0) in the input remain black in the output.