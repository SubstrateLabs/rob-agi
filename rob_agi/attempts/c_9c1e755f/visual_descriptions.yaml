example_0:
  input: |
    A 10x10 grid with mostly black (0) background. There's a vertical gray (5) line of 4 squares in the 3rd column, starting from row 3. In row 5, there's a horizontal line to the right of the gray line: 3 magenta (6) squares followed by 3 brown (9) squares.
  output: |
    A 10x10 grid with mostly black (0) background. The vertical gray (5) line remains in the 3rd column but is now 4 squares long. The horizontal line that was in row 5 is now repeated in rows 2, 3, 4, and 5, creating a rectangular shape: 3 magenta (6) squares followed by 3 brown (9) squares in each row.

example_1:
  input: |
    A 10x10 grid with mostly black (0) background. There's a vertical gray (5) line along the left edge, 8 squares long. In row 8, there's a horizontal pattern to the right of the gray line: gray (5), yellow (4), green (3), green (3), yellow (4), yellow (4), yellow (4). In row 9, there's another horizontal pattern: gray (5), orange (7), green (3), orange (7), orange (7), green (3), green (3).
  output: |
    A 10x10 grid with mostly black (0) background. The vertical gray (5) line remains along the left edge, 8 squares long. The horizontal patterns from rows 8 and 9 in the input are now repeated alternately in rows 1 through 8, creating a striped rectangular shape next to the gray line.

example_2:
  input: |
    A 10x10 grid with mostly black (0) background. In row 2, there's a horizontal gray (5) line of 6 squares. Below this, in column 2, there's a vertical line of different colors: red (2), blue (1), red (2), magenta (6), blue (1), blue (1).
  output: |
    A 10x10 grid with mostly black (0) background. The horizontal gray (5) line in row 2 remains unchanged. The vertical line of different colors in column 2 is now expanded horizontally to match the width of the gray line above it, creating a rectangular shape of 6 columns wide, each column filled with its respective color.

example_3:
  input: |
    A 10x10 grid with a complex pattern. There's a vertical gray (5) line along the left edge, 8 squares long. In the top right, there's a horizontal gray (5) line of 4 squares. Below this gray line, there's a vertical pattern: green (3), green (3), orange (7), green (3), orange (7), orange (7). In rows 8 and 9, there's a horizontal pattern next to the left gray line: magenta (6), green (3), magenta (6), green (3) in row 8, and red (2), red (2), red (2), red (2) in row 9.
  output: |
    A 10x10 grid with the pattern expanded. The vertical gray (5) line along the left edge remains unchanged. The horizontal gray (5) line in the top right also remains. The vertical pattern below the top-right gray line is now expanded horizontally to fill the space, creating a rectangular shape. The horizontal patterns from rows 8 and 9 are now repeated vertically, filling the space between the left gray line and the expanded right-side pattern.

