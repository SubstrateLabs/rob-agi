example_0:
  input: |
    The grid is 20x16. There are several distinct shapes visible:
    1. In the top left, there's an orange (7) L-shaped object.
    2. Below that, there's a blue (1) shape that resembles a distorted 'E'.
    3. In the middle right, there's another orange (7) L-shaped object.
    4. In the bottom right quadrant, there's a blue (1) shape that looks like a distorted 'F'.
    The rest of the grid is filled with black (0), which can be considered empty space.
  output: |
    The grid maintains its 20x16 size. The shapes have changed:
    1. The orange L-shapes have disappeared.
    2. The blue 'E' shape in the top left has turned green (3).
    3. The blue 'F' shape in the bottom right has turned yellow (4).
    4. A new magenta (6) shape has appeared in the middle right, resembling a hollow square.
    The rest of the grid remains black (0) or empty.

