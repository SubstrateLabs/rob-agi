example_0:
  input: |
    The input grid is 19x12 in size. It consists of mostly black (0) squares with a pattern of green (3) lines. There are three horizontal green lines spanning the full width of the grid at rows 5, 8, and 13. There are also two vertical green lines running the full height of the grid at columns 4 and 7. This creates a grid-like structure dividing the space into nine sections.
  output: |
    The output grid maintains the same green (3) line structure as the input. The nine sections created by the green lines are now filled with different colors:
    1. Top-left section (3x4): filled with red (2)
    2. Top-middle section (3x3): remains black (0)
    3. Top-right section (3x5): filled with yellow (4)
    4. Middle-left section (3x4): remains black (0)
    5. Center section (3x3): filled with orange (7)
    6. Middle-right section (3x5): remains black (0)
    7. Bottom-left section (6x4): filled with blue (1)
    8. Bottom-middle section (6x3): remains black (0)
    9. Bottom-right section (6x5): filled with sky blue (8)

