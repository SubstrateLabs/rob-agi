example_2:
  input: |
    The input grid is 18x16 in size. It consists of mostly black (0) squares with a pattern of green (3) lines. There are four horizontal green lines spanning the full width of the grid at rows 3, 8, 11, and 14. There are also four vertical green lines running the full height of the grid at columns 4, 8, 12, and 15. This creates a grid-like structure dividing the space into 25 sections.
  output: |
    The output grid maintains the same green (3) line structure as the input. The 25 sections created by the green lines are now filled with different colors:
    1. Top-left corner (3x4): filled with red (2)
    2. Top edge sections (3x4 each, 3 sections): remain black (0)
    3. Top-right corner (3x1): filled with yellow (4)
    4. Left edge sections (5x4 each, 3 sections): remain black (0)
    5. Internal sections (5x4 each, 9 sections): filled with orange (7)
    6. Right edge sections (5x1 each, 3 sections): remain black (0)
    7. Bottom-left corner (4x4): filled with blue (1)
    8. Bottom edge sections (4x4 each, 3 sections): remain black (0)
    9. Bottom-right corner (4x1): filled with sky blue (8)

