example_0:
  input: |
    The input grid is 10x10. The bottom-left corner contains a 3x3 blue (1) L-shaped object. To its right, there's a 2x2 red (2) square. Further right, there's a 2x2 green (3) square. In the rightmost column, there's a vertical yellow (4) line spanning the bottom 4 rows.
  output: |
    The output grid is 10x10. The objects from the input have been rearranged and compacted towards the top-left corner. The blue L-shape is now in the top-left corner. The red square is directly below it, slightly overlapping. The green square is to the right of the red one, also slightly overlapping. The yellow line is now horizontal, positioned to the right of the green square and slightly overlapping it.

example_1:
  input: |
    The input grid is 10x10. The bottom-left corner contains a 4x4 sky blue (8) square. To its right, there's a 2x2 orange (7) square. In the bottom-right corner, there's a 3x2 red (2) rectangle.
  output: |
    The output grid is 10x10. The objects have been rearranged and compacted towards the top-left corner. The sky blue square is now in the top-left corner. The orange square is positioned to its right and slightly below, partially overlapping. The red rectangle is placed to the right of the orange square, also slightly overlapping.

example_2:
  input: |
    The input grid is 10x10. There's a vertical red (2) line in the middle, spanning from row 5 to the bottom. In the bottom-left corner, there's a 4x2 yellow (4) rectangle. In the bottom-right corner, there's a 3x3 green (3) square.
  output: |
    The output grid is 10x10. The objects have been rearranged and compacted towards the top-left corner. The yellow rectangle is now in the top-left corner. The red vertical line has been rotated to horizontal and placed directly below the yellow rectangle, slightly overlapping. The green square is positioned to the right of the red line, also slightly overlapping.