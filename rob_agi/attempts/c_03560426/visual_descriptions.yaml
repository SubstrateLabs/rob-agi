example_0:
  input: |
    A 10x10 grid with mostly black (empty) space. In the bottom-right corner, there are four distinct shapes:
    1. A blue L-shaped object (color 1) in the bottom-left corner, 3x3 in size.
    2. A red square (color 2) above the blue L, 2x2 in size.
    3. A green rectangle (color 3) to the right of the red square, 2x2 in size.
    4. A yellow vertical line (color 4) on the far right, 4 cells tall.
    These shapes are all touching the bottom edge of the grid and are separated by single columns of black space.
  output: |
    A 10x10 grid where the shapes from the input have been rearranged and compacted towards the top-left corner:
    1. The blue L-shape (color 1) is now in the top-left corner.
    2. The red square (color 2) is placed directly to the right of the blue L.
    3. The green rectangle (color 3) is below the red square.
    4. The yellow line (color 4) is now horizontal, placed below the green rectangle.
    The shapes are tightly packed with no black space between them, forming a rough staircase pattern from top-left to bottom-right. The rest of the grid is filled with black (empty) space.

example_1:
  input: |
    A 10x10 grid with shapes concentrated in the bottom half:
    1. A large sky blue square (color 8) in the bottom-left corner, 4x4 in size.
    2. An orange square (color 7) to the right of the sky blue square, 2x2 in size.
    3. A red rectangle (color 2) on the bottom-right corner, 2x3 in size.
    These shapes all touch the bottom edge of the grid and are separated by single columns of black space.
  output: |
    A 10x10 grid where the shapes have been rearranged and moved towards the top-left corner:
    1. The sky blue square (color 8) is now in the top-left corner, maintaining its 4x4 size.
    2. The orange square (color 7) is placed directly below the bottom-right corner of the sky blue square.
    3. The red rectangle (color 2) is positioned to the right of the orange square, maintaining its 2x3 size.
    The shapes are compactly arranged with no black space between them, forming an L-like shape. The rest of the grid is filled with black (empty) space.

example_2:
  input: |
    A 10x10 grid with shapes concentrated on the bottom and right edges:
    1. A yellow rectangle (color 4) in the bottom-left corner, 4x2 in size.
    2. A red vertical line (color 2) in the middle-right, 5 cells tall.
    3. A green square (color 3) in the bottom-right corner, 3x3 in size.
    These shapes are separated by single columns or rows of black space.
  output: |
    A 10x10 grid where the shapes have been rearranged and compacted towards the top-left corner:
    1. The yellow rectangle (color 4) is now in the top-left corner, rotated to be 2x4 in size.
    2. The red vertical line (color 2) is placed directly to the right of the yellow rectangle, maintaining its 5-cell height.
    3. The green square (color 3) is positioned below the red line, maintaining its 3x3 size.
    The shapes are tightly packed with no black space between them, forming a rough L-shape. The rest of the grid is filled with black (empty) space.

