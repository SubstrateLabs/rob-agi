example_0:
  input: |
    The grid is 19x18. Key observations:
    1. Colors present (in order of leftmost appearance): blue (1), red (2), sky blue (8), orange (7)
    2. Blue (1) forms an 'L' shape in the top-left, starting from (2,2)
    3. Red (2) fills the right arm of the blue 'L', starting from (3,3)
    4. Sky blue (8) forms a rectangle in the middle-left, starting from (6,4)
    5. Orange (7) forms a rectangle overlapping with sky blue, starting from (8,6)
    6. Black (0) fills the rest of the grid (empty space)
    7. Vertical extents: blue (3 rows), red (1 row), sky blue (6 rows), orange (5 rows)
  output: |
    A 5x4 grid summarizing the input:
    1. Colors are arranged in columns based on their leftmost appearance in the input
    2. Each column represents a color: sky blue (8), orange (7), blue (1), red (2)
    3. Column heights reflect the relative vertical extents of each color in the input
    4. Columns are aligned to the top, with black (0) filling any remaining space below

example_1:
  input: |
    The grid is 10x15. Key observations:
    1. Colors present (in order of leftmost appearance): red (2), blue (1), green (3)
    2. Red (2) forms a rectangle in the top-left corner, starting from (1,1)
    3. Blue (1) forms a square in the middle-left, starting from (5,3)
    4. Green (3) forms a rectangle extending from the right side of the red rectangle, starting from (3,7)
    5. Black (0) fills the rest of the grid (empty space)
    6. Vertical extents: red (3 rows), blue (2 rows), green (1 row)
  output: |
    A 3x3 grid summarizing the input:
    1. Colors are arranged in columns based on their leftmost appearance in the input
    2. Each column represents a color: red (2), blue (1), green (3)
    3. Column heights reflect the relative vertical extents of each color in the input
    4. Columns are aligned to the top, with black (0) filling any remaining space below

example_2:
  input: |
    The grid is 10x15. Key observations:
    1. Colors present (in order of leftmost appearance): sky blue (8), yellow (4), green (3)
    2. Sky blue (8) forms a square in the top-left corner, starting from (1,1)
    3. Yellow (4) forms an inverted 'T' shape in the middle-left, starting from (5,1)
    4. Green (3) forms a small rectangle within the left arm of the yellow 'T', starting from (6,3)
    5. Black (0) fills the rest of the grid (empty space)
    6. Vertical extents: sky blue (4 rows), yellow (5 rows), green (1 row)
  output: |
    A 4x3 grid summarizing the input:
    1. Colors are arranged in columns based on their leftmost appearance in the input
    2. Each column represents a color: yellow (4), sky blue (8), green (3)
    3. Column heights reflect the relative vertical extents of each color in the input
    4. Columns are aligned to the top, with black (0) filling any remaining space below
