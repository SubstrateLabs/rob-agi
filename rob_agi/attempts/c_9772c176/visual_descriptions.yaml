example_0:
  input: |
    The input grid is 29x29 in size. It contains two distinct sky blue (8) shapes. The larger shape is in the upper left corner, occupying roughly a quarter of the grid. It has a rounded, cloud-like appearance with a flat bottom edge. The smaller shape is in the lower right quadrant, occupying about a ninth of the grid. It also has a cloud-like appearance but is more compact. The rest of the grid is filled with black (0), representing empty space.
  output: |
    The output grid maintains the same sky blue (8) shapes from the input. However, it introduces yellow (4) elements around and between these shapes. The yellow forms an "aura" or halo around the larger sky blue shape, extending outwards by 1-3 pixels, with more extension on the right and bottom sides. There's also a tendril of yellow extending downwards from the larger shape, almost connecting to the smaller shape. The smaller sky blue shape has a thinner yellow border, mostly on its upper and left sides. There's also a small yellow dot below the smaller shape. The yellow elements create a sense of connection and flow between the two sky blue shapes.

example_1:
  input: |
    The input grid is 22x22 in size. It contains two distinct sky blue (8) shapes. The upper shape is roughly circular or oval, positioned in the top-center of the grid. The lower shape is larger and more irregular, resembling a wide, flattened cloud. It's positioned in the bottom-center of the grid, taking up more horizontal space. The rest of the grid is filled with black (0), representing empty space.
  output: |
    The output grid maintains the same sky blue (8) shapes from the input. It introduces yellow (4) elements around and between these shapes. The yellow forms an "aura" or halo around both sky blue shapes. The upper shape has a more pronounced yellow border on its bottom and sides. The lower shape has a thicker yellow border on its top and sides, with a slight extension upwards on the left side. There's also a significant yellow area between the two shapes, creating a visual connection. This connecting area has a slightly asymmetrical shape, with more yellow on the left side. There are also small yellow extensions or "tendrils" reaching out from both shapes into the black space, particularly noticeable above the upper shape and below the lower shape.

