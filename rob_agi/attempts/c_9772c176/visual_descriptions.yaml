example_0:
  input: |
    The input grid is 29x29. It contains two distinct sky blue (8) shapes on a black (0) background. The larger shape, occupying about 25% of the grid, is in the upper-left corner. It has a cloud-like appearance with a flat bottom edge and rounded top. The smaller shape, about 11% of the grid size, is in the lower-right quadrant. It's also cloud-like but more compact. The shapes are not touching and have clear, defined edges.
  output: |
    The output retains the original sky blue (8) shapes exactly. New yellow (4) elements are added:
    1. A halo around both sky blue shapes, 1-3 pixels wide, wider on the right and bottom.
    2. The larger shape's halo is more pronounced, especially on the bottom-right.
    3. A yellow tendril extends downward from the larger shape, almost connecting to the smaller shape.
    4. The smaller shape has a thinner yellow border, mainly on its upper-left.
    5. A small yellow dot appears below the smaller shape.
    6. Yellow pixels never directly touch sky blue pixels; there's always a one-pixel black gap.
    7. The yellow creates a visual flow between the two shapes without changing their original form.

example_1:
  input: |
    The input grid is 22x22. It features two sky blue (8) shapes on a black (0) background. The upper shape is oval, positioned in the top-center. The lower shape is larger and irregular, resembling a wide, flattened cloud in the bottom-center. It spans more horizontally than vertically. The shapes are distinct and not touching.
  output: |
    The output preserves the original sky blue (8) shapes and adds yellow (4) elements:
    1. Both shapes gain a yellow halo, varying in thickness.
    2. The upper shape's halo is thicker on the bottom and sides.
    3. The lower shape's halo is more pronounced on top and sides, with an upward extension on the left.
    4. A significant yellow area bridges the gap between the shapes, slightly left-biased.
    5. Small yellow tendrils extend into black space, notably above the upper shape and below the lower shape.
    6. Yellow pixels maintain a one-pixel black buffer from sky blue pixels.
    7. The yellow additions create a visual connection between the shapes without altering their original structure.

