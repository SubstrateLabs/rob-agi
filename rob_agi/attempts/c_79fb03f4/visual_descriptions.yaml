example_0:
  input: |
    A 20x20 grid with scattered sky blue (8) squares and three blue (1) squares. The sky blue squares are distributed throughout the grid, creating a sparse pattern. The three blue squares are located at (6,0), (11,0), and (15,0), forming a vertical line on the left side of the grid.
  output: |
    The 20x20 grid maintains the original sky blue (8) squares. The three blue (1) squares have expanded into lines and regions. A horizontal blue line spans the entire width of the grid at row 6. Vertical blue lines extend from the original blue squares to the edges of the grid. The areas between these blue lines are filled with blue, creating larger blue regions. Some sky blue squares act as barriers, preventing the blue from spreading into certain areas.

example_1:
  input: |
    A 10x10 grid with scattered gray (5) squares and two blue (1) squares. The gray squares create a sparse pattern throughout the grid. The blue squares are located at (3,0) and (8,0), both in the leftmost column.
  output: |
    The 10x10 grid maintains the original gray (5) squares. The two blue (1) squares have expanded into lines and regions. A horizontal blue line connects the two original blue squares. Vertical blue lines extend from these squares to the edges of the grid where possible. The area between these blue lines is filled with blue, creating a larger blue region. The gray squares act as barriers, preventing the blue from spreading into certain areas.

