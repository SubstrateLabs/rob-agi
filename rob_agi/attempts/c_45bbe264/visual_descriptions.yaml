example_0:
  input: |
    A 16x16 grid mostly filled with black (0). There are two colored squares:
    - A sky blue (8) square at position (2, 4)
    - A gray (5) square at position (9, 10)
    These colored squares appear to be isolated "dots" in the black space.
  output: |
    The 16x16 grid now has two intersecting lines:
    - A vertical sky blue (8) line passing through column 4
    - A horizontal gray (5) line passing through row 9
    Where these lines intersect (at position 9, 4), there is a red (2) square.
    The rest of the grid remains black (0).

