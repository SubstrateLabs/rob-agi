example_0:
  input: |
    The grid consists of magenta (6) and black (0) cells arranged in a 13x14 pattern. Vertical magenta lines dominate, with black gaps creating a barcode-like structure. Key observations:
    1. The top and bottom rows are solid magenta, except for regular black gaps.
    2. Some columns have continuous magenta lines from top to bottom.
    3. Other columns have breaks in the magenta lines, with isolated magenta cells.
    4. The second row from the top has more black cells than other rows.
    5. The rightmost column alternates between magenta and black cells.
  output: |
    The output maintains the 13x14 grid of magenta (6) and black (0) cells, with several key changes:
    1. The top and bottom rows remain unchanged.
    2. The second row from the top is now entirely black.
    3. Many isolated magenta cells have been connected, forming longer vertical lines.
    4. In columns with breaks, magenta cells often "bridge" gaps if there are magenta cells above and below.
    5. The rightmost column now has longer continuous magenta sections.
    6. Odd-numbered rows (3rd, 5th, etc.) tend to have more magenta cells than in the input.

