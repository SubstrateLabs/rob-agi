example_0:
  input: |
    The input grid is 20x8. There are six vertical lines of different colors on the left side: yellow (4), green (3), and red (2), each separated by black (0) columns. On the right side, there's a large sky blue (8) shape that resembles an inverted 'L'. This shape is 4 columns wide on top, extends down 4 rows, then narrows to 2 columns for 2 more rows. The rest of the grid is filled with black (0).
  output: |
    The output grid maintains the 20x8 size. The vertical lines from the input have been removed. The sky blue (8) shape has been transformed into three separate colored regions: yellow (4), green (3), and red (2). The yellow region occupies the top-left of the original shape, the green region is below it, and the red region is to the right. Each colored region maintains the shape of the part of the original sky blue shape it occupies. The rest of the grid remains black (0).

