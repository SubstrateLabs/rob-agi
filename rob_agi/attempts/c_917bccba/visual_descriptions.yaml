example_0:
  input: |
    The grid shows a rectangular shape made of red (2) pixels, with a green (3) cross intersecting it. The green cross extends vertically through the entire height of the grid and horizontally across the middle. The red rectangle forms the outer border of a 6x6 area in the center of the grid. The rest of the grid is filled with black (0) pixels, which can be considered as empty space.
  output: |
    The output grid shows a similar structure, but with some key changes. The green (3) cross has been shifted to the right edge of the grid, maintaining its vertical line through the entire height. The horizontal part of the cross now forms the top edge of the red (2) rectangle. The red rectangle itself remains the same size but is now positioned at the left side of the grid, touching the left edge. The rest of the grid remains filled with black (0) pixels.

