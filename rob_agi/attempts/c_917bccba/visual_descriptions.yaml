  output: |
    In the output, we see a transformation similar to the previous example. The sky blue (8) cross has been shifted to the right edge of the grid, maintaining its vertical line through the entire height. The horizontal part of the cross now forms the top edge of the blue (1) rectangle and extends to the left edge of the grid. The blue rectangle itself remains the same size but is now positioned at the left side of the grid, touching the left edge. The rest of the grid remains filled with black (0) pixels.

