example_0:
  input: |
    A 13x13 grid with a gray (5) square outline. The outline is 9x9, positioned from (1,1) to (9,9). The interior and exterior of the outline are black (0).
  output: |
    The original gray (5) outline is preserved. Inside, concentric square outlines alternate between red (2) and gray (5). Each outline is separated by a one-cell black (0) gap. The pattern is:
    - Gray (5) outline at (1,1) to (9,9)
    - Black (0) gap
    - Red (2) outline at (2,2) to (8,8)
    - Black (0) gap
    - Gray (5) outline at (3,3) to (7,7)
    - Black (0) 4x4 square in the center

example_1:
  input: |
    A 6x6 grid entirely filled with a gray (5) square outline. There is no black (0) exterior.
  output: |
    The original gray (5) outline is preserved. Inside, the pattern is:
    - Gray (5) outline covering the entire 6x6 grid
    - Red (2) outline at (1,1) to (4,4)
    - Gray (5) 2x2 square filling the center

example_2:
  input: |
    A 16x16 grid with a gray (5) rectangular outline. The outline is 11x13, positioned from (2,3) to (12,15). The interior and exterior of the outline are black (0).
  output: |
    The original gray (5) outline is preserved. Inside, concentric rectangular outlines alternate between red (2) and gray (5), each separated by a one-cell black (0) gap. The pattern is:
    - Gray (5) outline at (2,3) to (12,15)
    - Black (0) gap
    - Red (2) outline at (3,4) to (11,14)
    - Black (0) gap
    - Gray (5) outline at (4,5) to (10,13)
    - Black (0) gap
    - Gray (5) outline at (6,7) to (8,11)
    - Red (2) 3x5 rectangle filling the center

example_3:
  input: |
    A 19x19 grid with a gray (5) square outline. The outline is 17x17, positioned from (1,1) to (17,17). The interior and exterior of the outline are black (0).
  output: |
    The original gray (5) outline is preserved. Inside, concentric square outlines alternate between red (2) and gray (5), each separated by a one-cell black (0) gap. The pattern continues inward until reaching the center. The sequence is:
    - Gray (5) outline at (1,1) to (17,17)
    - Black (0) gap
    - Red (2) outline
    - Black (0) gap
    - Gray (5) outline
    - (Pattern repeats)
    ...
    - Gray (5) 3x3 square
    - Red (2) single cell at the very center
