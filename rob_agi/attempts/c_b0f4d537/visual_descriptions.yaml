example_0:
  input: |
    An 11x9 grid with a vertical gray (5) line in column 4, dividing the grid into left and right sections. 
    Left section:
    - Blue (1) vertical line in column 2
    - Green (3) horizontal line in row 2
    - Red (2) horizontal line in row 4
    - Yellow (4) dots in rows 1, 3, and 6
    Right section:
    - Mostly empty (0)
    - Yellow (4) dots scattered in columns 9 and 11
  output: |
    A 7x9 grid that preserves key features from the input:
    - Blue (1) vertical line now in the middle (column 4)
    - Green (3) horizontal line in row 3 (shifted down by 1)
    - Red (2) horizontal line in row 6 (shifted down by 2)
    - All other cells are empty (0)

example_1:
  input: |
    A 13x9 grid with a vertical gray (5) line in column 6, dividing the grid slightly off-center.
    Left section:
    - Alternating vertical lines: red (2) in columns 1 and 5, blue (1) in column 3
    - Green (3) horizontal lines in rows 2 and 4
    Right section:
    - Mostly empty (0)
    - Yellow (4) elements in top-right and bottom-right corners, and scattered in column 8
  output: |
    A 7x9 grid that maintains the pattern from the input:
    - Red (2) vertical lines in columns 2 and 6
    - Blue (1) vertical line in the middle (column 4)
    - Green (3) horizontal lines spanning all columns in rows 2 and 7
    - All other cells are empty (0)

example_2:
  input: |
    A 13x11 grid with a vertical gray (5) line in column 6, dividing the grid slightly off-center.
    Left section:
    - Alternating vertical lines: blue (1) in columns 2 and 4, red (2) in column 1, green (3) in column 5
    - Horizontal lines: red (2) in row 4, green (3) in row 2
    Right section:
    - Mostly empty (0)
    - Yellow (4) elements scattered in columns 8, 9, and 13
  output: |
    A 7x11 grid that preserves the pattern from the input:
    - Blue (1) vertical lines in columns 3 and 6
    - Red (2) horizontal line in row 4
    - Green (3) horizontal line in row 8
    - All other cells are empty (0)

example_3:
  input: |
    A 13x7 grid with a vertical gray (5) line in column 8, dividing the grid right of center.
    Left section:
    - Mostly empty (0)
    - Yellow (4) dots in a diagonal pattern from top-left to bottom-right
    Right section:
    - Vertical lines: red (2) in column 10, blue (1) in column 11, green (3) in column 12
    - Horizontal line in row 2: blue (1), red (2), green (3)
  output: |
    A 7x7 grid that captures the essential pattern from the input:
    - Red (2) vertical line in column 3
    - Green (3) vertical line in column 5
    - Blue (1) horizontal line in row 5
    - All other cells are empty (0)
