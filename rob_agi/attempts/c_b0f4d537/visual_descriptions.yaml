example_0:
  input: |
    An 11x9 grid with a vertical gray (5) line in the middle, dividing the grid into two sections. The left section contains vertical blue (1) lines and horizontal patterns, while the right section has scattered yellow (4) squares.
    
    Left section:
    - A continuous vertical blue line in the second column
    - A green (3) horizontal line in the second row
    - A red (2) horizontal line in the fourth row
    - Gray (5) squares fill the bottom four rows

    Right section:
    - Scattered yellow (4) squares, mostly in the rightmost column and a few in the middle
    - Mostly empty (black) space
  output: |
    A 7x9 grid with a single vertical blue (1) line in the middle (4th column). The grid maintains the horizontal patterns from the input:
    
    - A green (3) horizontal line in the third row
    - A red (2) horizontal line in the sixth row
    - The rest of the grid is filled with black (0), creating empty space around the blue line and between the colored horizontal lines

example_1:
  input: |
    A 13x9 grid with a vertical gray (5) line slightly left of center, dividing the grid into two unequal sections. The left section is wider and contains colored patterns, while the right section has scattered yellow (4) squares.
    
    Left section:
    - Two vertical lines: red (2) in the second column and blue (1) in the fourth column
    - Two green (3) horizontal lines spanning the entire left section in the second and fourth rows
    - Gray (5) squares fill the bottom four rows

    Right section:
    - Scattered yellow (4) squares, mostly in pairs in the rightmost columns
    - Mostly empty (black) space
  output: |
    A 7x9 grid with two vertical lines: red (2) in the second column and blue (1) in the sixth column. The grid maintains the horizontal patterns from the input:
    
    - Two green (3) horizontal lines spanning the entire grid in the second and seventh rows
    - The rest of the grid is filled with black (0), creating empty space around and between the colored lines

example_2:
  input: |
    A 13x11 grid with a vertical gray (5) line slightly left of center, dividing the grid into two unequal sections. The left section is wider and contains a complex pattern, while the right section has scattered yellow (4) squares.
    
    Left section:
    - Two interleaved vertical lines: blue (1) in odd-numbered columns and alternating red (2) and green (3) in even-numbered columns
    - Gray (5) squares fill the bottom six rows

    Right section:
    - Scattered yellow (4) squares, mostly in pairs in the rightmost columns
    - Mostly empty (black) space
  output: |
    A 7x11 grid with two vertical blue (1) lines in the third and sixth columns. The grid maintains some horizontal patterns from the input:
    
    - A red (2) horizontal line in the fourth row
    - A green (3) horizontal line in the eighth row
    - The rest of the grid is filled with black (0), creating empty space around and between the colored lines

example_3:
  input: |
    A 13x7 grid with a vertical gray (5) line slightly right of center, dividing the grid into two unequal sections. The left section is wider and contains scattered yellow (4) squares, while the right section has a pattern of vertical lines.
    
    Left section:
    - Scattered yellow (4) squares, mostly in odd-numbered columns
    - Mostly empty (black) space
    - Gray (5) squares fill the bottom three rows

    Right section:
    - Three vertical lines: red (2), blue (1), and green (3) from left to right
    - Gray (5) squares fill the bottom four rows
  output: |
    A 7x7 grid with three vertical lines: red (2) in the third column, blue (1) in the fifth column, and green (3) in the fourth column. The grid also contains a horizontal pattern:
    
    - A blue (1) horizontal line in the fifth row
    - The rest of the grid is filled with black (0), creating empty space around and between the colored lines