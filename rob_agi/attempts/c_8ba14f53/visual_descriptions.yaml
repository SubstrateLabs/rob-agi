    3. A sky blue (8) shape on the right side, forming a rectangular frame with a black center.
  output: |
    A 3x3 grid with three distinct rows:
    1. Top row: Orange (7) filling the entire row.
    2. Middle row: Sky blue (8) on the left and center, black (0) on the right.
    3. Bottom row: Entirely black (0).

