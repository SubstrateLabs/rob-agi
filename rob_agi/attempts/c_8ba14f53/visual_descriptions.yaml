example_0:
  input: |
    A 4x9 grid with three distinct shapes:
    1. A vertical black line on the left side.
    2. A yellow (4) shape in the top-left corner, resembling an inverted 'L'.
    3. A magenta (6) shape occupying most of the right side, forming a large 'C'.
    The magenta shape has a black void in its center.
  output: |
    A 3x3 grid with three distinct rows:
    1. Top row: Yellow (4) on the left, black (0) in the center and right.
    2. Middle row: Magenta (6) filling the entire row.
    3. Bottom row: Magenta (6) filling the entire row.

example_1:
