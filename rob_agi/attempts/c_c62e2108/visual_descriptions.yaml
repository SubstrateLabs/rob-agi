example_0:
  input: |
    Grid size: 18x17
    Key features:
    1. Red (2) square outline: 4x4, top-left quadrant (starts at row 2, column 2)
    2. Blue (1) vertical line: 4 pixels tall, right edge (column 16, rows 2-5)
    3. Black (0) background: fills the rest of the grid
    Observation: Only one non-blue shape present, located in top-left quadrant

  output: |
    Grid size: 18x17 (unchanged)
    Transformations:
    1. Red (2) square pattern:
       - Original 4x4 square preserved
       - Expanded horizontally: 3 squares wide
       - Expanded vertically: 2 squares tall
       - Top row: continuous red line connecting all squares
       - Pattern forms a 2x3 grid of connected square outlines
    2. Blue (1) line: removed completely
    3. Black (0) background: preserved in areas not occupied by expanded red pattern
    Key insight: Top-left shapes expand to form a 2x3 grid with a connecting top line

example_1:
  input: |
    Grid size: 22x19
    Key features:
    1. Sky blue (8) square outline: 4x4, center (starts at row 8, column 8)
    2. Sky blue (8) square outline: 4x4, bottom-left quadrant (starts at row 14, column 2)
    3. Blue (1) lines:
       - Horizontal: top edge (row 0, columns 8-11)
       - Vertical: right edge (column 18, rows 8-11)
       - Horizontal: bottom edge (row 21, columns 2-5)
    4. Black (0) background: fills the rest of the grid
    Observation: Two non-blue shapes present, in different quadrants

  output: |
    Grid size: 22x19 (unchanged)
    Transformations:
    1. Center sky blue (8) square:
       - Expanded horizontally: 4 squares wide
       - Expanded vertically: 2 squares tall
       - Top and bottom rows: continuous sky blue lines connecting all squares
       - Pattern forms a 2x4 grid of connected square outlines
    2. Bottom-left sky blue (8) square:
       - Expanded vertically: 4 identical squares in a column
    3. All blue (1) lines: removed completely
    4. Black (0) background: preserved in areas not occupied by expanded patterns
    Key insights:
    - Center shapes expand both horizontally and vertically
    - Bottom-left shapes expand vertically to form a column

example_2:
  input: |
    Grid size: 22x22
    Key features:
    1. Green (3) square outline: 4x4, top-left quadrant (starts at row 5, column 6)
    2. Green (3) square outline: 4x4, bottom-right quadrant (starts at row 11, column 12)
    3. Blue (1) lines:
       - Horizontal: top edge (row 0, columns 6-9)
       - Vertical: left edge (column 0, rows 5-8)
       - Vertical: right edge (column 21, rows 11-14)
       - Horizontal: bottom edge (row 21, columns 12-15)
    4. Black (0) background: fills the rest of the grid
    Observation: Two non-blue shapes present, in opposite quadrants

  output: |
    Grid size: 22x22 (unchanged)
    Transformations:
    1. Top-left green (3) square:
       - Expanded horizontally: 3 squares wide
       - Expanded vertically: 2 squares tall
       - Top and bottom rows: continuous green lines connecting all squares
       - Pattern forms a 2x3 grid of connected square outlines
    2. Bottom-right green (3) square:
       - Expanded similarly to top-left, forming a 2x3 grid
       - Additional expansion: extra column on the right side
       - Top row: continuous green line connecting all squares
    3. All blue (1) lines: removed completely
    4. Black (0) background: preserved in areas not occupied by expanded patterns
    Key insights:
    - Top-left shapes expand to a 2x3 grid with connecting top and bottom lines
    - Bottom-right shapes expand similarly but with an extra right column
