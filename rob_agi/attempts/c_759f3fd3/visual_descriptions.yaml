example_0:
  input: |
    A 20x20 grid with a green (3) cross shape. The cross is formed by a vertical line in column 7 and a horizontal line in row 5. The rest of the grid is filled with black (0).
  output: |
    The same 20x20 grid with the green (3) cross maintained. Additionally, a complex yellow (4) pattern has been added. This pattern consists of:
    1. A yellow border around the entire grid, except where it intersects with the green cross.
    2. Yellow rectangles of varying sizes in each quadrant created by the green cross.
    3. These rectangles are nested, with the largest ones near the cross and smaller ones towards the corners.
    4. The spaces between the yellow rectangles remain black (0).

example_1:
  input: |
    A 10x10 grid with a green (3) cross shape. The cross is formed by a vertical line in column 6 and a horizontal line in row 4. The rest of the grid is filled with black (0).
  output: |
    The same 10x10 grid with the green (3) cross maintained. A yellow (4) pattern has been added:
    1. A yellow border around the entire grid, except where it intersects with the green cross.
    2. In each quadrant created by the green cross, there are nested yellow rectangles.
    3. The largest rectangle is adjacent to the cross, with smaller ones inside it.
    4. The spaces between the yellow rectangles and inside the innermost rectangle remain black (0).
    5. The pattern is symmetrical across both the horizontal and vertical axes of the cross.

