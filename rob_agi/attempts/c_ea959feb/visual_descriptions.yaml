example_0:
  input: |
    The input grid is a 22x25 rectangular pattern. It consists of a repeating sequence of colors (1-6) in diagonal stripes. However, there are several irregular areas:
    1. In the top-left corner, there's a triangular area of color 1 (blue).
    2. In the middle-left, there's a rectangular area of color 1 (blue).
    3. In the bottom-right corner, there's a triangular area of color 1 (blue).
    4. There are a few scattered single-cell irregularities of color 1 (blue) throughout the grid.
    These irregular areas disrupt the otherwise consistent diagonal stripe pattern.
  output: |
    The output grid is the same size as the input (22x25). It shows a perfect diagonal stripe pattern of colors 1-6, repeating consistently across the entire grid. All the irregular areas and single-cell disruptions present in the input have been "corrected" to match the overall diagonal stripe pattern.

