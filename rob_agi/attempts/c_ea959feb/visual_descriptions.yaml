example_0:
  input: |
    The input grid is 22x25 cells. The underlying pattern consists of diagonal stripes of colors 1-6 repeating in sequence. This pattern is disrupted by:
    1. A triangular area of color 1 (blue) in the top-left corner, spanning about 7x7 cells.
    2. A rectangular area of color 1 (blue) in the middle-left, approximately 5x5 cells.
    3. A triangular area of color 1 (blue) in the bottom-right corner, spanning about 5x5 cells.
    4. Scattered single cells of color 1 (blue) throughout, breaking the stripe pattern.
    The diagonal stripes slope down from left to right at approximately a 45-degree angle.
    Each color typically spans 2-3 cells in width before transitioning to the next color.
  output: |
    The output grid maintains the 22x25 size but shows a perfect diagonal stripe pattern.
    Colors 1-6 repeat in sequence, forming continuous stripes from top-left to bottom-right.
    Each stripe is consistently 2-3 cells wide.
    All irregularities from the input (triangles, rectangle, scattered cells) are replaced with the correct colors to maintain the stripe pattern.
    The pattern appears to repeat every 6 columns horizontally and every 3 rows vertically.

