example_0:
  input: |
    A 30x30 grid with a complex pattern. The grid is mostly filled with black (0), red (2), and gray (5) squares, creating a noisy background. There are four distinct colored regions:
    1. A sky blue (8) region in the top-left quadrant, roughly 7x7 squares.
    2. A yellow (4) region in the top-right quadrant, roughly 5x5 squares.
    3. A blue (1) region in the bottom-left quadrant, roughly 7x7 squares.
    4. An orange (7) region in the bottom-right quadrant, roughly 5x5 squares.
    These colored regions are surrounded by their respective colors in a more scattered pattern. There are also some green (3) squares scattered throughout the grid, mostly on the right side.
  output: |
    A 3x3 grid representing a simplified version of the input. The colors are arranged as follows:
    Top row: [8, 4, 3]
    Middle row: [1, 3, 7]
    Bottom row: [8, 4, 1]
    This grid seems to capture the main colors from the larger regions in the input, with the addition of green (3) in two positions.

example_1:
  input: |
    A 30x30 grid with a distinct pattern. The grid has a noisy background of black (0) and sky blue (8) squares. There are six main colored regions:
    1. A green (3) region in the top-left, roughly 6x6 squares.
    2. A blue (1) region in the top-center, roughly 8x8 squares.
    3. A brown (9) region in the top-right, roughly 5x5 squares.
    4. A magenta (6) region in the middle-left, roughly 6x6 squares.
    5. A yellow (4) region in the center, roughly 6x6 squares.
    6. A red (2) region in the bottom-left, roughly 5x5 squares.
    These regions are mostly solid colors with some scattered squares of their color around them. There's also an orange (7) region in the bottom-right, but it's smaller and less defined than the others.
  output: |
    A 2x3 grid representing a simplified version of the input. The colors are arranged as follows:
    Top row: [3, 1, 9]
    Bottom row: [6, 4, 1]
    This grid captures the main colors from the larger regions in the input, excluding the less prominent red and orange regions.

example_2:
  input: |
    A 30x30 grid with a complex, noisy pattern. The background is primarily composed of blue (1) and brown (9) squares, creating a scattered effect. There are several distinct colored regions:
    1. A yellow (4) region in the center-left, roughly 6x6 squares.
    2. A sky blue (8) region in the top-left and center-left, forming two connected areas.
    3. An orange (7) region in the center-top, roughly 4x4 squares.
    4. A green (3) region in the top-right, roughly 5x5 squares.
    5. A red (2) region in the bottom-left, roughly 5x5 squares.
    6. A yellow (4) region in the bottom-right, roughly 5x5 squares.
    These regions are mostly solid colors with some scattered squares of their color around them. The grid also contains some magenta (6) squares, but they don't form a distinct region.
  output: |
    A 3x3 grid representing a simplified version of the input. The colors are arranged as follows:
    Top row: [8, 4, 8]
    Middle row: [3, 7, 3]
    Bottom row: [2, 8, 4]
    This grid captures the main colors from the larger regions in the input, with some repetition of colors (8 appears three times, 4 twice, and 3 twice).

