example_0:
  input: |
    A 4x4 grid with a distinct pattern. The corners are yellow (4). A diagonal line of brown (9) runs from top-left to bottom-right. The remaining squares alternate between blue (1) and magenta (6) in a checkerboard pattern. This creates a symmetrical design with rotational properties.
  output: |
    An 8x8 grid composed of four transformed versions of the input. Top-left: original 4x4 grid. Top-right: horizontally flipped. Bottom-left: vertically flipped. Bottom-right: 90-degree clockwise rotation followed by a horizontal flip. The resulting pattern maintains symmetry but with interesting variations in each quadrant.

example_1:
  input: |
    A 4x4 grid with varied colors. Top row: magenta (6), red (2), magenta, red. Second row: magenta, magenta, gray (5), gray. Third row: blue (1), blue, blue, red. Bottom row: gray, blue, red, blue. Note the partial symmetry and color groupings.
  output: |
    An 8x8 grid showcasing four transformations of the input. Top-left: original. Top-right: horizontal flip, swapping left-right colors. Bottom-left: vertical flip, inverting top-bottom colors. Bottom-right: 90-degree clockwise rotation then horizontal flip, creating a distinct pattern. Observe how color groupings and symmetries change in each quadrant.

example_2:
  input: |
    A 4x4 grid with a structured pattern. Top row: magenta (6), orange (7), magenta, orange. Second row: orange, blue (1), magenta, magenta. Third and fourth rows mirror this pattern with brown (9) replacing orange in the left column. This creates a balance between repetition and variation.
  output: |
    An 8x8 grid demonstrating four transformations. Top-left: original pattern. Top-right: horizontal flip, reversing left-right color order. Bottom-left: vertical flip, inverting top-bottom colors. Bottom-right: 90-degree clockwise rotation followed by horizontal flip, producing a unique arrangement. Notice how the brown squares and color patterns shift in each quadrant.

example_3:
  input: |
    A 4x4 grid with a complex color arrangement. Top row: yellow (4), brown (9), blue (1), sky (8). Second row: sky, yellow, blue, sky. Third row: yellow, sky, sky, blue. Bottom row: blue, blue, blue, sky. Observe the distribution of colors and potential for symmetry.
  output: |
    An 8x8 grid showcasing four versions of the input. Top-left: original 4x4 grid. Top-right: horizontal flip, reversing color order in each row. Bottom-left: vertical flip, inverting row order. Bottom-right: 90-degree clockwise rotation then horizontal flip, creating a new color distribution. Pay attention to how the yellow corners and sky blue sections transform in each quadrant.

example_4:
  input: |
    A 4x4 grid with alternating colors. Top row: blue (1), red (2), blue, red. Second row: magenta (6), magenta, orange (7), magenta. Third row: orange, magenta, red, blue. Bottom row: blue, magenta, red, magenta. Note the diagonal and alternating color patterns.
  output: |
    An 8x8 grid displaying four transformations of the input. Top-left: original pattern. Top-right: horizontal flip, reversing colors in each row. Bottom-left: vertical flip, inverting row order. Bottom-right: 90-degree clockwise rotation followed by horizontal flip, producing a unique arrangement. Observe how the diagonal patterns and color distributions change across the quadrants.
