example_0:
  input: |
    A large 23x20 grid predominantly filled with sky blue (8). There are two distinct black (0) regions:
    1. A larger region in the top-left quadrant, roughly 9x9 in size. It contains a single green (3) cell near its center.
    2. A smaller region in the bottom-right quadrant, roughly 6x6 in size. This region contains a more complex pattern of yellow (4) and green (3) cells forming a cross-like shape.
  output: |
    A smaller 9x9 grid with a black (0) background. In the center is a pattern identical to the one found in the bottom-right quadrant of the input grid: a cross-like shape made of yellow (4) cells with a green (3) cell in the middle-left position.

example_1:
  input: |
    A 22x21 grid mostly filled with sky blue (8). There are two separate black (0) regions:
