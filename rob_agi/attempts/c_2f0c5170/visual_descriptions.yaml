example_0:
  input: |
    The input grid is 23x20. The majority is sky blue (8), with two distinct black (0) regions:
    1. Top-left: Larger black region (9x10)
      - Contains a single green (3) cell near the center-left
      - This pattern is simpler and less spread out
    2. Bottom-right: Smaller black region (6x7)
      - Contains a more complex pattern:
        - Central yellow (4) cell
        - Four yellow (4) cells in a cross pattern around the center
        - Green (3) cell below the central yellow cell
      - This pattern has more non-black cells, color variety, and is more spread out
    Key observation: The bottom-right pattern is more complex despite being in a smaller region.

  output: |
    Output grid is 9x9, centered, with black (0) background.
    The pattern from the bottom-right region of the input is preserved:
    - Central yellow (4) cell
    - Four yellow (4) cells in a cross pattern
    - Green (3) cell below the center
    The pattern maintains its original shape and color distribution.
    There's a minimal black border around the pattern, making the grid size odd for perfect centering.

