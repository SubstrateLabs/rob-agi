    2. A larger 6x8 region in the bottom-left quadrant containing a pattern of yellow (4) cells forming a diamond shape with a red (2) cell at its center.
  output: |
    A 5x5 grid with a black (0) background. The pattern from the larger black region in the input is centered here: a diamond shape made of yellow (4) cells with a red (2) cell at its center.

