example_0:
  input: |
    A 10x10 grid with a mix of black (0), blue (1), and green (3) squares. There's a noticeable pattern of black squares forming a continuous path that starts from the top edge, winds through the grid, and ends at the right edge. This path is not straight but meanders through the grid, sometimes touching itself but never crossing. The rest of the grid is filled with blue and green squares in no particular pattern.
  output: |
    The same 10x10 grid structure, but with significant changes. The continuous path of black squares from the input has been transformed into a path of gray (5) squares, maintaining its exact shape and route. All other black squares not part of this main path have been changed to red (2). The blue and green squares remain unchanged in their positions. This creates a clear visual of a gray path winding through the grid against a background of mixed colors.

