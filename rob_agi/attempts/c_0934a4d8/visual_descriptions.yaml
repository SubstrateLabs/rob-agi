example_0:
  input: |
    A 30x30 grid with a complex pattern. The dominant colors are blue (1), brown (9), and green (3). There's a distinct blue L-shape in the top-left corner. The center of the grid has a mix of colors, including magenta (6), orange (7), and yellow (4). The bottom-right corner has a pattern of alternating blue and brown squares. There are several isolated green squares scattered throughout.
  output: |
    A smaller 4x4 grid. The top-left corner is green (3). The top-right and bottom-left corners are blue (1). The bottom-right corner is brown (9). This appears to be a simplified representation of the larger input grid, capturing key color positions.

example_1:
  input: |
    Another 30x30 grid with a different complex pattern. The dominant colors are green (3), blue (1), and yellow (4). There's a distinct pattern of sky blue (8) squares forming a large square in the bottom-right quadrant. The center has a mix of colors, including red (2) and gray (5). The top-left quadrant has a pattern of alternating green and blue squares.
  output: |
    A 5x4 grid. The top row alternates between green (3) and yellow (4). The second row has blue (1) on the edges with yellow (4) in the center. The third row is mostly gray (5) with blue on the left edge. The bottom row is blue on the edges with sky blue (8) in the center. This seems to capture key color patterns from different regions of the input grid.

example_2:
  input: |
    A 30x30 grid with yet another complex pattern. The dominant colors are green (3), blue (1), and brown (9). There's a distinct pattern of gray (5) squares forming a large square in the center. The corners have patterns of alternating colors, with green and blue in the top-left, brown and magenta (6) in the top-right, yellow (4) and orange (7) in the bottom-left, and blue and brown in the bottom-right.
  output: |
    A 9x4 grid. The left column alternates between brown (9) and blue (1). The second column is mostly green (6) with some variation. The third column is mostly brown (9) with some variation. The right column alternates between yellow (4) and blue (1). This grid seems to capture color patterns from different regions of the input, particularly the corners and edges.

