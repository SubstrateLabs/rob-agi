example_0:
  input: |
    A large 21x18 grid mostly filled with black (0) squares. There are several blue (1) regions scattered throughout, with yellow (4) and magenta (6) squares interspersed within these blue regions. The blue regions vary in size and shape, some forming rectangles or L-shapes. The largest blue region is in the center-left, spanning about 6x8 squares. Yellow and magenta squares appear to be randomly placed within the blue areas, often near the edges or corners of these regions.
  output: |
    A small 5x5 blue (1) square with a magenta (6) square in the top-right corner and a yellow (4) square in the bottom-right corner. This appears to be a subset or extraction of one of the blue regions from the input grid, specifically focusing on an area that contains both a yellow and a magenta square.

example_1:
