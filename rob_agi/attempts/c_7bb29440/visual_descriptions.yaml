example_2:
  input: |
    A 22x21 grid with a mix of black (0) and blue (1) squares. The blue squares form several distinct rectangular regions of varying sizes. Within these blue rectangles, there are yellow (4) and magenta (6) squares scattered throughout. The largest blue region is roughly 9x6 squares in the top-left corner. The distribution of yellow and magenta squares within the blue areas seems more uniform compared to previous examples, with multiple instances in each blue region.
  output: |
    A 4x6 blue (1) rectangle. It contains a magenta (6) square in the third row, third column, and a yellow (4) square in the fourth row, fifth column. This rectangle appears to be extracted from one of the larger blue regions in the input grid, specifically one that contains both magenta and yellow squares.

example_3:
  input: |
    A 12x11 grid mostly filled with black (0) squares. There are two distinct blue (1) rectangular regions. The first is a 4x3 rectangle in the top-left corner, containing two yellow (4) squares. The second is a 6x4 rectangle in the bottom-right quadrant, containing one magenta (6) square. These blue regions are completely separated by black squares.
  output: |
    A 4x6 blue (1) rectangle. It contains a magenta (6) square in the third row, third column. This rectangle appears to be an expanded version of the 6x4 blue rectangle from the input grid, with the rows and columns swapped (transposed) and extended to include more blue squares.

