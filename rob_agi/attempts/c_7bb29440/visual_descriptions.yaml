example_0:
  input: |
    A 21x18 grid with multiple blue (1) regions surrounded by black (0). Key features:
    1. Largest blue region: Center-left, approximately 6x8.
    2. Special squares: Yellow (4) and magenta (6) within blue regions.
    3. Blue region shapes: Varied, including rectangles and L-shapes.
    4. Special square distribution: Often near edges or corners of blue regions.
    5. Multiple blue regions contain both yellow and magenta squares.
  output: |
    A 5x5 blue (1) rectangle extracted from the input. Key features:
    1. Magenta (6) square: Top-right corner.
    2. Yellow (4) square: Bottom-right corner.
    3. Represents the largest blue rectangle containing both types of special squares.

example_1:
  input: |
    A 22x20 grid with distinct blue (1) rectangular regions amid black (0). Key features:
    1. Largest blue region: Bottom-left quadrant, approximately 9x8.
    2. Special squares: Yellow (4) and magenta (6) within blue rectangles.
    3. Blue regions: More structured and rectangular than example_0.
    4. Special square distribution: Often near edges or corners of blue rectangles.
    5. Multiple blue regions contain both yellow and magenta squares.
  output: |
    A 3x5 blue (1) rectangle extracted from the input. Key features:
    1. Yellow (4) square: Top-left corner.
    2. Magenta (6) square: Middle of the second row.
    3. Represents the optimal rectangle based on special square count and position.

example_2:
  input: |
    A 22x21 grid with multiple blue (1) rectangular regions amid black (0). Key features:
    1. Largest blue region: Top-left corner, approximately 9x6.
    2. Special squares: Yellow (4) and magenta (6) scattered throughout blue areas.
    3. Special square distribution: More uniform than previous examples.
    4. Multiple special squares in each blue region.
    5. Various sizes of blue rectangular regions.
  output: |
    A 4x6 blue (1) rectangle extracted from the input. Key features:
    1. Magenta (6) square: Third row, third column.
    2. Yellow (4) square: Fourth row, fifth column.
    3. Represents the optimal rectangle based on size and special square count.

example_3:
  input: |
    A 12x11 grid with two distinct blue (1) rectangular regions amid black (0). Key features:
    1. Top-left blue region: 4x3 rectangle with two yellow (4) squares.
    2. Bottom-right blue region: 6x4 rectangle with one magenta (6) square.
    3. Blue regions are completely separated by black squares.
    4. No blue regions contain both yellow and magenta squares.
  output: |
    A 4x6 blue (1) rectangle derived from the input. Key features:
    1. Magenta (6) square: Third row, third column.
    2. Expanded from the 6x4 bottom-right input region.
    3. Transposed and extended to maximize blue area while including the magenta square.

example_4:
  input: |
    A 22x15 grid with multiple blue (1) rectangular regions amid black (0). Key features:
    1. Largest blue region: Center-right, approximately 6x6.
    2. Special squares: Yellow (4) and magenta (6) distributed within blue areas.
    3. Varying special square density: Some regions have multiple, others have few.
    4. Blue regions of various sizes scattered throughout the grid.
    5. Multiple blue regions contain both yellow and magenta squares.
  output: |
    A 7x5 blue (1) rectangle extracted from the input. Key features:
    1. Two yellow (4) squares: Third row, second column; fifth row, third column.
    2. No magenta squares included.
    3. Represents the largest rectangle with the most special (yellow) squares.

test_case_0:
  input: |
    A 21x18 grid with multiple blue (1) rectangular regions amid black (0). Key features:
    1. Largest blue region: Bottom-left quadrant, approximately 11x8.
    2. Special squares: Yellow (4) and magenta (6) distributed within blue areas.
    3. Varying special square density across blue regions.
    4. Multiple blue regions of different sizes throughout the grid.
    5. Some blue regions contain both yellow and magenta squares.
  output: |
    Output not provided. The solution should extract the optimal blue rectangle based on:
    1. Maximum number of special squares (yellow and magenta).
    2. Largest area if special square count is tied.
    3. Most top-left position if area and special square count are tied.
