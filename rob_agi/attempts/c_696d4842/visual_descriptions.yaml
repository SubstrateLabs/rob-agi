example_0:
  input: |
    A 30x30 grid with mostly black (empty) space. There's a yellow (4) vertical line in column 6, extending from row 4 to row 14. This line has a horizontal extension to the right at row 14, spanning from column 7 to column 12. There's an isolated red (2) dot at row 14, column 18. In the bottom right quadrant, there's a blue (1) shape that looks like an inverted 'L'. It starts at row 22, column 9 with a horizontal line extending to column 13, then drops down vertically to row 26. There's also an isolated magenta (6) dot at row 23, column 3.
  output: |
    The 30x30 grid maintains its overall structure but with significant changes. The yellow vertical line now starts as red (2) from row 4 to row 10, then changes to yellow (4) from row 11 to row 14. The horizontal yellow extension remains unchanged. The isolated red dot has disappeared. The blue inverted 'L' shape has transformed into a magenta (6) shape. It maintains its position but now extends further horizontally, spanning from column 3 to column 13 in row 23, and then drops down vertically to row 26 in column 11. The isolated magenta dot has vanished.

example_1:
  input: |
    A 20x20 grid with several distinct shapes. In the top left, there's a green (3) 'L' shape starting at row 4, column 2, extending right to column 6, then down to row 6. A yellow (4) dot appears at row 5, column 10. In the center, there's a complex yellow shape resembling a sideways 'E', starting at row 4, column 8, extending down to row 6, with three horizontal protrusions to the left. At the bottom, there's a magenta (6) inverted 'T' shape, with its vertical line in column 10 from row 10 to row 15, and its horizontal line at row 15 from column 4 to column 10. There's also an isolated sky blue (8) dot at row 10, column 6.
  output: |
    The 20x20 grid maintains its overall structure but with color changes and extensions. The green 'L' shape in the top left has transformed into a sky blue (8) color and extended its horizontal part to column 7. The yellow dot at (5,10) has changed to magenta (6). The yellow 'E' shape in the center remains yellow but has extended vertically, now reaching from row 4 to row 10. The magenta inverted 'T' shape at the bottom has changed color. Its vertical line is now yellow (4) from row 10 to row 14, and magenta (6) at row 15. The horizontal part at row 15 has extended, now spanning from column 4 to column 11. The isolated sky blue dot has disappeared.

example_2:
  input: |
    A 20x20 grid with several shapes. In the top left, there's a yellow (4) shape resembling a backwards 'F', starting at row 3, column 2, with its vertical line extending to row 6, and two horizontal lines at rows 3 and 6. There's an isolated magenta (6) dot at row 0, column 8. In the center right, there's a vertical yellow line from row 4 to row 6 in column 8. At the bottom, there's a green (3) shape like a sideways 'E', with its vertical line in column 9 from row 12 to row 16, and three horizontal lines extending left. There's an isolated sky blue (8) dot at the bottom right corner (row 19, column 18).
  output: |
    The 20x20 grid maintains its overall structure but with color changes and extensions. The yellow 'F' shape in the top left has transformed. Its vertical line and top horizontal line have changed to magenta (6), while the bottom horizontal line remains yellow. The isolated magenta dot at the top has extended into a vertical magenta line from row 0 to row 6. The central vertical yellow line has extended upwards to connect with this magenta line. At the bottom, the green 'E' shape has changed to sky blue (8) and extended. Its vertical line now reaches from row 12 to row 16, and its horizontal lines have extended left to touch the left edge of the grid. The isolated sky blue dot in the bottom right has extended into a horizontal line spanning the entire width of the grid in row 16.

