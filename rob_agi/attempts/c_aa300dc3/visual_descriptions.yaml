example_0:
  input: |
    A 10x10 grid with a gray (5) border surrounding a mostly black (0) interior. The black area has irregular gray protrusions and islands, creating a complex shape. The gray border is one cell thick on all sides.
  output: |
    Identical to the input, but with a diagonal line of sky blue (8) squares cutting through the black area. The line starts at the top-left corner of the black region and ends at the bottom-right corner, consisting of exactly 8 sky blue squares placed diagonally. The line avoids gray areas, weaving through the black space.

