example_0:
  input: |
    An 8x8 grid with a checkerboard pattern of gray (5) and red (2) squares in the top-left 7x7 section. The rightmost column and bottom row are entirely blue (1).
  output: |
    An 8x8 grid with a perfect checkerboard pattern of gray (5) and red (2) squares covering the entire grid, including the areas that were originally blue.

example_1:
  input: |
    A 20x20 grid. The top-left 11x11 section contains a checkerboard pattern of green (3) and magenta (6). The rest of the grid is filled with sky blue (8) squares.
  output: |
    A 20x20 grid filled entirely with a perfect checkerboard pattern of green (3) and magenta (6) squares, extending the pattern to cover the areas that were originally sky blue.

example_2:
  input: |
    A 9x9 grid. The top-left 8x8 section contains a checkerboard pattern of orange (7) and green (3). The rightmost column and bottom row are entirely yellow (4).
  output: |
    A 9x9 grid filled entirely with a perfect checkerboard pattern of orange (7) and green (3) squares, extending the pattern to cover the areas that were originally yellow.

