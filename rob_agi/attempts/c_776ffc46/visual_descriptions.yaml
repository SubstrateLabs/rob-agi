example_0:
  input: |
    A 20x20 grid with mostly black (empty) space. There are several distinct features:
    1. A gray L-shaped border in the top-left corner, 7 units wide and 7 units tall.
    2. A 3x3 red square inside this gray border, positioned at (2,2) to (4,4).
    3. A 3x3 blue square in the top-right corner, from (1,13) to (3,15).
    4. Four separate blue shapes:
       a. A vertical line of 4 blue squares at (12,3) to (15,3).
       b. A 3x3 blue square at (9,10) to (11,12).
       c. A blue plus sign (+) shape centered at (8,11).
       d. Another blue plus sign (+) shape centered at (16,15).
  output: |
    The grid is mostly identical to the input, with two key changes:
    1. The 3x3 blue square in the top-right corner remains unchanged.
    2. Both blue plus sign shapes have been transformed into red plus sign shapes.
    All other blue shapes (the vertical line and the 3x3 square) remain blue.
    The gray border and the red square inside it are unchanged.

