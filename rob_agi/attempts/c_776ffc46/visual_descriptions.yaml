example_0:
  input: |
    A 20x20 grid with mostly black (empty) space. Key features:
    1. Gray border: L-shaped in the top-left corner (7x7).
    2. Red shape: 3x3 square inside the gray border at (2,2) to (4,4).
    3. Blue shapes:
       a. 3x3 square in the top-right corner at (1,13) to (3,15).
       b. Vertical line of 4 squares at (12,3) to (15,3).
       c. 3x3 square at (9,10) to (11,12).
       d. Plus sign (+) centered at (8,11).
       e. Plus sign (+) centered at (16,15).
    Note: The red square is the only non-blue colored shape adjacent to the gray border.
  output: |
    Changes from input:
    1. Blue plus signs at (8,11) and (16,15) transformed to red.
    2. All other shapes remain unchanged.
    Key observations:
    - Only valid blue plus shapes (5 pixels in + configuration) were transformed.
    - The target color (red) was determined by the color adjacent to the gray border.

