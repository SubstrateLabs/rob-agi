test_case_0:
  input: |
    A 20x20 grid with key features:
    1. Gray borders:
       a. L-shaped in the top-right corner (8x6).
       b. Rectangular in the bottom-left quadrant, from (13,0) to (19,6).
       c. Rectangular in the bottom-right quadrant, from (13,12) to (19,18).
    2. Red shapes:
       a. 3x3 square inside the top-right gray border at (1,14) to (3,16).
       b. Thick plus sign or cross inside the bottom-left gray border.
       c. Thick plus sign or cross inside the bottom-right gray border.
    3. Blue shapes:
       a. 3x3 square at (2,7) to (4,9).
       b. Plus sign (+) centered at (3,8).
       c. Larger plus sign (+) centered at (6,3).
       d. Plus sign (+) centered at (10,15).
       e. Plus sign (+) centered at (10,10).
    Note: Red is the only non-blue color adjacent to all gray borders.
  output: |
    Changes from input:
    1. All four blue plus signs transformed to red.
    2. All other shapes remain unchanged.
    Key observations:
    - Only valid blue plus shapes were transformed.
    - The target color (red) was determined by the color adjacent to the gray borders.
    - The larger blue plus sign was also transformed, showing size doesn't matter for valid plus shapes.
