example_0:
  input: |
    A 10x10 grid with various colored squares scattered throughout. The most prominent feature is a large gray (5) region in the center, roughly shaped like a cross or plus sign. This gray region is surrounded by empty black (0) space. There are also several colored squares around the edges: an orange (7) in the top-left corner, a magenta (6) in the top-right, two brown (9) squares in the right column, a magenta (6) and a brown (9) in the bottom-right quadrant, and another brown (9) in the bottom-left corner.
  output: |
    A 10x10 grid that appears to focus on the central region of the input. The gray cross-shaped area has been replaced with a magenta (6) region of the same shape and size. All other colored squares from the input have been removed, leaving the rest of the grid as black (0) empty space.

example_1:
  input: |
    A 10x10 grid with a smaller gray (5) cross-shaped region in the center, occupying a 3x3 area. The rest of the grid is mostly empty black (0) space with a few colored squares scattered around: a brown (9) in the top-left, a yellow (4) in the top-right and bottom-left corners, a red (2) in the second row and bottom-right corner, and three more brown (9) squares in various locations.
  output: |
    A 10x10 grid where the central gray cross has been replaced by a brown (9) cross of the same size and shape. All other colored squares from the input have been removed, leaving the rest of the grid as black (0) empty space.

