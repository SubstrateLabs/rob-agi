example_0:
  input: |
    A 22x16 grid mostly filled with black (empty space). There are four colored squares scattered across the second row: a red (2) square, a sky (8) square, a green (3) square, and another sky (8) square. In the lower part of the grid (rows 9-11), there's a distinctive red shape. It looks like a sideways 'T' or a hammer, made up of five red (2) squares.
  output: |
    The grid maintains its 22x16 size and mostly black background. The four colored squares in the second row remain unchanged. The key difference is in the lower part of the grid. The original red 'T' shape has been replicated four times across the grid, maintaining its original position and adding three new identical shapes to its right. These new shapes are in sky (8), green (3), and sky (8) colors, corresponding to the colors of the scattered squares in the second row. The replicated shapes are evenly spaced with one column of black space between them.

example_1:
  input: |
    A 17x23 grid, mostly black. There are several scattered colored squares:
    - A red (2) square in the second row, first column
    - A yellow (4) square in the fourth row, first column
    - Another yellow (4) square in the seventh row, first column
    - A green (3) square in the twelfth row, first column
    In the upper right quadrant, there's a small red shape that looks like an upside-down 'L' or a small chair. It's made of five red (2) squares.
  output: |
    The grid maintains its 17x23 size and mostly black background. The scattered colored squares in the first column remain unchanged. The key difference is the replication of the red 'L' shape:
    - The original red shape remains in its position.
    - A yellow version of the shape appears below it, aligned with the first yellow square.
    - Another yellow version appears even lower, aligned with the second yellow square.
    - A green version appears at the bottom, aligned with the green square.
    All replicated shapes maintain the same orientation and size as the original, and are vertically aligned with their corresponding color squares in the first column.

example_2:
  input: |
    A 14x23 grid, mostly black. There are several scattered colored squares:
    - A sky (8) square in the 11th row, third column
    - A green (3) square in the 16th row, third column
    - Another green (3) square in the 19th row, third column
    - A red (2) square in the 22nd row, third column
    In the lower right quadrant, there's a red shape that looks like a backwards 'C' or a partial square. It's made of seven red (2) squares, occupying a 3x3 area with the middle-right square missing.
  output: |
    The grid maintains its 14x23 size and mostly black background. The scattered colored squares in the third column remain unchanged. The key difference is the replication of the red 'C' shape:
    - A sky (8) version of the shape appears at the top of the grid, aligned with the sky square.
    - The original red shape remains in its position.
    - Two green versions of the shape appear, aligned with the two green squares.
    All replicated shapes maintain the same orientation and size as the original, and are vertically aligned with their corresponding color squares in the third column.

