example_0:
  input: |
    A 22x16 grid with a black (0) background. Key features:
    1. Leftmost column (column 0): Empty, all black (0).
    2. Top row (row 1): Four colored squares from left to right:
       - Red (2) at column 2
       - Sky blue (8) at column 5
       - Green (3) at column 8
       - Sky blue (8) at column 12
    3. Main shape: A red (2) "T" shape in the middle-left (rows 8-10, columns 1-3):
       - Horizontal line: 3 squares wide at the top (row 8)
       - Vertical line: 3 squares tall, centered (column 2)
    Note: The leftmost column is empty, and the main shape is the largest connected non-zero region.
  output: |
    The 22x16 grid retains its black (0) background and all original elements. New features:
    1. The original red (2) "T" shape remains unchanged.
    2. Three new "T" shapes appear to the right of the original, all identical in size and orientation:
       - Sky blue (8) "T" shape (rows 8-10, columns 6-8)
       - Green (3) "T" shape (rows 8-10, columns 11-13)
       - Sky blue (8) "T" shape (rows 8-10, columns 16-18)
    3. The new shapes maintain vertical alignment with the original shape.
    4. The replication order matches the color sequence in the top row.
    5. Replication stops before reaching the grid's right edge.

example_1:
  input: |
    A 17x23 grid with a black (0) background. Key features:
    1. Leftmost column (column 0): Four colored squares from top to bottom:
       - Red (2) at row 1
       - Yellow (4) at row 3
       - Yellow (4) at row 6
       - Green (3) at row 11
    2. Main shape: A red (2) plus sign in the top-right quadrant (rows 2-4, columns 9-11):
       - Horizontal line: 3 squares wide at the center (row 3)
       - Vertical line: 3 squares tall, centered (column 10)
    Note: The main shape is the largest connected non-zero region.
  output: |
    The 17x23 grid retains its black (0) background and all original elements. New features:
    1. The original red (2) plus sign remains unchanged.
    2. Three new plus signs appear below the original, all identical in size and shape:
       - Yellow (4) plus sign (rows 6-8, columns 9-11)
       - Yellow (4) plus sign (rows 11-13, columns 9-11)
       - Green (3) plus sign (rows 19-21, columns 9-11)
    3. The new shapes maintain horizontal alignment with the original shape.
    4. The replication order and colors match the sequence in the leftmost column.
    5. Replication stops before reaching the grid's bottom edge.

example_2:
  input: |
    A 14x23 grid with a black (0) background. Key features:
    1. Leftmost column (column 1): Four colored squares from top to bottom:
       - Sky blue (8) at row 10
       - Green (3) at row 15
       - Green (3) at row 18
       - Red (2) at row 21
    2. Main shape: A red (2) inverted "L" in the bottom-right quadrant (rows 18-20, columns 7-9):
       - Horizontal line: 3 squares wide at the bottom (row 20)
       - Vertical line: 3 squares tall, right-aligned (column 9)
    Note: The main shape is the largest connected non-zero region, and column 0 is empty.
  output: |
    The 14x23 grid retains its black (0) background and all original elements. New features:
    1. The original red (2) inverted "L" shape remains unchanged.
    2. Three new inverted "L" shapes appear above the original, all identical in size and orientation:
       - Sky blue (8) inverted "L" (rows 1-3, columns 7-9)
       - Green (3) inverted "L" (rows 8-10, columns 7-9)
       - Green (3) inverted "L" (rows 13-15, columns 7-9)
    3. The new shapes maintain vertical alignment with the original shape.
    4. The replication order and colors match the sequence in the leftmost non-empty column (column 1).
    5. Replication stops before reaching the grid's top edge.

