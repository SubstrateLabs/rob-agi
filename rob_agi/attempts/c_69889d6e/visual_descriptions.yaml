example_0:
  input: |
    A 10x10 grid filled with black (0), except for a single red (2) square in the bottom row at column 3 (position [9,3]).
  output: |
    A 10x10 grid with a red (2) "staircase" pattern starting from the bottom row at column 3. The pattern ascends diagonally towards the top-right corner, with each step being two cells wide. The main diagonal of this pattern is thickened to be two cells wide. All other cells remain black (0).

example_1:
  input: |
    A 10x10 grid filled with black (0), except for a single red (2) square in the bottom row at column 1 (position [9,1]).
  output: |
    A 10x10 grid with a red (2) "staircase" pattern starting from the bottom row at column 1. The pattern ascends diagonally towards the top-right corner, with each step being two cells wide. The main diagonal of this pattern is thickened to be two cells wide. The pattern reaches the top row two columns earlier than in example_0. All other cells remain black (0).

example_2:
  input: |
    A 10x10 grid filled with black (0), except for a red (2) square in the bottom row at column 1 (position [9,1]) and a blue (1) square at position [6,3].
  output: |
    A 10x10 grid with a red (2) "staircase" pattern starting from the bottom row at column 1, ascending diagonally towards the top-right. The pattern's main diagonal is two cells wide. The blue (1) square at [6,3] is preserved, remaining unchanged even as the red pattern passes through its position. All other cells not part of the red pattern remain black (0).

example_3:
  input: |
    A 10x10 grid filled with black (0), except for: a red (2) square in the bottom-left corner [9,0], two adjacent blue (1) squares at [5,4] and [5,5], and another blue (1) square at [7,1].
  output: |
    A 10x10 grid with a red (2) "staircase" pattern starting from the bottom-left corner, ascending diagonally towards the top-right. The pattern's main diagonal is two cells wide. The two adjacent blue (1) squares at [5,4] and [5,5] are preserved, remaining unchanged as the red pattern passes through. The blue square at [7,1] is replaced by red, becoming part of the staircase pattern. All other cells not part of the red pattern or original blue squares remain black (0).
