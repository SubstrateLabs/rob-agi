example_0:
  input: |
    23x23 grid. Black (0) background. Repeating pattern of gray (5) 3x3 squares with hollow centers, separated by single black rows and columns. This pattern covers most of the grid. Bottom-right corner: 3x5 area with colors - red (2), blue (1), green (3). This colored area forms a distinct 4x4 pattern including the black separator.
  output: |
    23x23 grid. Black (0) background unchanged. Gray (5) squares replaced with colors following the 4x4 pattern from bottom-right: red (2), blue (1), green (3), black (0). Pattern wraps horizontally and vertically. Colored squares maintain 3x3 size and hollow centers. Bottom-right colored area unchanged.

example_1:
  input: |
    23x23 grid. Black (0) background. Top-left corner: 5x7 area with colors - blue (1), sky blue (8), yellow (4). This forms a 4x4 pattern including black separators. Gray (5) 3x3 squares with hollow centers start from 6th column and 2nd row, extending to grid edges. Single black rows/columns separate gray squares.
  output: |
    23x23 grid. Black (0) background unchanged. Top-left colored area unchanged. Gray (5) squares replaced with colors following the 4x4 pattern from top-left: blue (1), sky blue (8), yellow (4), black (0). Pattern wraps horizontally and vertically. Colored squares maintain 3x3 size and hollow centers. Position of squares unchanged from input.

test_case_0:
  input: |
    23x23 grid. Black (0) background. No distinct color pattern in corners/edges. Gray (5) 3x3 squares with hollow centers start from 7th column and 2nd row, extending to grid edges. Single black rows/columns separate gray squares.
  output: |
    Expected: 23x23 grid. Black (0) background unchanged. Gray (5) squares replaced with colors following a 4x4 pattern derived from a non-visible source. Colored squares should maintain 3x3 size and hollow centers. Position of squares unchanged from input. Pattern should wrap horizontally and vertically if needed.
