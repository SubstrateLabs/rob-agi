example_0:
  input: |
    A 19x13 grid predominantly filled with sky blue (8). In the center, there's a 6x8 rectangular area of black (0) and red (2) pixels. The top-left corner of this area (3x3) contains a simple pattern: red pixels forming an inverted L-shape, with black pixels filling the rest.
  output: |
    The grid maintains its 19x13 size and sky blue (8) background. The central 6x8 area is now filled with an intricate pattern of black (0) and red (2) pixels. This pattern appears to be a 3x4 repetition of the original 3x3 pattern from the input, creating a larger, more complex design. The pattern consists of red pixels forming connected lines that create rectangular shapes, with black pixels filling the spaces in between.

example_1:
  input: |
    A 23x19 grid with a sky blue (8) background. There are two distinct regions of interest:
    1. Top-left: A 6x10 area starting at row 2, column 2. It contains mostly black (0) pixels with a few blue (1) pixels in the top-left corner forming a small L-shape.
    2. Bottom-right: A 6x10 area starting at row 13, column 7. It's mostly black (0) with a small cluster of green (3) pixels in the bottom-right corner forming a triangular shape.
  output: |
    The grid maintains its 23x19 size and sky blue (8) background. The two regions of interest have been transformed:
    1. Top-left: The 6x10 area is now filled with a checkered pattern of blue (1) and black (0) pixels. The pattern starts with blue in the top-left corner and alternates.
    2. Bottom-right: The 6x10 area is now filled with a more complex pattern of green (3) and black (0) pixels. The pattern appears to be a 3x3 repetition of a base pattern that includes diagonal lines of green pixels.

