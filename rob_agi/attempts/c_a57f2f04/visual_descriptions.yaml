example_0:
  input: |
    A 19x13 grid with sky blue (8) background. In the center, there's a 6x8 rectangular region of non-sky colors:
    - The top-left 3x3 area contains a red (2) inverted L-shape.
    - The rest of the region is filled with black (0).
    This non-sky region is completely surrounded by sky blue (8).
  output: |
    The grid maintains its 19x13 size and sky blue (8) background. The central 6x8 non-sky region is transformed:
    - It's now filled with a 2x2 checkerboard pattern of red (2) and black (0).
    - The pattern starts with red in the top-left corner and alternates.
    - This checkerboard pattern repeats to fill the entire 6x8 area.
    The sky blue (8) background remains unchanged.

example_1:
  input: |
    A 23x19 grid with sky blue (8) background. Two distinct non-sky regions:
    1. Top-left (6x10 area, starts at row 2, column 2):
       - Mostly black (0).
       - Small blue (1) L-shape in the top-left corner.
    2. Bottom-right (6x10 area, starts at row 13, column 7):
       - Mostly black (0).
       - Small green (3) triangle in the bottom-right corner.
    Both regions are surrounded by sky blue (8).
  output: |
    The 23x19 grid with sky blue (8) background remains. The two non-sky regions are transformed:
    1. Top-left (6x10 area):
       - Filled with a 2x2 checkerboard pattern of blue (1) and black (0).
       - Pattern starts with blue in the top-left, alternating throughout.
    2. Bottom-right (6x10 area):
       - Filled with a 3x3 pattern of green (3) and black (0).
       - Green pixels in corners and center, black pixels elsewhere.
       - This 3x3 pattern repeats to fill the entire 6x10 area.
    The sky blue (8) background remains unchanged.

