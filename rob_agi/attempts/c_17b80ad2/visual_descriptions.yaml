example_0:
  input: |
    A 17x17 grid with scattered colored dots. The dots are mostly isolated, with a few clusters. Notable features:
    - A yellow (4) dot in the top left corner
    - A brown (9) dot in the top right area
    - An orange (7) dot on the left edge, about 1/3 down
    - A sky blue (8) dot on the top edge, about 1/3 from the left
    - A cluster of three gray (5) dots at the bottom, forming a horizontal line
    - Various other colored dots scattered throughout, including blue (1), red (2), green (3), magenta (6)
  output: |
    The 17x17 grid now shows distinct vertical lines connecting some of the original dots. Key observations:
    - A yellow (4) line extends from the top left, connecting to other yellow dots
    - A brown (9) line extends down from the top right area
    - An orange (7) line on the left edge extends further down
    - A sky blue (8) line extends down from the top
    - The three gray (5) dots at the bottom are now connected vertically
    - New vertical lines appear, connecting previously isolated dots:
      - A blue (1) line in the left-center area
      - A red (2) line slightly right of center
      - A green (3) line in the upper-right quadrant
      - A magenta (6) line in the lower-right quadrant
    - Some original dots remain unconnected

example_1:
  input: |
    A 13x13 grid with scattered colored dots. Notable features:
    - A sky blue (8) dot in the top left corner
    - Two sky blue (8) dots in the middle-right area
    - A blue (1) dot near the top-right corner
    - A red (2) dot in the bottom-right corner
    - An orange (7) dot in the upper-left quadrant
    - A magenta (6) dot in the center-right area
    - Two gray (5) dots at the bottom, forming a horizontal line
    - Various other colored dots scattered throughout
  output: |
    The 13x13 grid now shows distinct vertical lines connecting some of the original dots. Key changes:
    - A yellow (4) line extends from the top, connecting previously isolated yellow dots
    - A sky blue (8) line connects the two middle-right dots, extending upwards
    - A magenta (6) line extends vertically in the right half of the grid
    - The two gray (5) dots at the bottom are now connected vertically
    - New vertical lines appear, connecting previously isolated dots:
      - A blue (1) line near the right edge
      - An orange (7) line in the left half of the grid
    - Some original dots remain unconnected, including the sky blue dot in the top-left and the red dot in the bottom-right

example_2:
  input: |
    A 12x12 grid with a few scattered colored dots. Notable features:
    - Two green (3) dots in the left column, separated by one empty row
    - A yellow (4) dot in the left column, about 2/3 down
    - An orange (7) dot followed by a magenta (6) dot in the right column, near the top
    - A sky blue (8) dot in the right column, about 2/3 down
    - Two gray (5) dots at the bottom, forming a horizontal line in the leftmost and rightmost columns
  output: |
    The 12x12 grid now shows distinct vertical lines connecting and extending from the original dots. Key changes:
    - A green (3) line extends from the top to about 1/3 down the left column
    - A yellow (4) line continues the green line to about 2/3 down the left column
    - A gray (5) line completes the left column from 2/3 down to the bottom
    - An orange (7) line extends from the top to about 1/3 down the right column
    - A magenta (6) line continues briefly in the right column
    - A sky blue (8) line extends in the right column from about 1/3 to 2/3 down
    - A gray (5) line completes the right column from 2/3 down to the bottom
    - The middle columns remain empty

example_3:
  input: |
    A 7x7 grid with only two colored dots:
    - A magenta (6) dot in the center of the grid
    - A gray (5) dot at the bottom center of the grid
  output: |
    The 7x7 grid now shows a vertical line connecting and extending from the original dots:
    - A magenta (6) line extends from the top to the center of the grid
    - A gray (5) line continues from the center to the bottom of the grid
    - This single vertical line occupies the center column of the grid
    - All other columns remain empty