          prevBtn.disabled = currentIndex === 0;
          nextBtn.disabled =
            currentIndex === individualResults[currentLayer].length - 1;
        } else {
          prevBtn.disabled = true;
          nextBtn.disabled = true;
        }
        upBtn.disabled = currentLayer === 0;
        downBtn.disabled =
          currentLayer ===
          (showingIndividual
            ? individualResults.length - 1
            : aggResults.length - 1);
      }

      function toggleView(showParagraphs) {
        showingIndividual = showParagraphs;
        currentIndex = 0;
        currentLayer = 0;
        updateContent();
      }

      summariesBtn.addEventListener("click", () => toggleView(false));
      paragraphsBtn.addEventListener("click", () => toggleView(true));
      prevBtn.addEventListener("click", () => {
        if (showingIndividual && currentIndex > 0) {
          currentIndex--;
          updateContent();
        }
      });

      nextBtn.addEventListener("click", () => {
        if (
          showingIndividual &&
          currentIndex < individualResults[currentLayer].length - 1
        ) {
          currentIndex++;
          updateContent();
        }
      });

      upBtn.addEventListener("click", () => {
        if (currentLayer > 0) {
          currentLayer--;
          updateContent();
        }
      });

      downBtn.addEventListener("click", () => {
        const maxLayer = showingIndividual
          ? individualResults.length - 1
          : aggResults.length - 1;
        if (currentLayer < maxLayer) {
          currentLayer++;
          updateContent();
        }
      });

      document.addEventListener("keydown", (event) => {
        switch (event.key) {
          case "ArrowUp":
            if (!upBtn.disabled) {
              upBtn.click();
            }
            break;
          case "ArrowDown":
            if (!downBtn.disabled) {
              downBtn.click();
            }
            break;
          case "ArrowLeft":
            if (!prevBtn.disabled) {
              prevBtn.click();
            }
            break;
          case "ArrowRight":
            if (!nextBtn.disabled) {
              nextBtn.click();
            }
            break;
          case " ": // space
            event.preventDefault(); // Prevent page scrolling
            toggleView(!showingIndividual);
            break;
        }
      });

      updateContent();
    </script>
  </body>
</html>
