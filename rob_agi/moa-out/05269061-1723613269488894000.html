e following model:\n\nSuccessfulSolve:\n\n==============\ntask_id (str): ID of the task being solved\napproach (List[str]): Detailed list of steps and thinking done to solve the problem, ordered\nsolutions (List[List[List[int]]]): List of grids representing the solution(s)\npython_function (str): Valid python function that solves the problem both for the example cases and the test case. This function should be named `solve_<challenge_id>` and take in a single argument, `input` of type ColoredGrid and return a ColoredGrid. The <challenge_id> should be replaced with the task_id of the challenge: def solve_<challenge_id>(input: ColoredGrid) -> ColoredGrid: ... \n\nMake sure that the python function that you output is a valid standalone function that takes in a ColoredGrid and returns a ColoredGrid. It should be named `solve_05269061`. Any imports should be included in the function body. There should be nothing defined or referenced in the surrounding global scope. the function should be preceded by a python code fence (```python) and followed by a closing fence (```). \n\n"

      let currentIndex = 0;
      let currentLayer = 0;
      let showingIndividual = true;

      const contentArea = document.getElementById("contentArea");
      const cardTitle = document.getElementById("cardTitle");
      const questionDiv = document.getElementById("question");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const summariesBtn = document.getElementById("summariesBtn");
      const paragraphsBtn = document.getElementById("paragraphsBtn");
      const upBtn = document.getElementById("upBtn");
      const downBtn = document.getElementById("downBtn");
      const paragraphDots = document.getElementById("paragraphDots");
      const layerDots = document.getElementById("layerDots");

      function updateContent() {
        if (showingIndividual) {
          contentArea.textContent =
            individualResults[currentLayer][currentIndex].trim();
          cardTitle.textContent = modelNames[currentIndex];
        } else {
          contentArea.textContent = aggResults[currentLayer].trim();
          cardTitle.textContent = `MoA Layer ${currentLayer + 1}`;
        }
        questionDiv.textContent = question;
        summariesBtn.classList.toggle("active", !showingIndividual);
        paragraphsBtn.classList.toggle("active", showingIndividual);
        updateButtonStates();
        updateDots();
      }

      function updateDots() {
        paragraphDots.innerHTML = "";
        layerDots.innerHTML = "";
        if (showingIndividual) {
          for (let i = 0; i < individualResults[currentLayer].length; i++) {
            const dot = document.createElement("div");
            dot.classList.add("dot");
            if (i === currentIndex) dot.classList.add("active");
            paragraphDots.appendChild(dot);
          }
        } else {
          const dot = document.createElement("div");
          dot.classList.add("dot");
          paragraphDots.appendChild(dot);
        }
        const totalLayers = showingIndividual
          ? individualResults.length
          : aggResults.length;
        for (let i = 0; i < totalLayers; i++) {
          const dot = document.createElement("div");
          dot.classList.add("dot");
          if (i === currentLayer) dot.classList.add("active");
          layerDots.appendChild(dot);
        }
      }

      function updateButtonStates() {
        if (showingIndividual) {
          prevBtn.disabled = currentIndex === 0;
          nextBtn.disabled =
            currentIndex === individualResults[currentLayer].length - 1;
        } else {
          prevBtn.disabled = true;
          nextBtn.disabled = true;
        }
        upBtn.disabled = currentLayer === 0;
        downBtn.disabled =
          currentLayer ===
          (showingIndividual
            ? individualResults.length - 1
            : aggResults.length - 1);
      }

      function toggleView(showParagraphs) {
        showingIndividual = showParagraphs;
        currentIndex = 0;
        currentLayer = 0;
        updateContent();
      }

      summariesBtn.addEventListener("click", () => toggleView(false));
      paragraphsBtn.addEventListener("click", () => toggleView(true));
      prevBtn.addEventListener("click", () => {
        if (showingIndividual && currentIndex > 0) {
          currentIndex--;
          updateContent();
        }
      });

      nextBtn.addEventListener("click", () => {
        if (
          showingIndividual &&
          currentIndex < individualResults[currentLayer].length - 1
        ) {
          currentIndex++;
          updateContent();
        }
      });

      upBtn.addEventListener("click", () => {
        if (currentLayer > 0) {
          currentLayer--;
          updateContent();
        }
      });

      downBtn.addEventListener("click", () => {
        const maxLayer = showingIndividual
          ? individualResults.length - 1
          : aggResults.length - 1;
        if (currentLayer < maxLayer) {
          currentLayer++;
          updateContent();
        }
      });

      document.addEventListener("keydown", (event) => {
        switch (event.key) {
          case "ArrowUp":
            if (!upBtn.disabled) {
              upBtn.click();
            }
            break;
          case "ArrowDown":
            if (!downBtn.disabled) {
              downBtn.click();
            }
            break;
          case "ArrowLeft":
            if (!prevBtn.disabled) {
              prevBtn.click();
            }
            break;
          case "ArrowRight":
            if (!nextBtn.disabled) {
              nextBtn.click();
            }
            break;
          case " ": // space
            event.preventDefault(); // Prevent page scrolling
            toggleView(!showingIndividual);
            break;
        }
      });

      updateContent();
    </script>
