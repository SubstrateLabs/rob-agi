      });

      downBtn.addEventListener("click", () => {
        const maxLayer = showingIndividual
          ? individualResults.length - 1
          : aggResults.length - 1;
        if (currentLayer < maxLayer) {
          currentLayer++;
          updateContent();
        }
      });

      document.addEventListener("keydown", (event) => {
        switch (event.key) {
          case "ArrowUp":
            if (!upBtn.disabled) {
              upBtn.click();
            }
            break;
          case "ArrowDown":
            if (!downBtn.disabled) {
              downBtn.click();
            }
            break;
          case "ArrowLeft":
            if (!prevBtn.disabled) {
              prevBtn.click();
            }
            break;
          case "ArrowRight":
            if (!nextBtn.disabled) {
              nextBtn.click();
            }
            break;
          case " ": // space
            event.preventDefault(); // Prevent page scrolling
            toggleView(!showingIndividual);
            break;
        }
      });

      updateContent();
    </script>
  </body>
</html>
